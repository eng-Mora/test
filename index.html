      <td style="font-size:12.5px">${repShown?escapeHtml(repShown):'<span style="color:var(--fg-dim)">—</span>'}</td>
      ${cols.map(f=>{
        const v = it.vals[f.key]||0, old = cur ? (Number(cur[f.key])||0) : null;
        const shown = u.mode==='add' ? (v ? `<div style="color:${v>0?'var(--good)':'var(--danger)'};font-weight:700">${v>0?'+':''}${fmt(v)}</div>` : '<span style="color:var(--fg-dim)">—</span>') : `<div style="font-weight:700">${fmt(v)}</div>`;
        const was = (old!==null && (u.mode==='add' ? v!==0 : old!==v)) ? `<div style="font-size:11px;color:var(--fg-dim)">كان ${fmt(old)}</div>` : '';
        return `<td class="tnum">${shown}${was}</td>`;
      }).join('')}
      <td>${statusOf(it)}</td>
    </tr>`;
  }).join('');

  box.innerHTML = `
    <div id="fdSum" class="preview-box" style="margin-top:14px"></div>
    <div class="tablewrap" style="margin-top:12px; max-height:360px; overflow:auto">
      <table style="min-width:700px">
        <thead><tr><th></th><th>الاسم في الشيت</th><th>المندوب</th>${cols.map(f=>`<th>${f.label}</th>`).join('')}<th>الحالة</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  $$('[data-fdk]').forEach(cb=>cb.onchange = e=>{
    const k = e.target.dataset.fdk;
    if(e.target.checked) u.skip.delete(k); else u.skip.add(k);
    fdCompute(); fdRenderSummary();
    e.target.closest('tr').style.opacity = e.target.checked ? '' : '.55';
  });
  fdRenderSummary();
}

function fdRenderSummary(){
  const u = fdState, box = $('#fdSum'); if(!box) return;
  const inc = u.items.filter(it=>it.include);
  const totals = {};
  inc.forEach(it=>Object.entries(it.vals).forEach(([k,d])=>{ totals[k] = upRound((totals[k]||0)+d); }));
  const newN = inc.filter(it=>!it.id).length;
  const missing = u.items.filter(it=>!it.id && !it.dup && !u.createNew).length;
  const dups = u.items.filter(it=>it.dup).length;
  const day = fdDayNow();
  const sumTxt = FD_FIELDS.filter(f=>u.cols[f.key]!=null).map(f=>`${f.label}: <b>${fmt(totals[f.key]||0)}</b>`).join(' · ');
  let overwrites = 0;
  if(day && u.mode==='set') inc.forEach(it=>{
    if(!it.id) return;
    FD_FIELDS.forEach(f=>{
      if(u.cols[f.key]==null) return;
      const old = upRound(Number((day[it.id]||{})[f.key])||0);
      if(old && old!==upRound(it.vals[f.key]||0)) overwrites++;
    });
  });
  let wipeTxt = '', wipeN = 0;
  if(u.wipe){
    if(day){
      const p = fdWipePlan(day); wipeN = p.n;
      wipeTxt = `<br>التصفير: <b>${p.n}</b> عميل مش في الشيت هيتصفّروا`
        + (p.n ? ' ('+FD_FIELDS.filter(f=>p.totals[f.key]).map(f=>`${f.label}: ${fmt(p.totals[f.key])}`).join(' · ')+')' : '') + '.';
    } else wipeTxt = '<br>التصفير: جاري قراءة اليوم…';
  }
  box.classList.toggle('warn', !!(missing||dups||overwrites||u.wipe||u.mode==='add'));
  box.innerHTML = `هيتسجّل <b>${inc.length}</b> عميل على يوم <b>${u.date}</b>${newN?` (منهم <b>${newN}</b> عميل جديد)`:''}`
    + (sumTxt ? `<br>${sumTxt}` : '') + wipeTxt
    + (overwrites ? `<br>تنبيه: ${overwrites} خانة فيها أرقام مسجلة هتتغيّر (فيه تراجع بعد الرفع).` : '')
    + (u.mode==='add' ? `<br>تنبيه: وضع الإضافة — الأرقام هتتزوّد على المسجل، وتأكد إن الشيت ما اترفعش قبل كده.` : '')
    + (missing ? `<br>تنبيه: ${missing} اسم مش موجود في الداتا بيز وهيتخطّوا (فعّل إضافة العملاء الجدد لو عايزهم).` : '')
    + (dups ? `<br>تنبيه: ${dups} اسم مكرر في الداتا بيز ومش هيتسجّل — عدّل الأسماء الأول.` : '');
  const btn = $('#fdApply');
  btn.disabled = u.busy || (inc.length===0 && !(u.wipe && wipeN));
  btn.textContent = inc.length ? `رفع اليومية (${inc.length} عميل)` : 'رفع اليومية';
}

function fdSig(inc){
  const u = fdState;
  const s = u.date+'|'+u.mode+'|'+inc.map(it=>(it.id||it.name)+':'+Object.entries(it.vals).sort().map(([k,d])=>k+d).join(',')).sort().join(';');
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
  return String(h);
}

async function fdApply(){
  const u = fdState; if(u.busy) return;
  fdCompute();
  const inc = u.items.filter(it=>it.include);
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  if(!inc.length && !u.wipe) return toast('مفيش حاجة تترفع');
  const sig = fdSig(inc);
  const same = u.mode==='add' ? (u.hist||[]).find(h=>!h.undone && h.sig===sig) : null;
  if(same && !confirm(`الشيت ده بنفس الأرقام اترفع قبل كده على يوم ${same.date}. لو كملت الأرقام هتتضاعف. تكمل؟`)) return;
  const newN = inc.filter(it=>!it.id).length;
  if(!confirm(`هترفع ${inc.length} عميل على يوم ${u.date}${newN?` (منهم ${newN} عميل جديد)`:''} — ${u.mode==='set'?'استبدال القيم':'إضافة على الموجود'}${u.wipe?'\nوهتصفّر باقي عملاء اليوم اللي مش في الشيت':''}.\n(فيه تراجع بعد كده)\nتكمل؟`)) return;

  u.busy = true;
  const btn = $('#fdApply'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try{
    const fresh = (await state.db.ref('days/'+u.date).once('value')).val() || {};
    const updates = {}, items = {}, created = [], createdReps = [], totals = {};
    let order = maxOrder();
    const repByName = {};
    Object.entries(state.reps).forEach(([id,r])=>{ if(r) repByName[norm(r.name)] = id; });
    const addCell = (id, k, to)=>{
      const prev = upRound(Number((fresh[id]||{})[k])||0); to = upRound(to);
      if(prev===to) return;
      updates[`days/${u.date}/${id}/${k}`] = to;
      (items[id] = items[id] || {})[k] = {prev, to};
    };
    inc.forEach(it=>{
      let id = it.id;
      if(!id){
        id = uid(); order++;
        let rid = null;
        if(it.repName){
          const rk = norm(it.repName); rid = repByName[rk];
          if(!rid){ rid = uid(); repByName[rk] = rid; updates['reps/'+rid] = {name:it.repName, color:randColor()}; createdReps.push(rid); }
        }
        updates['clients/'+id] = {name:it.name, rep:rid, active:true, order};
        created.push(id);
      }
      FD_FIELDS.forEach(f=>{
        if(u.cols[f.key]==null) return;
        const v = it.vals[f.key]||0;
        totals[f.key] = upRound((totals[f.key]||0)+v);
        const cur = Number((fresh[id]||{})[f.key])||0;
        addCell(id, f.key, u.mode==='add' ? cur+v : v);
      });
    });
    let wiped = 0;
    if(u.wipe){
      const prot = new Set(u.items.filter(it=>it.id).map(it=>it.id));
      Object.keys(state.clients).forEach(id=>{
        if(!state.clients[id] || prot.has(id)) return;
        const before = Object.keys(items).length;
        FD_FIELDS.forEach(f=>addCell(id, f.key, 0));
        if(Object.keys(items).length>before) wiped++;
      });
    }
    if(!Object.keys(updates).length){ u.busy = false; toast('مفيش أي تغيير — الأرقام زي ما هي'); fdRenderSummary(); return; }
    const logId = uid();
    const log = {createdAt:Date.now(), date:u.date, fileName:u.fileName||'', mode:u.mode, wipe:!!u.wipe, wiped, sig,
      count:inc.length, createdCount:created.length, totals, items, created, createdReps};
    updates[FD_LOG+'/'+logId] = log;

    const ack = await Promise.race([
      state.db.ref().update(updates).then(()=>'ok'),
      new Promise(res=>setTimeout(()=>res('timeout'), 10000)),
    ]);
    if(ack==='timeout'){
      $('#fdPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">السيرفر مردّش خلال 10 ثواني — الأرجح النت واقف، فاليومية ممكن ميكونش اتحفظت. افحص الاتصال وجرّب تاني.</div>`);
      toast('مفيش تأكيد من السيرفر — اليومية ممكن ميكونش اتحفظت');
      u.busy = false; fdRenderSummary(); return;
    }
    if(state.day!==u.date){ state.day = u.date; bindDay(u.date); }
    u.hist = [{id:logId, ...log}, ...(u.hist||[])].slice(0,15);
    const sumTxt = FD_FIELDS.filter(f=>u.cols[f.key]!=null).map(f=>`${f.label}: ${fmt(totals[f.key]||0)}`).join(' · ');
    $('#fdPreview').innerHTML = `<div class="pill good" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">تم رفع ${inc.length} عميل على يوم ${u.date}${created.length?` (${created.length} جديد)`:''}${wiped?` وتصفير ${wiped} عميل`:''} — ${sumTxt} — اتحفظ على السيرفر ✓</div>`;
    $('#fdConfig').innerHTML = ''; $('#fdFile').value = ''; u.wb = null; u.items = [];
    btn.textContent = 'رفع اليومية'; btn.disabled = true;
    fdRenderHistory();
    toast('تم رفع اليومية');
  }catch(err){
    const denied = /permission/i.test((err.code||'')+' '+err.message);
    toast('فشل الحفظ: '+err.message);
    $('#fdPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">فشل الحفظ: ${escapeHtml(err.message)}${denied?' — صلاحيات Firebase رافضة الكتابة':''}</div>`);
    fdRenderSummary();
  }
  u.busy = false;
}

function fdLoadHistory(){
  return state.db.ref(FD_LOG).orderByKey().limitToLast(15).once('value').then(s=>{
    const v = s.val() || {};
    fdState.hist = Object.entries(v).map(([id,h])=>({id, ...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return fdState.hist;
  }).catch(()=>{ fdState.hist = []; return []; });
}
function fdRenderHistory(){
  const box = $('#fdHistory'); if(!box) return;

  if(!hist.length){ box.innerHTML = ''; return; }
  box.innerHTML = `
    <div style="font-size:12.5px; color:var(--fg-dim); margin:16px 0 6px; font-weight:700">آخر رفعات اليومية الكاملة</div>
    <div class="tablewrap"><table style="min-width:560px">
      <thead><tr><th>اليوم</th><th>الملف</th><th>العملاء</th><th>التفاصيل</th><th></th></tr></thead>

        <td style="font-size:12.5px">${escapeHtml(h.fileName||'')}</td>

        <td style="font-size:12px;text-align:start">${h.mode==='add'?'إضافة':'استبدال'}${h.wipe?` · تصفير ${h.wiped||0}`:''}<br>${FD_FIELDS.filter(f=>(h.totals||{})[f.key]).map(f=>`${f.label}: ${fmt(h.totals[f.key])}`).join(' · ')}</td>
        <td>${h.undone ? '<span class="pill neutral">اتلغت</span>' : `<button class="btn sm danger" data-fdundo="${h.id}">تراجع</button>`}</td>
      </tr>`).join('')}</tbody>

  $$('[data-fdundo]').forEach(b=>b.onclick = ()=>fdUndo(b.dataset.fdundo));

/* التراجع: بيرجّع الخانات اللي لسه على قيمتها بعد الرفع بس، ويحذف العملاء/المناديب اللي اتعملوا مع الرفعة لو مفيش عليهم تعديل */
async function fdUndo(logId){
  try{
    const log = (await state.db.ref(FD_LOG+'/'+logId).once('value')).val();
    if(!log || log.undone) return;
    const nNew = (log.created||[]).length;
    if(!confirm(`تتراجع عن رفعة «${log.fileName||''}» (${log.count||0} عميل) على يوم ${log.date}؟ الأرقام القديمة هترجع${nNew?` وهيتحذف ${nNew} عميل اتعمل مع الرفعة`:''} (الخانات اللي اتعدّلت بعد الرفع مش هتتلمس).`)) return;
    const day = (await state.db.ref('days/'+log.date).once('value')).val() || {};
    const clients = (await state.db.ref('clients').once('value')).val() || {};
    const updates = {}, skippedBy = {}; let restored = 0, skipped = 0;
    Object.entries(log.items||{}).forEach(([cid,flds])=>Object.entries(flds).forEach(([k,d])=>{
      const cur = upRound(Number((day[cid]||{})[k])||0);
      if(cur===upRound(d.to)){ updates[`days/${log.date}/${cid}/${k}`] = d.prev; restored++; }
      else { skipped++; skippedBy[cid] = true; }
    }));
    const delClients = new Set();
    (log.created||[]).forEach(cid=>{
      if(!clients[cid] || skippedBy[cid]) return;
      delClients.add(cid);
      Object.keys(updates).forEach(p=>{ if(p.startsWith(`days/${log.date}/${cid}/`)) delete updates[p]; });
      updates['clients/'+cid] = null;
      updates[`days/${log.date}/${cid}`] = null;
    });
    (log.createdReps||[]).forEach(rid=>{
      const used = Object.entries(clients).some(([cid,c])=>c && c.rep===rid && !delClients.has(cid));
      if(!used) updates['reps/'+rid] = null;
    });
    updates[FD_LOG+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = (fdState.hist||[]).find(x=>x.id===logId); if(h) h.undone = true;
    fdRenderHistory();
    toast(`تم التراجع — رجعت ${restored} خانة${skipped?` وتخطّيت ${skipped} (اتعدّلت بعد الرفع)`:''}`);
  }catch(err){ toast('خطأ: '+err.message); }
}


/* ================= رفع مديونية (اسم + مبلغ) =================
   كل اسم بيتطابق مع العميل، والمبلغ بيتسجل في خانة «آجل أمس» (المديونية السابقة) في اليوم المختار.
   الافتراضي «استبدال» لأن المديونية رصيد مش حركة؛ وفيه خيار الإضافة. المبالغ المكررة لنفس العميل بتتجمّع. فيه سجل وتراجع. */
const DBT_LOG = 'meta/debtUploads';
const dbtState = {};
const DBT_NAME_RE = /اسم|عميل|تاجر|محل/;
const DBT_VAL_RE = /مديون|اجل|رصيد|مبلغ|قيمه|متبقي|باقي|عليه|حساب|اجمالي|amount|total|value/i;

function openDebtUpload(){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  Object.assign(dbtState, {wb:null, sheet:null, rows:[], header:1, nameCol:null, valCol:null, date:state.day, mode:'set', createNew:false,
    fileName:'', items:[], skip:new Set(), busy:false, hist:[], dayCache:null, dayCacheDate:null});
  openModal(`
    <div class="hd"><h3>رفع مديونية</h3><button class="btn ghost sm" id="mClose">✕</button></div>
    <div class="bd">
      <div style="font-size:12.5px; color:var(--fg-dim); line-height:1.7">الشيت فيه اسم العميل والمبلغ. المبلغ بيتسجل في خانة <b>آجل أمس</b> لليوم المختار، وبعدها المديونية الجديدة بتتحسب لوحدها (آجل أمس + المسحوبات − التحصيل).</div>
      <div class="row2">
        <div class="field"><label>تاريخ اليومية</label><input type="date" id="dbDate" value="${dbtState.date}"></div>
        <div class="field"><label>طريقة الحفظ</label><select id="dbMode"><option value="set">استبدال آجل أمس بالمبلغ</option><option value="add">إضافة على آجل أمس الموجود</option></select></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="dbCreate"> العملاء اللي مش موجودين يتضافوا كعملاء جدد</label>
      <div class="field"><label>ملف إكسيل (.xlsx)</label><input type="file" id="dbFile" accept=".xlsx,.xls,.csv"></div>
      <div id="dbBody"></div>
      <div id="dbHistory"></div>
    </div>
    <div class="ft"><button class="btn" id="mCancel">إغلاق</button><button class="btn primary" id="dbApply" disabled>رفع المديونية</button></div>
  `, ()=>{
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#dbApply').onclick = dbtApply;
    $('#dbMode').onchange = e=>{ dbtState.mode = e.target.value; dbtPreview(); };
    $('#dbCreate').onchange = e=>{ dbtState.createNew = e.target.checked; dbtPreview(); };
    $('#dbDate').onchange = e=>{
      if(!e.target.value) return;
      dbtState.date = e.target.value; dbtState.dayCache = null; dbtState.dayCacheDate = null;
      dbtPreview(); dbtEnsureDay();
    };
    $('#dbFile').onchange = e=>{
      const f = e.target.files[0]; if(!f) return; dbtState.fileName = f.name;
      if(typeof XLSX==='undefined') return toast('مكتبة الإكسيل متحمّلتش — اعمل Refresh وجرّب تاني');
      const rd = new FileReader();
      rd.onerror = ()=>toast('المتصفح معرفش يقرا الملف');
      rd.onload = ev=>{
        try{ dbtState.wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array'}); }
        catch(err){ return toast('تعذر قراءة الملف'); }
        const score = n => XLSX.utils.sheet_to_json(dbtState.wb.Sheets[n],{header:1,defval:null,raw:true})
          .filter(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number')).length;
        dbtUseSheet(dbtState.wb.SheetNames.slice().sort((a,b)=>score(b)-score(a))[0]);
        dbtEnsureDay();
      };
      rd.readAsArrayBuffer(f);
    };
    dbtLoadHistory().then(dbtRenderHistory);
  });
}

function dbtUseSheet(name, forcedHeader){
  const m = dbtState; m.sheet = name;
  m.rows = XLSX.utils.sheet_to_json(m.wb.Sheets[name],{header:1,defval:null,raw:true});
  m.nameCol = m.valCol = null;
  const scan = i=>{
    const r = m.rows[i]||[];
    const n = r.findIndex(c=>typeof c==='string' && DBT_NAME_RE.test(norm(c)) && !/مندوب/.test(norm(c)));
    if(n<0) return false;
    m.header = i+1; m.nameCol = n;
    const v = r.findIndex((c,j)=>j!==n && typeof c==='string' && DBT_VAL_RE.test(norm(c)));
    m.valCol = v>=0 ? v : null;
    return true;
  };
  let found = false;
  if(forcedHeader!==undefined){ m.header = forcedHeader; found = forcedHeader>0 && scan(forcedHeader-1); }
  else for(let i=0;i<Math.min(m.rows.length,15) && !found;i++) found = scan(i);
  if(!found && (forcedHeader===undefined || forcedHeader===0)){ // من غير عناوين: أول عمود نصي وأول عمود رقمي
    const r = m.rows.find(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number')) || [];
    const n = r.findIndex(c=>typeof c==='string'); if(n>=0) m.nameCol = n;
    const v = r.findIndex(c=>typeof c==='number'); if(v>=0) m.valCol = v;
    m.header = 0;
  }
  if(m.nameCol!=null && m.valCol==null){
    const r = m.rows[m.header]||[]; const j = r.findIndex((c,k)=>k!==m.nameCol && typeof c==='number'); if(j>=0) m.valCol = j;
  }
  m.skip = new Set();
  dbtRenderOptions();
}
function dbtRenderOptions(){
  const m = dbtState, hdr = m.rows[Math.max(0,m.header-1)]||[];
  const width = Math.max(hdr.length, 0, ...m.rows.slice(0,30).map(r=>(r||[]).length));
  const opts = cur=>'<option value="">— اختر —</option>'+Array.from({length:width},(_,i)=>{
    const h = m.header>0 ? hdr[i] : null;
    return `<option value="${i}" ${cur===i?'selected':''}>${escapeHtml(h==null?'عمود '+colToLetter(i):String(h))} (${colToLetter(i)})</option>`; }).join('');
  $('#dbBody').innerHTML = `
    <div class="row2">
      ${m.wb.SheetNames.length>1 ? `<div class="field"><label>الورقة</label><select id="dbSheet">${m.wb.SheetNames.map(n=>`<option ${n===m.sheet?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>رقم صف العناوين (0 = مفيش)</label><input id="dbHeader" type="number" min="0" value="${m.header}"></div>
      <div class="field"><label>عمود اسم العميل *</label><select id="dbName">${opts(m.nameCol)}</select></div>
      <div class="field"><label>عمود المبلغ *</label><select id="dbVal">${opts(m.valCol)}</select></div>
    </div>
    <div id="dbPreview" style="margin-top:12px"></div>`;
  const num = v=>v===''?null:Number(v);
  const sh = $('#dbSheet'); if(sh) sh.onchange = e=>dbtUseSheet(e.target.value);
  $('#dbHeader').onchange = e=>{ const h = Math.max(0, parseInt(e.target.value,10)||0); dbtUseSheet(m.sheet, h); };
  $('#dbName').onchange = e=>{ m.nameCol = num(e.target.value); dbtPreview(); };
  $('#dbVal').onchange = e=>{ m.valCol = num(e.target.value); dbtPreview(); };
  dbtPreview();
}

function dbtDayNow(){
  const m = dbtState;
  if(m.date===state.day) return state.dayData || {};
  return m.dayCacheDate===m.date ? m.dayCache : null;
}
function dbtEnsureDay(){
  const m = dbtState;
  if(m.date===state.day || m.dayCacheDate===m.date) return Promise.resolve();
  const d = m.date;
  return state.db.ref('days/'+d).once('value').then(s=>{
    if(m.date===d){ m.dayCache = s.val()||{}; m.dayCacheDate = d; dbtPreview(); }
  }).catch(()=>{});
}

function dbtCompute(){
  const m = dbtState, idx = upBuildIndex(), acc = new Map();
  let blank = 0;
  if(m.nameCol!=null && m.valCol!=null){
    m.rows.slice(Math.max(0, m.header)).forEach(r=>{
      if(!r) return;
      const raw = r[m.nameCol], cell = r[m.valCol];
      const name = raw==null ? '' : String(raw).trim();
      const noVal = cell==null || String(cell).trim()==='';
      if(!name){ if(!noVal) blank++; return; }
      if(name==='0' || UP_SKIP_NAMES.includes(norm(name)) || noVal) return;
      const val = upRound(upToNum(cell));
      const h = upMatch(name, idx);
      const key = h.id || ('n:'+norm(name));
      let it = acc.get(key);
      if(!it){ it = {key, id:h.id||null, dup:!!h.dup, name, rows:0, val:0}; acc.set(key, it); }
      it.rows++; it.val = upRound(it.val+val);
    });
  }
  m.blank = blank;
  m.items = [...acc.values()].map(it=>{
    it.canApply = !it.dup && (!!it.id || m.createNew);
    it.include = it.canApply && !m.skip.has(it.key);
    return it;
  });
}

function dbtRenderSummary(){
  const m = dbtState, box = $('#dbSum'), btn = $('#dbApply'); if(!box) return;
  const inc = m.items.filter(it=>it.include);
  const total = upRound(inc.reduce((t,it)=>t+it.val,0));
  const newN = inc.filter(it=>!it.id).length;
  const missing = m.items.filter(it=>!it.id && !it.dup && !m.createNew);
  const dups = m.items.filter(it=>it.dup);
  box.classList.toggle('warn', !!(missing.length||dups.length||m.blank||m.mode==='add'));
  box.innerHTML = `هيتسجّل <b>${inc.length}</b> عميل على يوم <b>${m.date}</b> — إجمالي المبالغ: <b>${fmt(total)}</b>${newN?` (منهم ${newN} عميل جديد)`:''}`
    + (missing.length ? `<br>تنبيه: ${missing.length} اسم مش موجود في العملاء وهيتخطّوا: ${missing.slice(0,12).map(x=>escapeHtml(x.name)+' ('+fmt(x.val)+')').join('، ')}${missing.length>12?'…':''} (فعّل إضافة العملاء الجدد لو عايزهم).` : '')
    + (dups.length ? `<br>تنبيه: ${dups.length} اسم ليه أكتر من عميل في الداتا بيز وهيتخطّى: ${dups.map(x=>escapeHtml(x.name)).join('، ')}` : '')
    + (m.blank ? `<br>تنبيه: ${m.blank} صف فيه مبلغ من غير اسم — اتخطى.` : '')
    + (m.mode==='add' ? `<br>تنبيه: وضع الإضافة — لو الشيت اترفع قبل كده المبلغ هيتضاعف.` : '');
  btn.disabled = m.busy || !inc.length;
  btn.textContent = inc.length ? `رفع المديونية (${inc.length} عميل)` : 'رفع المديونية';
}

async function dbtApply(){
  const m = dbtState; if(m.busy) return;
  dbtCompute();
  const inc = m.items.filter(it=>it.include);
  if(!inc.length || !state.db) return;
  const newN = inc.filter(it=>!it.id).length;
  if(!confirm(`هتسجّل مديونية ${inc.length} عميل${newN?` (منهم ${newN} جديد)`:''} في «آجل أمس» ليوم ${m.date} — ${m.mode==='set'?'استبدال':'إضافة على الموجود'}. (فيه تراجع بعد كده)\nتكمل؟`)) return;
  m.busy = true;
  const btn = $('#dbApply'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try{
    const fresh = (await state.db.ref('days/'+m.date).once('value')).val() || {};
    const updates = {}, items = {}, created = []; let order = maxOrder(), total = 0;
    inc.forEach(it=>{
      let id = it.id;
      if(!id){ id = uid(); order++; updates['clients/'+id] = {name:it.name, active:true, order}; created.push(id); }
      const prev = upRound(Number((fresh[id]||{}).debtYesterday)||0);
      const to = upRound(m.mode==='add' ? prev+it.val : it.val);
      total = upRound(total+it.val);
      if(prev===to && !created.includes(id)) return;
      updates[`days/${m.date}/${id}/debtYesterday`] = to;
      items[id] = {prev, to};
    });
    const logId = uid();
    const log = {createdAt:Date.now(), date:m.date, fileName:m.fileName||'', mode:m.mode, count:inc.length, total, created, items};
    updates[DBT_LOG+'/'+logId] = log;
    const ack = await Promise.race([
      state.db.ref().update(updates).then(()=>'ok'),
      new Promise(res=>setTimeout(()=>res('timeout'), 10000)),
    ]);
    if(ack==='timeout'){
      $('#dbPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">السيرفر مردّش خلال 10 ثواني — راجع النت، المديونية ممكن ميكونش اتحفظت.</div>`);
      toast('مفيش تأكيد من السيرفر'); m.busy = false; dbtRenderSummary(); return;
    }
    if(state.day!==m.date){ state.day = m.date; bindDay(m.date); }
    m.hist = [{id:logId, ...log}, ...(m.hist||[])].slice(0,15);
    $('#dbPreview').innerHTML = `<div class="pill good" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">تم تسجيل مديونية ${inc.length} عميل على يوم ${m.date} — إجمالي ${fmt(total)} — اتحفظ على السيرفر ✓</div>`;
    $('#dbBody').innerHTML = ''; $('#dbFile').value = ''; m.wb = null; m.items = [];
    btn.textContent = 'رفع المديونية'; btn.disabled = true;
    dbtRenderHistory(); toast('تم رفع المديونية');
  }catch(err){
    const denied = /permission/i.test((err.code||'')+' '+err.message);
    toast('فشل الحفظ: '+err.message);
    $('#dbPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">فشل الحفظ: ${escapeHtml(err.message)}${denied?' — صلاحيات Firebase رافضة الكتابة':''}</div>`);
    dbtRenderSummary();
  }
  m.busy = false;
}

function dbtLoadHistory(){
  return state.db.ref(DBT_LOG).orderByKey().limitToLast(15).once('value').then(s=>{
    dbtState.hist = Object.entries(s.val()||{}).map(([id,h])=>({id,...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }).catch(()=>{ dbtState.hist = []; });
}
function dbtRenderHistory(){
  const box = $('#dbHistory'); if(!box) return;
  const hist = (dbtState.hist||[]).slice(0,6);
  if(!hist.length){ box.innerHTML = ''; return; }
  box.innerHTML = `
    <div style="font-size:12.5px; color:var(--fg-dim); margin:16px 0 6px; font-weight:700">آخر رفعات المديونية</div>
    <div class="tablewrap"><table style="min-width:480px">
      <thead><tr><th>اليوم</th><th>الملف</th><th>العملاء</th><th>الإجمالي</th><th></th></tr></thead>
      <tbody>${hist.map(h=>`<tr style="${h.undone?'opacity:.5':''}">
        <td class="tnum">${escapeHtml(h.date||'')}<div style="font-size:11px;color:var(--fg-dim)">${h.createdAt?new Date(h.createdAt).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}):''}</div></td>
        <td style="font-size:12.5px">${escapeHtml(h.fileName||'')}</td>
        <td class="tnum">${h.count||0}</td><td class="tnum">${fmt(h.total||0)}</td>
        <td>${h.undone?'<span class="pill neutral">اتلغت</span>':`<button class="btn sm danger" data-dbundo="${h.id}">تراجع</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-dbundo]').forEach(b=>b.onclick = ()=>dbtUndo(b.dataset.dbundo));
}
async function dbtUndo(logId){
  try{
    const log = (await state.db.ref(DBT_LOG+'/'+logId).once('value')).val();
    if(!log || log.undone) return;
    if(!confirm(`تتراجع عن رفعة المديونية «${log.fileName||''}» (${log.count||0} عميل) على يوم ${log.date}؟${(log.created||[]).length?` وهيتحذف ${log.created.length} عميل اتعمل معاها.`:''} (لو عدّلت الخانة بعد الرفع مش هتتلمس)`)) return;
    const day = (await state.db.ref('days/'+log.date).once('value')).val() || {};
    const clients = (await state.db.ref('clients').once('value')).val() || {};
    const updates = {}, kept = {}; let restored = 0, skipped = 0;
    Object.entries(log.items||{}).forEach(([cid,d])=>{
      const cur = upRound(Number((day[cid]||{}).debtYesterday)||0);
      if(cur===upRound(d.to)){ updates[`days/${log.date}/${cid}/debtYesterday`] = d.prev; restored++; }
      else { skipped++; kept[cid] = true; }
    });
    (log.created||[]).forEach(cid=>{
      if(!clients[cid] || kept[cid]) return;
      delete updates[`days/${log.date}/${cid}/debtYesterday`];
      updates['clients/'+cid] = null;
      updates[`days/${log.date}/${cid}`] = null;
    });
    updates[DBT_LOG+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = (dbtState.hist||[]).find(x=>x.id===logId); if(h) h.undone = true;
    dbtRenderHistory();
    toast(`تم التراجع — رجعت ${restored} خانة${skipped?` وتخطّيت ${skipped} (اتعدّلت بعد الرفع)`:''}`);
  }catch(err){ toast('خطأ: '+err.message); }
}

const PERM_COLS = [['fawry','فوري'],['aman','امان'],['masary','مصاري'],['mumkin','ممكن'],['basata','بساطة'],['cash','كاش'],['drawn','المسحوبات'],['collection','التحصيل'],['debtYesterday','آجل أمس'],['newDebt','المديونية']];
const COLMAP = {'فوري':'fawry','امان':'aman','مصاري':'masary','ممكن':'mumkin','بساطة':'basata','كاش':'cash','إجمالي المسحوبات':'drawn','المسحوبات':'drawn','إجمالي التحصيل':'collection','التحصيل':'collection','آجل أمس':'debtYesterday','المديونية الجديدة':'newDebt','المديونية':'newDebt'};
function permsOf(p){ p=p||{}; return {own:p.own!==false, tabs:Object.assign({ledger:true,search:true}, p.tabs), cols:Object.assign({}, p.cols)}; }
const AUTH_SUFFIX = '@taqfila.local';
const ADMIN_EMAIL = 'admin11111' + AUTH_SUFFIX;
function emailOf(v){
  v = String(v||'').trim().toLowerCase(); if(!v) return '';
  if(!v.includes('@')) return v + AUTH_SUFFIX;
  if(v.endsWith('@payment')) return v.slice(0,-8) + AUTH_SUFFIX;
  return v;
}
function authErr(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'اسم المستخدم أو كلمة السر غلط';
  if(/too-many-requests/.test(c)) return 'محاولات كتير غلط — استنى شوية وجرّب تاني';
  if(/network/.test(c)) return 'مفيش نت — اتأكد من الاتصال';
  if(/operation-not-allowed/.test(c)) return 'فعّل Email/Password من Firebase Console ← Authentication ← Sign-in method';
  if(/email-already-in-use/.test(c)) return 'الحساب ده موجود بالفعل في Firebase Authentication (امسحه من الكونسول الأول لو عايز تعيد إنشاءه)';
  if(/weak-password/.test(c)) return 'كلمة السر ضعيفة — 6 حروف/أرقام على الأقل';
  if(/requires-recent-login/.test(c)) return 'سجّل خروج وادخل تاني وبعدين غيّر كلمة السر';
  return (e && e.message) || 'حصل خطأ';
}
function resolveUser(){
  if(!state.authReady){ state.user = undefined; return; }
  const au = state.authUser;
  if(!au){ state.user = null; return; }
  const email = String(au.email||'').toLowerCase();
  if(email===ADMIN_EMAIL){ state.user = {role:'admin', uid:au.uid, login:email, name:'الأدمن'}; return; }
  if(state.myProfile===undefined){ state.user = undefined; return; }
  const p = state.myProfile;
  if(!p){ state.user = null; return; }
  state.user = {role:'rep', id:au.uid, uid:au.uid, login:email, name:p.name||email.split('@')[0], repId:p.repId||'', perms:permsOf(p.perms)};
}
function allowedTabs(){
  const u = state.user;

function askPassword(title){

    let done = false; const fin = v=>{ if(done) return; done = true; closeModal(); res(v); };

async function createAuthUser(email, password){
  const app = firebase.initializeApp(state.fbConfig, 'sec'+Date.now());   // تطبيق تاني عشان الأدمن ميتسجلش خروج
  try{ const cred = await app.auth().createUserWithEmailAndPassword(email, password); return cred.user.uid; }
  finally{ try{ await app.auth().signOut(); }catch(e){} try{ await app.delete(); }catch(e){} }
}
async function provisionUser(login, password, base, oldId){

  await state.db.ref().update(up);
}

/* عرض فقط للمندوب: أي كتابة خارج repNotes بتترفض */
function installGuard(){
  try{
    const P = firebase.database.Reference.prototype;
    ['set','update','remove','push','transaction'].forEach(m=>{
      const orig = P[m];
      P[m] = function(...a){
        const u = state.user;
        if(u && u.role==='rep'){
          const root = state.db.ref().toString().replace(/\/$/,'');
          const base = decodeURIComponent(this.toString().slice(root.length)).replace(/^\//,'');
          const keys = (m==='update' && a[0] && typeof a[0]==='object') ? Object.keys(a[0]).map(k=>base?base+'/'+k:k) : [base];
          if(!keys.every(k=>k==='repNotes' || k.startsWith('repNotes/'))){ toast('عرض فقط — مش مسموح لك بالتعديل'); return Promise.reject(new Error('read-only')); }
        }
        return orig.apply(this, a);
      };
    });
  }catch(e){}
}
function applyRoleUI(main){
  const u = state.user; if(!u || u.role!=='rep') return;
  $$('input.cell-amt', main).forEach(i=>{
    const sp = document.createElement('span'); sp.className = 'tnum';
    sp.textContent = i.value==='' ? '·' : fmt(Number(i.value)); i.replaceWith(sp);

}

const CMP_PATH = 'dataCompletion';

const cmpOf = cid => (state.dataComp && state.dataComp[cid]) || {};
const cmpLatin = s => String(s||'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function cmpSave(cid, patch, quiet){
  if(!state.db) return toast('مش متصل بقاعدة البيانات بعد');
  patch.updatedAt = Date.now();
  if(quiet) renderComplete._skip = true;
  try{ state.db.ref(CMP_PATH+'/'+cid).update(patch).catch(e=>toast('خطأ: '+e.message)); }
  finally{ renderComplete._skip = false; }
}
function cmpClients(){
  const f = renderComplete._f, nums = clientNumbers();
  return sortedClients()
    .filter(([id,c])=>c.active!==false && (f.rep==='__none__' ? !(c.rep && state.reps[c.rep]) : c.rep===f.rep))
    .map(([id,c])=>({id, c, num:nums[id], d:cmpOf(id)}));
}
function cmpRemain(d){
  const o = Number(d.owed)||0, p = Number(d.paid)||0;
  return (d.owed==null && d.paid==null) ? '' : 'المتبقي: '+fmt(o-p);
}
function cmpUpdRem(cid){
  const el = document.querySelector(`[data-rem="${cid}"]`); if(!el) return;

function cmpRefreshStats(){

    <div class="stat"><div class="label">باقي</div><div class="val tnum" style="color:var(--warn)">${rem}</div></div>

function cmpDrawList(){
  const box = $('#cmpList'); if(!box) return;
  const f = renderComplete._f;

  const q = norm(f.q||'');

    .filter(x=> f.show==='all' || (f.show==='done' ? x.d.visited : !x.d.visited))
    .filter(x=> !q || norm([x.c.name, x.num, x.d.mNo, x.d.phone, x.d.address, machineText(x.c)].join(' ')).includes(q));

function renderComplete(main){
  const f = renderComplete._f = renderComplete._f || {rep:'', q:'', show:'all'};
  if(f.rep && f.rep!=='__none__' && !state.reps[f.rep]) f.rep='';
  if(renderComplete._skip){ cmpRefreshStats(); return; }   /* كتابة مني: متعملش إعادة رسم عشان الكيبورد ميتقفلش */
  const ae = document.activeElement; let keep = null;
  if(ae && main.contains(ae) && (ae.dataset.cf || ae.id==='cmpQ'))
    keep = {cf:ae.dataset.cf, cid:ae.dataset.cid, id:ae.id, s:ae.selectionStart, e:ae.selectionEnd};
  const reps = Object.entries(state.reps).filter(([id,r])=>r).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar'));
  main.innerHTML = `<div class="topbar"><div><h1 class="display">استكمال البيانات</h1>
      <div class="sub">تذكير ليك انت بس — مش مربوط باليومية ولا بالتحصيل بتاعها</div></div></div>

      <select class="sel-sm" id="cmpRep"><option value="">اختار المندوب…</option>
        ${reps.map(([id,r])=>`<option value="${id}" ${f.rep===id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}
        <option value="__none__" ${f.rep==='__none__'?'selected':''}>بدون مندوب</option></select>
      <div class="search-input"><input id="cmpQ" placeholder="ابحث باسم العميل أو المكنة أو الموبايل أو العنوان..." value="${escapeHtml(f.q)}"></div>
    </div>
    <div id="cmpStats" style="margin-bottom:12px"></div>
    <div id="cmpChips" class="toolbar"></div>
    <div id="cmpList"></div>`;
  $('#cmpRep').onchange = e=>{ f.rep=e.target.value; f.show='all'; render(); };
  $('#cmpQ').oninput = e=>{ f.q=e.target.value; cmpDrawList(); };
  const list = $('#cmpList');
  list.onchange = e=>{
    const t = e.target, cid = t.dataset.cid, k = t.dataset.cf; if(!cid || !k) return;
    if(k==='visited'){ cmpSave(cid, {visited: t.checked ? true : null, visitedAt: t.checked ? Date.now() : null}); return; }
    let v = t.value.trim();
    if(k==='owed' || k==='paid'){ const n = parseFloat(cmpLatin(v).replace(/,/g,'')); v = isNaN(n) ? '' : n; }
    else if(k==='phone' || k==='mNo') v = cmpLatin(v);
    cmpSave(cid, {[k]: v==='' ? null : v}, true);
    cmpUpdRem(cid);
  };
  cmpRefreshStats(); cmpDrawList();
  if(keep){
    const el = keep.id ? document.getElementById(keep.id) : main.querySelector(`[data-cf="${keep.cf}"][data-cid="${keep.cid}"]`);
    if(el){ el.focus(); try{ el.setSelectionRange(keep.s, keep.e); }catch(_){} }
  }
}

        <td><button class="btn sm danger" data-delnote="${n.k}">حذف</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="card"><div class="empty"><div class="ico">📝</div>مفيش ملحوظات.</div></div>';
    $$('[data-delnote]').forEach(b=>b.onclick=()=>{ if(confirm('حذف الملحوظة؟')) state.db.ref('repNotes/'+b.dataset.delnote).remove(); });
    $$('[data-goday]').forEach(a=>a.onclick=e=>{ e.preventDefault(); state.day=a.dataset.goday; bindDay(state.day); state.tab='ledger'; render(); });
  };
  $('#nUser').onchange = e=>{ f.user=e.target.value; upd(); };
  $('#nDate').onchange = e=>{ f.date=e.target.value; upd(); };
  $('#nAll').onclick = ()=>{ f.date=''; $('#nDate').value=''; upd(); };
  $('#nQ').oninput = e=>{ f.q=e.target.value; upd(); };

const ALERTS_PATH = 'alerts';

function alertClientLabel(a){

function alertTime(t){

function alertSave(data, id){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');

/* ---------- تشغيل ---------- */
/* ================= زرار حفظ التعديلات (اليومية والتحصيل) =================
   - أي رقم تكتبه بيتعلّم "لسه متحفظش" ومبيتبعتش للسيرفر غير لما تدوس «حفظ»
   - بعد الحفظ بنستنى تأكيد السيرفر نفسه وبعدين نقولك "اتحفظ ✓"
   - العمليات الجماعية (ترحيل/نقل/رفع/تصفير/حذف) بتطلب الحفظ الأول */
state.pend = state.pend || {};
const PEND_SEP = '|';
const pk = (d,id,f)=>d+PEND_SEP+id+PEND_SEP+f;
const pendCount = ()=>Object.keys(state.pend).length;
const hasPend = (d,id,f)=>Object.prototype.hasOwnProperty.call(state.pend, pk(d,id,f));
function pendRow(d,id){
  const out = {}; const pre = d+PEND_SEP+id+PEND_SEP;
  for(const k in state.pend){ if(k.startsWith(pre)) out[state.pend[k].f] = state.pend[k].v; }
  return out;
}
function stageEdit(d,id,f,v){
  const orig = Number(((state.dayData||{})[id]||{})[f])||0;
  const k = pk(d,id,f);
  if(d===state.day && Math.abs(v-orig)<1e-9) delete state.pend[k]; else state.pend[k] = {d,id,f,v};
  refreshSaveBar();
}
function paintDirty(){
  $$('.ledger-table tbody tr[data-id] input.cell-amt').forEach(inp=>{
    inp.classList.toggle('dirty', hasPend(state.day, inp.closest('tr').dataset.id, inp.dataset.field));
  });
}
const r2 = x=>Math.round((Number(x)||0)*100)/100;
function recalcLedgerDom(){
  const main = $('#main'); if(!main) return;
  const trs = main.querySelectorAll('.ledger-table tbody tr[data-id]'); if(!trs.length) return;
  const K = ['fawry','aman','masary','mumkin','basata','cash','collection','debtYesterday'];
  const tot = {fawry:0,aman:0,masary:0,mumkin:0,basata:0,cash:0,drawn:0,collection:0,debtYesterday:0,newDebt:0};
  trs.forEach(tr=>{
    const row = {}; K.forEach(k=>{ const i = tr.querySelector(`input[data-field="${k}"]`); row[k] = i ? (Number(i.value)||0) : 0; });
    const drawn = row.fawry+row.aman+row.masary+row.mumkin+row.basata+row.cash, nd = computeNewDebt(row);
    K.forEach(k=>tot[k]+=row[k]); tot.drawn += drawn; tot.newDebt += nd;
    tr.children[9].textContent = fmt(r2(drawn));
    const ndc = tr.children[12]; ndc.textContent = fmt(r2(nd)); ndc.className = 'tnum '+(nd>0?'neg':(nd<0?'pos':''));
  });
  Object.keys(tot).forEach(k=>tot[k]=r2(tot[k]));
  const tf = main.querySelector('.ledger-table tfoot tr');
  if(tf){ ['fawry','aman','masary','mumkin','basata','cash','drawn','collection','debtYesterday','newDebt'].forEach((k,i)=>{ if(tf.children[3+i]) tf.children[3+i].textContent = fmt(tot[k]); }); }
  const lab = {'إجمالي التحصيل':'collection','إجمالي المسحوبات':'drawn','آجل أمس':'debtYesterday','المديونية الجديدة':'newDebt'};
  main.querySelectorAll('.stat').forEach(st=>{ const k = lab[(st.querySelector('.label')||{textContent:''}).textContent.trim()]; const v = st.querySelector('.val'); if(k && v) v.innerHTML = fmt(tot[k])+' <small>ج.م</small>'; });
  const cols = {}; LEDGER_COLS.forEach(([k,l])=>cols[l]=k);
  main.querySelectorAll('.tot-item').forEach(it=>{ const k = cols[(it.querySelector('span')||{textContent:''}).textContent.trim()]; const b = it.querySelector('b'); if(k && b) b.textContent = fmt(tot[k]); });
}
let _sbTimer = 0;
function ensureSaveBar(){
  let b = $('#saveBar');
  if(!b){ b = document.createElement('div'); b.id = 'saveBar'; b.className = 'save-bar'; b.hidden = true; document.body.appendChild(b); }
  return b;
}
function refreshSaveBar(flash){
  const b = ensureSaveBar(), n = pendCount();
  window.onbeforeunload = n ? (e=>{ e.preventDefault(); e.returnValue = ''; return ''; }) : null;
  if(!state.user){ b.hidden = true; return; }
  clearTimeout(_sbTimer);
  if(n){
    b.hidden = false; b.className = 'save-bar';
    b.innerHTML = `<span>✎ <b class="tnum">${n}</b> تعديل لسه <b>متحفظش</b></span><button class="btn primary sm" id="sbSave">حفظ</button><button class="btn sm" id="sbDiscard">إلغاء</button>`;
    $('#sbSave').onclick = saveAllPending; $('#sbDiscard').onclick = discardPending;
  } else if(flash){
    b.hidden = false; b.className = 'save-bar '+(flash.ok?'ok':'err'); b.innerHTML = flash.html;
    if(flash.ok) _sbTimer = setTimeout(()=>{ b.hidden = true; }, 4500);
  } else b.hidden = true;
}
function discardPending(){
  if(!pendCount()) return;
  if(!confirm('تلغي '+pendCount()+' تعديل لسه متحفظش؟')) return;
  state.pend = {}; refreshSaveBar(); render();
}
async function saveAllPending(){
  const items = Object.values(state.pend); if(!items.length) return true;
  if(!state.db || !state.connected){ toast('مش متصل بقاعدة البيانات — التعديلات لسه عندك ومتحفظتش'); return false; }
  if(saveAllPending._busy) return false; saveAllPending._busy = true;
  const b = $('#sbSave'); if(b){ b.disabled = true; b.textContent = 'جاري الحفظ…'; }
  const up = {}; items.forEach(it=>{ up[`days/${it.d}/${it.id}/${it.f}`] = it.v; });
  try{
    const ack = await Promise.race([state.db.ref().update(up).then(()=>'ok'), new Promise(r=>setTimeout(()=>r('timeout'),10000))]);
    if(ack==='timeout'){
      refreshSaveBar({ok:false, html:'⚠ السيرفر مردّش خلال 10 ثواني — التعديلات <b>ممكن ميكونش اتحفظت</b>. راجع النت وجرّب «حفظ» تاني.'});
      const sb = $('#saveBar'); if(sb) sb.insertAdjacentHTML('beforeend','<button class="btn primary sm" id="sbRetry">حفظ تاني</button>'), $('#sbRetry').onclick = saveAllPending;
      return false;
    }
    items.forEach(it=>{ const k = pk(it.d,it.id,it.f); if(state.pend[k] && state.pend[k].v===it.v) delete state.pend[k]; });
    const days = [...new Set(items.map(i=>i.d))], cl = new Set(items.map(i=>i.d+i.id)).size;
    refreshSaveBar({ok:true, html:`✓ اتحفظ <b class="tnum">${items.length}</b> تعديل على السيرفر (${cl} عميل${days.length===1?' — يوم '+days[0]:' — '+days.length+' أيام'}) · ${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}`});
    $$('.ledger-table input.dirty').forEach(i=>{ if(!hasPend(state.day, i.closest('tr').dataset.id, i.dataset.field)){ i.classList.remove('dirty'); i.classList.add('saved-flash'); setTimeout(()=>i.classList.remove('saved-flash'),1600); } });
    return true;
  }catch(err){
    const denied = /permission/i.test((err.code||'')+' '+err.message);
    refreshSaveBar({ok:false, html:'✗ فشل الحفظ: '+escapeHtml(err.message)+(denied?' — صلاحيات Firebase رافضة الكتابة':'')+' — التعديلات لسه عندك.'});
    return false;
  }finally{ saveAllPending._busy = false; }
}
/* قبل أي عملية جماعية: لازم التعديلات تتحفظ الأول */
function guardPending(fn){
  if(!pendCount()) return fn();
  openModal(`<div class="hd"><h3>فيه تعديلات لسه متحفظتش</h3><button class="btn ghost sm" id="mClose">✕</button></div>
    <div class="bd"><div class="preview-box warn">عندك <b>${pendCount()}</b> تعديل لسه مكتوب ومتحفظش. العملية دي بتقرا الداتا من السيرفر، فلازم تحفظهم الأول عشان يتحسبوا.</div></div>
    <div class="ft"><button class="btn" id="mCancel">إلغاء</button><button class="btn primary" id="gpSave">حفظ وكمّل</button></div>`, ()=>{
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#gpSave').onclick = async ()=>{ $('#gpSave').disabled = true; if(await saveAllPending()){ closeModal(); fn(); } else $('#gpSave').disabled = false; };
  });
}
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s' && pendCount()){ e.preventDefault(); saveAllPending(); } });

/* ================= النسخ الاحتياطي ================= */
const BK_NODES = ['clients','reps','suppliers','cashOps','repNotes','dataCompletion','alerts','users'];
const BK_KEEP = 20;
function downloadJSON(name, obj){
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const stamp = ()=>{ const d = new Date(), p = n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); };
async function readNode(p){ return (await state.db.ref(p).once('value')).val(); }
/* نسخة تلقائية صغيرة جوه الداتا بيز: كل البيانات الأساسية + الأيام المعنية بالعملية (آخر 20 نسخة) */
async function makeSnapshot(reason, dates){
  try{
    const data = {};
    for(const n of BK_NODES) data[n] = await readNode(n);
    data.days = {}; for(const d of (dates||[])) data.days[d] = await readNode('days/'+d);
    const key = String(Date.now());
    await state.db.ref('backups/'+key).set({createdAt:Date.now(), reason, dates:dates||[], data});
    await state.db.ref('meta/backupIdx/'+key).set({createdAt:Date.now(), reason, dates:(dates||[]).join(' ← '), clients:Object.keys(data.clients||{}).length});
    const idx = (await readNode('meta/backupIdx'))||{}, keys = Object.keys(idx).sort();
    if(keys.length>BK_KEEP){ const up = {}; keys.slice(0, keys.length-BK_KEEP).forEach(k=>{ up['backups/'+k] = null; up['meta/backupIdx/'+k] = null; }); await state.db.ref().update(up); }
    return {ok:true, key};
  }catch(e){ return {ok:false, err:e.message}; }
}
/* نسخة كاملة بالأيام كلها كملف JSON على جهازك */
async function downloadFullBackup(btn){
  if(btn){ btn.disabled = true; btn.textContent = 'جاري التجهيز…'; }
  try{
    const out = {app:'taqfila', exportedAt:new Date().toISOString()};
    for(const n of [...BK_NODES,'days']) out[n] = await readNode(n);
    downloadJSON('taqfila-backup-'+stamp()+'.json', out);
    try{ localStorage.setItem('tq_last_full_backup', String(Date.now())); }catch(e){}
    toast('اتنزّلت نسخة كاملة ✓ — '+Object.keys(out.days||{}).length+' يوم و'+Object.keys(out.clients||{}).length+' عميل');
  }catch(e){ toast('فشل التنزيل: '+e.message); }
  if(btn){ btn.disabled = false; btn.textContent = 'نزّل نسخة كاملة (JSON)'; }
}
function showRolloverReport(r){
  const s = r.snap;
  openModal(`<div class="hd"><h3>${r.ok?'✅':'⚠'} ${escapeHtml(r.title)}</h3><button class="btn ghost sm" id="mClose">✕</button></div>
    <div class="bd">
      ${r.lines.map(l=>`<div class="preview-box">${l}</div>`).join('')}
      <div class="preview-box ${r.ok?'':'warn'}" style="margin-top:8px">${r.check}</div>
      <div class="preview-box ${s&&s.ok?'':'warn'}" style="margin-top:8px">${s&&s.ok
        ? '💾 اتعملت <b>نسخة احتياطية تلقائية</b> على السيرفر (بيانات العملاء والمندوبين والموردين والكاش + اليومين المعنيين). بنحتفظ بآخر '+BK_KEEP+' نسخة. فيه برضو نسخة كاملة بكل الأيام تقدر تنزّلها على جهازك.'
        : '⚠ النسخة الاحتياطية التلقائية ما اتعملتش'+(s&&s.err?' ('+escapeHtml(s.err)+')':'')+' — نزّل نسخة كاملة على جهازك دلوقتي.'}</div>
    </div>
    <div class="ft">${r.logId?'<button class="btn danger" id="rpUndo">تراجع عن الترحيل</button>':''}<button class="btn" id="rpDl">نزّل نسخة كاملة (JSON)</button><button class="btn primary" id="mCancel">تمام</button></div>`, ()=>{
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#rpDl').onclick = e=>downloadFullBackup(e.target);
    const u = $('#rpUndo'); if(u) u.onclick = ()=>undoCarry(r.logId);
  });
}
function rulesText(adminUid){
  const A = `auth.uid === '${adminUid}'`;
  const S = `${A} || root.child('users').child(auth.uid).child('role').val() === 'rep'`;
  const staffRead = {".read": S, ".write": A};
  return JSON.stringify({rules:{
    ".read": false, ".write": false,
    "users": {".read": A, ".write": A, "$uid": {".read": `auth.uid === $uid || ${A}`}},
    "clients": staffRead, "reps": staffRead, "days": staffRead,
    "repNotes": {".read": S, ".write": S},
    "suppliers": {".read": A, ".write": A}, "cashOps": {".read": A, ".write": A},
    "dataCompletion": {".read": A, ".write": A}, "alerts": {".read": A, ".write": A},
    "meta": {".read": A, ".write": A}, "backups": {".read": A, ".write": A}
  }}, null, 2);
}
function renderAdminExtras(main){
  if(!state.user || state.user.role!=='admin') return;
  const last = (()=>{ try{ return Number(localStorage.getItem('tq_last_full_backup'))||0; }catch(e){ return 0; } })();
  const lastTxt = last ? new Date(last).toLocaleString('ar-EG') : 'لسه منزّلتش';
  main.insertAdjacentHTML('beforeend', `
    <div class="card pad" style="max-width:560px;margin-top:16px"><h3 style="margin:0 0 6px">النسخ الاحتياطي</h3>
      <div style="font-size:12.5px;color:var(--fg-dim);margin-bottom:10px">بتتعمل نسخة تلقائية بعد كل ترحيل أو نقل يوم. وتقدر تنزّل نسخة كاملة بكل الأيام على جهازك. آخر نسخة كاملة نزّلتها: <b>${lastTxt}</b></div>
      <button class="btn primary" id="bkFull">نزّل نسخة كاملة (JSON)</button>
      <div id="bkList" style="margin-top:14px;font-size:13px;color:var(--fg-dim)">جاري تحميل النسخ التلقائية…</div></div>
    <div class="card pad" style="max-width:560px;margin-top:16px"><h3 style="margin:0 0 6px">قواعد الأمان (Rules)</h3>
      <div style="font-size:12.5px;color:var(--fg-dim);margin-bottom:8px">الحماية الحقيقية بتتحدد هنا: Firebase Console ← Realtime Database ← Rules ← الصق القواعد دي ← Publish. فيها الـ UID بتاعك جاهز (${escapeHtml(state.user.uid)}).</div>
      <textarea id="rulesTxt" dir="ltr" readonly style="width:100%;height:220px;font-family:monospace;font-size:12px;border-radius:10px;border:1px solid var(--border);padding:8px;background:var(--bg);color:var(--fg)">${escapeHtml(rulesText(state.user.uid))}</textarea>
      <div style="margin-top:8px"><button class="btn" id="rulesCopy">نسخ القواعد</button></div></div>`);
  $('#bkFull').onclick = e=>downloadFullBackup(e.target);
  $('#rulesCopy').onclick = ()=>{ const t = $('#rulesTxt'); t.select(); try{ document.execCommand('copy'); toast('اتنسخت ✓'); }catch(e){ toast('انسخها يدوي'); } };
  (async()=>{
    const box = $('#bkList'); if(!box) return;
    try{
      const idx = (await readNode('meta/backupIdx'))||{}, keys = Object.keys(idx).sort().reverse().slice(0,10);
      const logs = (await state.db.ref('meta/carryLogs').orderByKey().limitToLast(5).once('value')).val()||{};
      const lk = Object.keys(logs).sort().reverse();
      box.innerHTML = (keys.length ? `<div style="font-weight:700;margin-bottom:4px">آخر النسخ التلقائية</div>`+keys.map(k=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--border)"><span style="flex:1">${new Date(idx[k].createdAt).toLocaleString('ar-EG')} — ${escapeHtml(idx[k].reason||'')} · ${idx[k].clients||0} عميل</span><button class="btn sm" data-bkdl="${k}">تنزيل</button></div>`).join('') : 'مفيش نسخ تلقائية لسه.')
        + (lk.length ? `<div style="font-weight:700;margin:12px 0 4px">آخر عمليات الترحيل</div>`+lk.map(k=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--border)"><span style="flex:1">${escapeHtml(logs[k].from)} ← ${escapeHtml(logs[k].to)} · ${logs[k].count} عميل · ${fmt(logs[k].total)}</span>${logs[k].undone?'<span class="pill neutral">اتلغى</span>':`<button class="btn sm danger" data-cundo="${k}">تراجع</button>`}</div>`).join('') : '');
      $$('[data-bkdl]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ const v = await readNode('backups/'+b.dataset.bkdl); downloadJSON('taqfila-snapshot-'+b.dataset.bkdl+'.json', v); }catch(e){ toast('خطأ: '+e.message); } b.disabled=false; });
      $$('[data-cundo]').forEach(b=>b.onclick=()=>undoCarry(b.dataset.cundo));
    }catch(e){ box.textContent = 'تعذر تحميل النسخ: '+e.message; }
  })();
}

function boot(){
  installGuard(); ensureSaveBar();
  const cfg = loadConfig() || DEFAULT_FIREBASE_CONFIG;
  render();
  connectFirebase(cfg);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
