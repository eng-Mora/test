function mchPreview(){
  const m = mchState, box = $('#mchPreview'), btn = $('#mchApply');
  m.plan = null; btn.disabled = true;
  if(m.mode==='retype') return mchPreviewRetype();
  if(m.nameCol==null || m.noCol==null){ box.innerHTML = '<div class="preview-box warn">اختار عمود الاسم وعمود رقم المكنة.</div>'; return; }
  // 1) تجميع الشيت بالاسم
  const groups = new Map();
  let blank = 0;
  m.rows.slice(m.header).forEach(r=>{
    const name = r[m.nameCol]==null ? '' : String(r[m.nameCol]).trim();
    const no = mchNo(r[m.noCol]);
    if(!name || !no){ if(name||no) blank++; return; }
    const k = mchKey(name);
    if(!groups.has(k)) groups.set(k, {name, machines:[]});
    const g = groups.get(k);
    const type = mchTypeOf(m.typeCol==null?null:r[m.typeCol], m.defType);
    if(!g.machines.some(x=>x.no===no && x.type===type)) g.machines.push({type, no});
  });
  // 2) مطابقة مع العملاء الحاليين
  const idx = upBuildIndex();
  const plan = [];
  let ordNext = maxOrder();
  groups.forEach(g=>{
    const hit = upMatch(g.name, idx);
    if(hit.dup){ plan.push({...g, status:'dup', added:[], skipped:[]}); return; }
    const cur = hit.id ? machinesOf(state.clients[hit.id]).map(x=>({type:x.type||'aman', no:String(x.no).trim()})) : [];
    const added = [], skipped = [];
    g.machines.forEach(x=>{
      (cur.some(c=>c.no===x.no) ? skipped : added).push(x);
    });
    plan.push({...g, id:hit.id||null, status: hit.id?'update':'new', cur, added, skipped});
  });
  // 3) رقم مكنة على أكتر من عميل
  const owners = {};
  plan.forEach(p=>(p.added||[]).forEach(x=>{ (owners[x.no]=owners[x.no]||new Set()).add(p.name); }));
  Object.entries(state.clients).forEach(([cid,c])=>{ if(!c) return; machinesOf(c).forEach(x=>{
    const o = owners[String(x.no).trim()]; if(o && !plan.some(p=>p.id===cid)) o.add(c.name);
  }); });
  const dupNos = Object.entries(owners).filter(([n,s])=>s.size>1);
  m.plan = plan;
  const nNew = plan.filter(p=>p.status==='new').length, nUpd = plan.filter(p=>p.status==='update' && p.added.length).length;
  const nSame = plan.filter(p=>p.status==='update' && !p.added.length).length, nDup = plan.filter(p=>p.status==='dup').length;
  const nMach = plan.reduce((a,p)=>a+p.added.length,0), nMulti = plan.filter(p=>p.machines.length>1).length;
  const badge = {new:'<span class="pill good">عميل جديد</span>', update:'<span class="pill neutral">موجود</span>', dup:'<span class="pill danger">اسم مكرر في الداتا</span>'};
  box.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); margin-bottom:10px">
      <div class="stat"><div class="label">عملاء جدد</div><div class="val tnum">${nNew}</div></div>
      <div class="stat"><div class="label">عملاء هيتضاف لهم مكن</div><div class="val tnum">${nUpd}</div></div>
      <div class="stat"><div class="label">مكن جديدة</div><div class="val tnum">${nMach}</div></div>
      <div class="stat"><div class="label">عملاء بأكتر من مكنة</div><div class="val tnum">${nMulti}</div></div>
    </div>
    ${nSame?`<div class="preview-box">${nSame} عميل مكنهم متسجلة بالفعل — هيتخطوا.</div>`:''}
    ${nDup?`<div class="preview-box warn" style="margin-top:6px">${nDup} اسم ليه أكتر من عميل بنفس الاسم في الداتا — هيتخطوا (اتأكد منهم يدوي).</div>`:''}
    ${dupNos.length?`<div class="preview-box warn" style="margin-top:6px">رقم المكنة متكرر على أكتر من عميل:<br>${dupNos.map(([n,s])=>`<span class="tnum">${escapeHtml(n)}</span> ← ${[...s].map(escapeHtml).join(' / ')}`).join('<br>')}</div>`:''}
    ${blank?`<div class="preview-box warn" style="margin-top:6px">${blank} صف ناقص اسم أو رقم مكنة — اتخطى.</div>`:''}
    <div class="tablewrap" style="margin-top:10px; max-height:280px; overflow-y:auto">
      <table style="min-width:520px"><thead><tr><th>العميل</th><th>الحالة</th><th>المكن اللي هتتضاف</th></tr></thead><tbody>
      ${plan.map(p=>`<tr><td class="name-cell">${escapeHtml(p.name)}</td><td>${badge[p.status]}</td>
        <td style="text-align:start">${p.added.map(x=>`<span class="pill good" style="margin:1px">${machineLabel(x.type)} · <span class="tnum">${escapeHtml(x.no)}</span></span>`).join(' ')}
        ${(p.skipped||[]).map(x=>`<span class="pill neutral" style="margin:1px;opacity:.6" title="متسجلة بالفعل">${escapeHtml(x.no)}</span>`).join(' ')}</td></tr>`).join('')}
      </tbody></table></div>`;
  btn.disabled = !(nNew || nMach);
}
/* تصحيح النوع: بنفس الشيت، أي رقم مكنة موجود عند عميل بنوع مختلف بيتغير للنوع المختار */
function mchPreviewRetype(){
  const m = mchState, box = $('#mchPreview'), btn = $('#mchApply');
  if(m.noCol==null){ box.innerHTML = '<div class="preview-box warn">اختار عمود رقم المكنة.</div>'; return; }
  const byNo = {};
  Object.entries(state.clients).forEach(([id,c])=>{ if(!c) return; machinesOf(c).forEach(x=>{
    const k = mchNo(x.no); (byNo[k]=byNo[k]||[]).push({id, type:x.type||'aman'});
  }); });
  const per = new Map(), seen = new Set(); let same = 0, missing = 0, total = 0, other = 0;
  m.rows.slice(m.header).forEach(r=>{
    const no = mchNo(r[m.noCol]); if(!no || seen.has(no)) return; seen.add(no);
    const to = mchTypeOf(m.typeCol==null?null:r[m.typeCol], m.defType);
    const hits = byNo[no]; if(!hits){ missing++; return; }
    hits.forEach(h=>{
      if(m.fromType && h.type!==m.fromType){ other++; return; }
      if(h.type===to){ same++; return; }
      if(!per.has(h.id)) per.set(h.id, {id:h.id, name:state.clients[h.id].name, items:[]});
      per.get(h.id).items.push({no, from:h.type, to}); total++;
    });
  });
  m.plan = [...per.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  box.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); margin-bottom:10px">
      <div class="stat"><div class="label">مكن هيتغير نوعها</div><div class="val tnum">${total}</div></div>
      <div class="stat"><div class="label">عملاء</div><div class="val tnum">${m.plan.length}</div></div>
      <div class="stat"><div class="label">نوعها صح بالفعل</div><div class="val tnum">${same}</div></div>
    </div>
    ${other?`<div class="preview-box">${other} مكنة نوعها مش «${machineLabel(m.fromType)}» — هتتخطى.</div>`:''}
    ${missing?`<div class="preview-box warn" style="margin-top:6px">${missing} رقم مكنة مش موجود عند أي عميل — هيتخطى.</div>`:''}
    <div class="tablewrap" style="margin-top:10px; max-height:280px; overflow-y:auto">
      <table style="min-width:520px"><thead><tr><th>العميل</th><th>التغيير</th></tr></thead><tbody>
      ${m.plan.map(p=>`<tr><td class="name-cell">${escapeHtml(p.name)}</td><td style="text-align:start">${p.items.map(x=>`<span class="pill neutral" style="margin:1px"><span class="tnum">${escapeHtml(x.no)}</span> · ${machineLabel(x.from)} ← ${machineLabel(x.to)}</span>`).join(' ')}</td></tr>`).join('')}
      </tbody></table></div>`;
  btn.disabled = !total;
}

function mchRenderHistory(){

  $$('[data-mchundo]').forEach(b=>b.onclick = ()=>mchUndo(b.dataset.mchundo));

async function mchUndo(logId){
  try{
    const log = (await state.db.ref(MCH_LOG+'/'+logId).once('value')).val();
    if(!log || log.undone) return;
    const nCreated = (log.created||[]).length;
    const msg = log.mode==='retype'
      ? `تتراجع عن تصحيح نوع ${log.machCount||0} مكنة (رفعة «${log.fileName||''}»)؟ الأنواع هترجع زي ما كانت.`
      : `تتراجع عن رفعة «${log.fileName||''}»؟ هتتشال ${log.machCount||0} مكنة${nCreated?` وهيتحذف ${nCreated} عميل اتعمل مع الرفعة دي (مع أي بيانات يومية عليهم)`:''}.`;
    if(!confirm(msg)) return;
    const clients = (await state.db.ref('clients').once('value')).val() || {};
    const updates = {}, created = log.created||[];
    const key = x=>mchNo(x.no)+'|'+(x.type||'aman');
    if(log.mode==='retype'){
      Object.entries(log.items||{}).forEach(([cid,arr])=>{
        const c = clients[cid]; if(!c) return;
        updates['clients/'+cid+'/machines'] = machinesOf(c).map(x=>{
          const hit = arr.find(a=>mchNo(a.no)===mchNo(x.no) && a.to===(x.type||'aman'));
          return hit ? {...x, type:hit.from} : x;
        });
      });
    } else {
      created.forEach(cid=>{ if(clients[cid]) updates['clients/'+cid] = null; });
      Object.entries(log.items||{}).forEach(([cid,arr])=>{
        if(created.includes(cid) || !clients[cid]) return;
        const rm = new Set(arr.map(key));
        updates['clients/'+cid+'/machines'] = machinesOf(clients[cid]).filter(x=>!rm.has(key(x)));
      });
    }
    updates[MCH_LOG+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = (mchState.hist||[]).find(x=>x.id===logId); if(h) h.undone = true;
    mchRenderHistory();
    toast('تم التراجع');
  }catch(err){ toast('خطأ: '+err.message); }
}

function mchApply(){
  const m = mchState; if(!m.plan || !state.db) return;
  const updates = {}, items = {}, created = []; let order = maxOrder(), nC = 0, nM = 0;
  if(m.mode==='retype'){
    m.plan.forEach(p=>{
      const c = state.clients[p.id]; if(!c) return;
      updates['clients/'+p.id+'/machines'] = machinesOf(c).map(x=>{
        const hit = p.items.find(i=>mchNo(i.no)===mchNo(x.no));
        return hit ? {...x, type:hit.to} : x;
      });
      items[p.id] = p.items; nM += p.items.length;
    });
  } else {
    m.plan.forEach(p=>{
      if(p.status==='new'){
        const id = uid();
        updates['clients/'+id] = {name:p.name, active:true, order:++order, machines:p.added};
        items[id] = p.added; created.push(id); nC++; nM += p.added.length;
      } else if(p.status==='update' && p.added.length){
        updates['clients/'+p.id+'/machines'] = [...p.cur, ...p.added];
        items[p.id] = p.added; nM += p.added.length;
      }
    });
  }
  if(!Object.keys(updates).length) return toast('مفيش حاجة تتغير');
  updates[MCH_LOG+'/'+uid()] = {createdAt:Date.now(), fileName:m.fileName||'', mode:m.mode||'add', typeLabel:machineLabel(m.defType),
    machCount:nM, createdCount:nC, created, items};
  state.db.ref().update(updates).then(()=>{
    toast(m.mode==='retype' ? `تم تصحيح نوع ${nM} مكنة` : `تم: ${nC} عميل جديد، ${nM} مكنة اتضافت`); closeModal();
  }).catch(err=>toast('خطأ: '+err.message));
}

function csUseSheet(name){
  const m=csState; m.sheet=name;
  m.rows = XLSX.utils.sheet_to_json(m.wb.Sheets[name],{header:1,defval:null,raw:true});
  m.header=1; m.nameCol=m.valCol=null;
  for(let i=0;i<Math.min(m.rows.length,15);i++){
    const r=m.rows[i]||[];
    const n=r.findIndex(c=>typeof c==='string' && /اسم|عميل|تاجر|محل/.test(norm(c)));
    if(n>=0){
      m.header=i+1; m.nameCol=n;
      const v=r.findIndex((c,j)=>j!==n && typeof c==='string' && /كاش|قيمه|قيمة|مبلغ|اجمالي|إجمالي|amount|value|total/i.test(norm(c)));
      m.valCol = v>=0 ? v : null; break;
    }
  }
  if(m.nameCol==null){ // من غير عناوين: أول عمود نصي وأول عمود رقمي
    const r=m.rows.find(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number'))||[];
    const n=r.findIndex(c=>typeof c==='string'); if(n>=0) m.nameCol=n;
    const v=r.findIndex(c=>typeof c==='number'); if(v>=0) m.valCol=v;
    m.header=0;
  } else if(m.valCol==null){
    const r=m.rows[m.header]||[]; const j=r.findIndex((c,k)=>k!==m.nameCol && typeof c==='number'); if(j>=0) m.valCol=j;
  }
  csRenderOptions();
}
function csRenderOptions(){
  const m=csState, hdr=m.rows[Math.max(0,m.header-1)]||[], width=Math.max(hdr.length, ...(m.rows.slice(0,30).map(r=>(r||[]).length)));
  const opts=cur=>'<option value="">— اختر —</option>'+Array.from({length:width},(_,i)=>{
    const h=m.header>0?hdr[i]:null;
    return `<option value="${i}" ${cur===i?'selected':''}>${escapeHtml(h==null?'عمود '+(i+1):String(h))} (${colToLetter(i)})</option>`; }).join('');
  $('#csBody').innerHTML=`

      <div class="field"><label>رقم صف العناوين (0 = مفيش)</label><input id="csHeader" type="number" min="0" value="${m.header}"></div>
      <div class="field"><label>عمود اسم التاجر *</label><select id="csName">${opts(m.nameCol)}</select></div>
      <div class="field"><label>عمود قيمة الكاش *</label><select id="csVal">${opts(m.valCol)}</select></div>
    </div>

  const num=v=>v===''?null:Number(v);
  $('#csSheet').onchange=e=>csUseSheet(e.target.value);
  $('#csHeader').onchange=e=>{ m.header=Math.max(0,Number(e.target.value)||0); csRenderOptions(); };
  $('#csName').onchange=e=>{ m.nameCol=num(e.target.value); csPreview(); };
  $('#csVal').onchange=e=>{ m.valCol=num(e.target.value); csPreview(); };
  csPreview();
}
function csPreview(){
  const m=csState, box=$('#csPreview'), btn=$('#csApply');
  m.plan=null; if(btn) btn.disabled=true; if(!box) return;
  if(m.nameCol==null||m.valCol==null){ box.innerHTML='<div class="preview-box warn">اختار عمود الاسم وعمود القيمة.</div>'; return; }
  const idx=upBuildIndex(), per=new Map(), missing=[], dups=[]; let total=0, dupRows=0;
  m.rows.slice(m.header).forEach(r=>{
    if(!r) return;
    const name=r[m.nameCol]==null?'':String(r[m.nameCol]).trim();
    const val=upRound(upToNum(r[m.valCol]));
    if(!name || !val || UP_SKIP_NAMES.includes(norm(name))) return;
    const hit=upMatch(name, idx);
    if(hit.dup){ dups.push({name,val}); return; }
    if(!hit.id){ missing.push({name,val}); return; }
    if(per.has(hit.id)){ dupRows++; } else per.set(hit.id,{id:hit.id, name:state.clients[hit.id].name, sum:0, rows:0});
    const g=per.get(hit.id); g.sum=upRound(g.sum+val); g.rows++; total=upRound(total+val);
  });
  const cur=(m.date===state.day?state.dayData:null);
  m.plan={per, date:m.date};
  const list=[...per.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  box.innerHTML=`

    </div>
    ${missing.length?`<div class="preview-box warn">أسماء مش موجودة في العملاء (هتتخطى): ${missing.map(x=>`${escapeHtml(x.name)} (${fmt(x.val)})`).join('، ')}</div>`:''}
    ${dups.length?`<div class="preview-box warn" style="margin-top:6px">اسم ليه أكتر من عميل في الداتا (هيتخطى): ${dups.map(x=>escapeHtml(x.name)).join('، ')}</div>`:''}
    ${dupRows?`<div class="preview-box" style="margin-top:6px">${dupRows} صف بنفس اسم التاجر اتكرر — القيم اتجمعت.</div>`:''}
    <div class="tablewrap" style="margin-top:10px; max-height:280px; overflow-y:auto">
      <table style="min-width:420px"><thead><tr><th>التاجر</th><th>${m.mode==='add'?'هتتضاف':'هتبقى'}</th>${cur?'<th>كاش حاليًا</th>':''}</tr></thead><tbody>
      ${list.map(g=>`<tr><td class="name-cell">${escapeHtml(g.name)}</td><td class="tnum"><b>${fmt(g.sum)}</b></td>${cur?`<td class="tnum">${fmt((cur[g.id]||{}).cash||0)}</td>`:''}</tr>`).join('')}
      </tbody></table></div>`;
  btn.disabled = !list.length || !m.date;
}
async function csApply(){
  const m=csState; if(!m.plan||!state.db||m.busy) return;
  const {per,date}=m.plan; if(!date) return toast('اختار التاريخ');
  m.busy=true; const btn=$('#csApply'); btn.disabled=true; btn.textContent='جاري الحفظ…';
  try{
    const ex=(await state.db.ref('days/'+date).once('value')).val()||{};
    const updates={}, items={}; let total=0;
    per.forEach(g=>{
      const old=Number((ex[g.id]||{}).cash)||0;
      const nv=upRound(m.mode==='add'?old+g.sum:g.sum);
      updates['days/'+date+'/'+g.id+'/cash']=nv;
      items[g.id]={prev:old, delta:upRound(nv-old)}; total=upRound(total+g.sum);
    });
    updates[CASH_LOG+'/'+uid()]={createdAt:Date.now(), fileName:m.fileName||'', date, mode:m.mode, count:per.size, total, items};
    await state.db.ref().update(updates);
    toast(`تم تحديث الكاش لـ ${per.size} تاجر`); closeModal();
    if(date!==state.day){ state.day=date; bindDay(date); }
  }catch(err){ toast('خطأ: '+err.message); m.busy=false; btn.disabled=false; btn.textContent='تنفيذ الرفع'; }
}
function csLoadHistory(){
  return state.db.ref(CASH_LOG).orderByKey().limitToLast(15).once('value').then(s=>{
    const v=s.val()||{};
    csState.hist=Object.entries(v).map(([id,h])=>({id,...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

function csRenderHistory(){

        <td>${h.undone?'<span class="pill neutral">اتلغت</span>':`<button class="btn sm danger" data-csundo="${h.id}">تراجع</button>`}</td>
      </tr>`).join('')}</tbody></table></div>`;
  $$('[data-csundo]').forEach(b=>b.onclick=()=>csUndo(b.dataset.csundo));

async function csUndo(logId){
  try{
    const log=(await state.db.ref(CASH_LOG+'/'+logId).once('value')).val();
    if(!log||log.undone) return;
    if(!confirm(`تتراجع عن رفعة الكاش «${log.fileName||''}» (${log.count||0} تاجر) على يوم ${log.date}؟`)) return;
    const day=(await state.db.ref('days/'+log.date).once('value')).val()||{};
    const updates={};
    Object.entries(log.items||{}).forEach(([cid,it])=>{
      const cur=Number((day[cid]||{}).cash)||0;
      updates[`days/${log.date}/${cid}/cash`] = log.mode==='set' ? (it.prev||0) : upRound(cur-(it.delta||0));
    });
    updates[CASH_LOG+'/'+logId+'/undone']=true;
    await state.db.ref().update(updates);
    const h=(csState.hist||[]).find(x=>x.id===logId); if(h) h.undone=true;
    csRenderHistory(); toast('تم التراجع');
  }catch(err){ toast('خطأ: '+err.message); }
}

function amUseSheet(name, keepMode){
  const m=amState; m.sheet=name;
  m.rows = XLSX.utils.sheet_to_json(m.wb.Sheets[name],{header:1,defval:null,raw:true});
  m.header=1; m.noCol=m.valCol=null;
  const NO_RE=/مكن|ماكين|رقم|terminal|serial/i, NO_STRICT=/مكن|ماكين|terminal|serial/i, NAME_RE=/اسم|عميل|تاجر|محل/;
  const findHdr = re => {
    for(let i=0;i<Math.min(m.rows.length,15);i++){
      const r=m.rows[i]||[];
      const n=r.findIndex(c=>typeof c==='string' && re.test(norm(c)));
      if(n>=0) return {i,n};
    }
    return null;
  };
  // تحديد طريقة المطابقة تلقائيًا: لو مفيش عمود مكنة والشيت فيه عمود اسم → بالاسم
  if(!keepMode) m.by = (!findHdr(NO_STRICT) && findHdr(NAME_RE)) ? 'name' : 'no';
  const bySel=$('#amBy'); if(bySel) bySel.value=m.by;
  const hit=findHdr(m.by==='name' ? NAME_RE : NO_RE);
  if(hit){
    m.header=hit.i+1; m.noCol=hit.n;
    const r=m.rows[hit.i]||[];
    const v=r.findIndex((c,j)=>j!==hit.n && typeof c==='string' && /قيمه|قيمة|مبلغ|اجمالي|إجمالي|مسحوب|amount|value|total|امان/i.test(norm(c)));
    m.valCol = v>=0 ? v : null;
  } else if(m.by==='name'){ // من غير عناوين: أول عمود نصي وأول عمود رقمي
    const r=m.rows.find(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number'))||[];
    const n=r.findIndex(c=>typeof c==='string'); if(n>=0) m.noCol=n;
    const v=r.findIndex(c=>typeof c==='number'); if(v>=0) m.valCol=v;
    m.header=0;
  }
  if(m.valCol==null){ // لو معرفناش العناوين: اختار أول عمود تاني فيه أرقام
    const r=m.rows[m.header]||[]; const j=r.findIndex((c,k)=>k!==m.noCol && typeof c==='number'); if(j>=0) m.valCol=j;
  }
  amRenderOptions();
}
function amRenderOptions(){
  const m=amState, header=m.rows[m.header-1]||[], isName=m.by==='name';
  const width=Math.max(header.length, ...(m.rows.slice(0,30).map(r=>(r||[]).length)));
  const opts=cur=>'<option value="">— اختر —</option>'+Array.from({length:width},(_,i)=>{
    const h=m.header>0?header[i]:null;
    return `<option value="${i}" ${cur===i?'selected':''}>${escapeHtml(h==null?'عمود '+(i+1):String(h))} (${colToLetter(i)})</option>`; }).join('');
  $('#amBody').innerHTML=`
    <div class="row2">
      <div class="field"><label>الورقة</label><select id="amSheet">${m.wb.SheetNames.map(n=>`<option ${n===m.sheet?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select></div>
      <div class="field"><label>رقم صف العناوين (0 = مفيش)</label><input id="amHeader" type="number" min="0" value="${m.header}"></div>
      <div class="field"><label>${isName?'عمود اسم العميل *':'عمود رقم المكنة *'}</label><select id="amNo">${opts(m.noCol)}</select></div>
      <div class="field"><label>عمود القيمة *</label><select id="amVal">${opts(m.valCol)}</select></div>
    </div>
    <div id="amPreview" style="margin-top:12px"></div>`;
  const num=v=>v===''?null:Number(v);

  $('#amVal').onchange=e=>{ m.valCol=num(e.target.value); amPreview(); };

}
function amPreview(){
  const m=amState, box=$('#amPreview'), btn=$('#amApply');
  m.plan=null; if(btn) btn.disabled=true; if(!box) return;
  const isName=m.by==='name';
  if(m.noCol==null||m.valCol==null){ box.innerHTML=`<div class="preview-box warn">اختار عمود ${isName?'اسم العميل':'رقم المكنة'} وعمود القيمة.</div>`; return; }
  // فهرس: رقم المكنة -> العملاء (بنفضّل مكن نوع امان لو الرقم متسجل مرتين)
  const byNo={};
  Object.entries(state.clients).forEach(([id,c])=>{ if(!c) return; machinesOf(c).forEach(x=>{
    const k=mchNo(x.no); (byNo[k]=byNo[k]||[]).push({id, type:x.type||'aman'});
  }); });
  const per=new Map(), missing=[], ambiguous=[], seen=new Set(); let blank=0, dupRows=0, total=0;
  const nameIdx = isName ? upBuildIndex() : null;
  m.rows.slice(m.header).forEach(r=>{
    if(!r) return;
    if(isName){
      const nm=r[m.noCol]==null?'':String(r[m.noCol]).trim();
      if(!nm){ if(r[m.valCol]!=null && String(r[m.valCol]).trim()!=='') blank++; return; }
      if(UP_SKIP_NAMES.includes(norm(nm))) return;
      const val=upRound(upToNum(r[m.valCol]));
      if(!val) return;
      const h=upMatch(nm, nameIdx);
      if(h.dup){ ambiguous.push({no:nm,val,names:['أكتر من عميل بنفس الاسم']}); return; }
      if(!h.id){ missing.push({no:nm,val}); return; }
      if(per.has(h.id)) dupRows++;
      else per.set(h.id,{id:h.id,name:state.clients[h.id].name,items:[],sum:0});
      const g=per.get(h.id); g.items.push({no:nm,val}); g.sum=upRound(g.sum+val); total=upRound(total+val);
      return;
    }
    const no=mchNo(r[m.noCol]);
    if(!no){ if(r[m.valCol]!=null && String(r[m.valCol]).trim()!=='') blank++; return; }
    const val=upRound(upToNum(r[m.valCol]));
    if(!val) return;
    const hits=byNo[no]||[];
    const am=hits.filter(h=>h.type==='aman');
    const cand=am.length?am:hits;
    const ids=[...new Set(cand.map(h=>h.id))];
    if(!ids.length){ missing.push({no,val}); return; }
    if(ids.length>1){ ambiguous.push({no,val,names:ids.map(i=>state.clients[i].name)}); return; }
    const id=ids[0];
    if(seen.has(no)) dupRows++; seen.add(no);
    if(!per.has(id)) per.set(id,{id,name:state.clients[id].name,items:[],sum:0,nonAman:!am.length});
    const g=per.get(id); g.items.push({no,val}); g.sum=upRound(g.sum+val); total=upRound(total+val);
  });
  const date=m.date, cur=(date===state.day?state.dayData:null);
  m.plan={per, date};
  const list=[...per.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  box.innerHTML=`
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); margin-bottom:10px">
      <div class="stat"><div class="label">عملاء هيتحدّثوا</div><div class="val tnum">${list.length}</div></div>
      <div class="stat"><div class="label">إجمالي القيم</div><div class="val tnum">${fmt(total)}</div></div>
      <div class="stat"><div class="label">${isName?'أسماء مش لاقيها':'مكن مش لاقيها'}</div><div class="val tnum" style="color:${missing.length?'var(--danger)':'inherit'}">${missing.length}</div></div>
    </div>

function dwUseSheet(name){
  const m=dwState; m.sheet=name;
  m.rows = XLSX.utils.sheet_to_json(m.wb.Sheets[name],{header:1,defval:null,raw:true});
  m.header=1; m.noCol=m.valCol=null;
  const NO_RE=/مكن|ماكين|رقم|terminal|serial/i;
  const VAL_RE=/قيمه|قيمة|مبلغ|اجمالي|إجمالي|مسحوب|سحب|amount|value|total/i;
  let found=false;
  for(let i=0;i<Math.min(m.rows.length,15) && !found;i++){
    const r=m.rows[i]||[];
    const n=r.findIndex(c=>typeof c==='string' && NO_RE.test(norm(c)) && !/اسم/.test(norm(c)));
    if(n>=0){
      m.header=i+1; m.noCol=n; found=true;
      const v=r.findIndex((c,j)=>j!==n && typeof c==='string' && VAL_RE.test(norm(c)));
      m.valCol = v>=0 ? v : null;
    }
  }
  if(!found){ // من غير عناوين: أول عمودين رقميين
    m.header=0;
    const r=m.rows.find(r=>r && r.filter(c=>typeof c==='number').length>=2)||[];
    const idx=r.map((c,j)=>typeof c==='number'?j:-1).filter(j=>j>=0);
    if(idx.length>=2){ m.noCol=idx[0]; m.valCol=idx[1]; }
  }
  if(m.valCol==null){
    const r=m.rows[m.header]||[]; const j=r.findIndex((c,k)=>k!==m.noCol && typeof c==='number'); if(j>=0) m.valCol=j;
  }
  dwRenderOptions();
}

function dwPreview(){
  const m=dwState, box=$('#dwPreview'), btn=$('#dwApply');
  m.plan=null; if(btn) btn.disabled=true; if(!box) return;
  if(m.noCol==null||m.valCol==null){ box.innerHTML='<div class="preview-box warn">اختار عمود رقم المكنة وعمود المبلغ.</div>'; return; }
  const auto = m.only==='auto';
  // فهرس: رقم المكنة -> (عميل + نوعها المسجل)
  const byNo={};
  Object.entries(state.clients).forEach(([id,c])=>{ if(!c) return; machinesOf(c).forEach(x=>{
    const k=mchNo(x.no); if(k) (byNo[k]=byNo[k]||[]).push({id, type:DW_TYPES.includes(x.type)?x.type:'aman'});
  }); });
  const per=new Map(), missing=[], ambiguous=[], seen=new Set(), totals={};
  let blank=0, dupRows=0, total=0, fallback=0;
  m.rows.slice(m.header).forEach(r=>{
    if(!r) return;
    const no=mchNo(r[m.noCol]), val=upRound(upToNum(r[m.valCol]));
    if(!no){ if(val) blank++; return; }
    if(!val) return;
    const all=byNo[no]||[];
    if(!all.length){ missing.push({no,val}); return; }
    let cand=all, fb=false;
    if(!auto){ const pref=all.filter(h=>h.type===m.only); if(pref.length) cand=pref; else fb=true; }
    const uniq=[...new Map(cand.map(h=>[auto? h.id+'|'+h.type : h.id, h])).values()];
    if(uniq.length>1){ ambiguous.push({no,val,names:uniq.map(h=>state.clients[h.id].name+' ('+machineLabel(h.type)+')')}); return; }
    const h=uniq[0], t=auto? h.type : m.only;
    if(fb) fallback++;
    if(seen.has(no)) dupRows++; seen.add(no);
    if(!per.has(h.id)) per.set(h.id,{id:h.id,name:state.clients[h.id].name,items:[],sums:{}});
    const g=per.get(h.id);
    g.items.push({no,val,type:t,reg:h.type,fb});

    totals[t]=upRound((totals[t]||0)+val); total=upRound(total+val);
  });
  const date=m.date, cur=(date===state.day?state.dayData:null);
  m.plan={per, date};
  const list=[...per.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));

  box.innerHTML=`

      <div class="stat"><div class="label">عملاء هيتحدّثوا</div><div class="val tnum">${list.length}</div></div>
      <div class="stat"><div class="label">الإجمالي</div><div class="val tnum">${fmt(total)}</div></div>
      ${auto ? showTypes.map(t=>`<div class="stat"><div class="label">${machineLabel(t)}</div><div class="val tnum">${fmt(totals[t])}</div></div>`).join('') : ''}
      <div class="stat"><div class="label">مكن مش لاقيها</div><div class="val tnum" style="color:${missing.length?'var(--danger)':'inherit'}">${missing.length}</div></div>
    </div>
    ${missing.length?`<div class="preview-box warn">مكن غير مسجلة على أي عميل (هتتخطى — ضيفها في العملاء الأول): ${lst(missing)}</div>`:''}
    ${fallback?`<div class="preview-box warn" style="margin-top:6px">${fallback} مكنة مسجلة عند العميل بنوع تاني غير «${machineLabel(m.only)}» — المبلغ هيتضاف على خانة «${machineLabel(m.only)}» زي ما اخترت (معلّمة بـ ⚠ تحت).</div>`:''}
    ${ambiguous.length?`<div class="preview-box warn" style="margin-top:6px">رقم مكنة على أكتر من عميل (هيتخطى):<br>${ambiguous.map(x=>`<span class="tnum">${escapeHtml(x.no)}</span> ← ${x.names.map(escapeHtml).join(' / ')}`).join('<br>')}</div>`:''}
    ${dupRows?`<div class="preview-box" style="margin-top:6px">${dupRows} صف بنفس رقم المكنة اتكرر — القيم اتجمعت.</div>`:''}
    ${blank?`<div class="preview-box warn" style="margin-top:6px">${blank} صف فيه مبلغ من غير رقم مكنة — اتخطى.</div>`:''}

      <table style="min-width:560px"><thead><tr><th>العميل</th><th>المكن</th>
        ${showTypes.map(t=>`<th>${machineLabel(t)} ${m.mode==='add'?'هتتضاف':'هتبقى'}</th>${cur?`<th>${machineLabel(t)} حاليًا</th>`:''}`).join('')}</tr></thead><tbody>
      ${list.map(g=>`<tr><td class="name-cell">${escapeHtml(g.name)}</td>
        <td style="text-align:start">${g.items.map(x=>`<span class="pill ${x.fb?'warn':'neutral'}" style="margin:1px">${x.fb?'⚠ ':''}<span class="tnum">${escapeHtml(x.no)}</span> · ${fmt(x.val)}${auto?' · '+machineLabel(x.type):''}</span>`).join(' ')}</td>
        ${showTypes.map(t=>`<td class="tnum"><b>${g.sums[t]?fmt(g.sums[t]):'—'}</b></td>${cur?`<td class="tnum">${fmt((cur[g.id]||{})[t]||0)}</td>`:''}`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  btn.disabled = !list.length || !date;

/* ================= رفع التحصيل (بيزوّد على المسجل — المندوب اختياري) ================= */
const UP_FIELDS = [
  {key:'aman', label:'امان', guess:/^امان/},
  {key:'fawry', label:'فوري', guess:/^فوري/},
  {key:'masary', label:'مصاري', guess:/مصاري/},
  {key:'mumkin', label:'ممكن', guess:/ممكن/},
  {key:'basata', label:'بساطة', guess:/بساط/},
  {key:'cash', label:'كاش', guess:/^كاش/},
  {key:'debtYesterday', label:'آجل أمس (قديم)', guess:/^(قديم|الاجل|اجل)/},
  {key:'collection', label:'التحصيل', guess:/تحصيل/},
];
const UP_SKIP_NAMES = ['المجموع','مجموع','الاجمالي','اجمالي','total'];
const UP_LOG_PATH = 'meta/collectionUploads';
const upState = {};

function upLoose(s){ return norm(s).replace(/(.)\1+/g,'$1').replace(/\s+/g,''); }
function upToNum(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  if(v==null) return 0;
  const s = String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،\s]/g,'');
  const n = parseFloat(s); return isFinite(n)?n:0;
}
const upRound = n => Math.round(n*100)/100;
const upRepName = id => (id && state.reps[id]) ? state.reps[id].name : '';

/* مطابقة اسم الشيت باسم العميل في الداتا بيز: حرفي ← مُطبَّع ← مُخفَّف التكرار */
function upBuildIndex(){
  const ex={}, nm={}, lo={};
  const push=(o,k,id)=>{ (o[k]=o[k]||[]).push(id); };
  Object.entries(state.clients).forEach(([id,c])=>{
    if(!c||!c.name) return;
    push(ex,c.name.trim(),id); push(nm,norm(c.name),id); push(lo,upLoose(c.name),id);
  });
  return {ex,nm,lo};
}
function upMatch(name, idx){
  const tries = [idx.ex[name.trim()], idx.nm[norm(name)], idx.lo[upLoose(name)]];
  for(const arr of tries){
    if(!arr) continue;
    return arr.length===1 ? {id:arr[0]} : {dup:true};
  }
  return {};
}

function upDetect(sheetName, forcedHeader){
  const u = upState;
  const ws = u.wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  let headerRow = forcedHeader || 1, nameCol = null, found = false;
  if(!forcedHeader){
    for(let i=0;i<Math.min(rows.length,15);i++){
      const nc = (rows[i]||[]).findIndex(c=>typeof c==='string' && /اسم|عميل/.test(norm(c)));
      if(nc>=0){ headerRow=i+1; nameCol=nc; found=true; break; }
    }
  } else {
    const nc = (rows[headerRow-1]||[]).findIndex(c=>typeof c==='string' && /اسم|عميل/.test(norm(c)));
    if(nc>=0){ nameCol=nc; found=true; }
  }
  const header = rows[headerRow-1]||[];
  const map = {}; let score = 0;
  UP_FIELDS.forEach(f=>{
    const ci = header.findIndex(c=>typeof c==='string' && f.guess.test(norm(c)));
    map[f.key] = ci>=0 ? ci : null; if(ci>=0) score++;
  });
  return {rows, headerRow, nameCol, map, score, found};
}
function upUseSheet(sheetName, forcedHeader){
  const u = upState, d = upDetect(sheetName, forcedHeader);
  u.sheetName = sheetName; u.rows = d.rows; u.headerRow = d.headerRow; u.nameCol = d.nameCol; u.map = d.map;
  u.skip = new Set();
}

      <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;line-height:1.6">
        <input type="checkbox" id="upReplace" style="margin-top:4px">
        <span>تصفير حسابات المندوب ثم رفع الشيت (استبدال بدل الزيادة) — الخانات المربوطة في الشيت بتتصفّر لكل عملاء المندوب المختار في اليوم ده، وبعدها بتتملي من الشيت. <span id="upReplHint" style="font-weight:400"></span></span>
      </label>
      <div id="upConfig"></div>
      <div id="upPreview"></div>
      <div id="upHistory"></div>
    </div>
    <div class="ft"><button class="btn" id="mCancel">إغلاق</button><button class="btn primary" id="upApply" disabled>زوّد على المسجل</button></div>
  `, root=>{
    $('.modal', root).style.maxWidth = '960px';
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#upApply').onclick = upApply;
    $$('[data-uprep]').forEach(cb=>cb.onchange = ()=>{
      const u = upState;
      u.repIds = $$('[data-uprep]').filter(x=>x.checked).map(x=>x.dataset.uprep);
      u.repId = u.repIds.length===1 ? u.repIds[0] : '';
      if(!u.repIds.includes(u.newRep)) u.newRep = u.repIds[0]||'';
      u.skip.clear(); u.force.clear();
      upSyncReplaceUI();
      if(u.wb) upRenderPreview();
    });
    $('#upReplace').onchange = e=>{ upState.replace = e.target.checked; upSyncReplaceUI(); if(upState.wb) upRenderPreview(); };
    upSyncReplaceUI();
    $('#upFile').onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const rd = new FileReader();
      const fail = msg=>{
        upState.wb = null;
        $('#upConfig').innerHTML = `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">${escapeHtml(msg)}</div>`;
        $('#upPreview').innerHTML = ''; toast(msg);
      };
      if(typeof XLSX==='undefined') return fail('مكتبة الإكسيل متحمّلتش (النت أو حاجب cdnjs) — اعمل Refresh وجرّب تاني');
      rd.onerror = ()=>fail('المتصفح معرفش يقرا الملف — جرّب تختاره تاني');
      rd.onload = ev=>{
        try{
          try{ upState.wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array'}); }
          catch(err){ return fail('الملف مش مفهوم: '+err.message); }
          upState.fileName = f.name;
          const names = upState.wb.SheetNames;
          const pick = names.find(n=>{ const d=upDetect(n); return d.found && d.score>0; }) || names[0];
          upUseSheet(pick);
          upRenderConfig();
          upRenderPreview();      // فوري — من غير ما نستنى السيرفر
          upEnsureDay();
        }catch(err){ fail('خطأ أثناء قراءة الشيت: '+err.message); }
      };
      rd.readAsArrayBuffer(f);
    };
    upLoadHistory().then(upRenderHistory);
  });
}

function upColOptions(selected){
  const header = upState.rows[upState.headerRow-1] || [];
  let o = `<option value="">— تجاهل —</option>`;
  header.forEach((h,i)=>{
    o += `<option value="${i}" ${selected===i?'selected':''}>${escapeHtml(h==null ? 'عمود '+colToLetter(i) : String(h))}</option>`;
  });
  return o;
}

function upRenderConfig(){
  const u = upState, sheets = u.wb.SheetNames;
  $('#upConfig').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${sheets.length>1 ? `<div class="field"><label>الورقة (Sheet)</label><select id="upSheet">${sheets.map(n=>`<option ${n===u.sheetName?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>رقم صف العناوين</label><input id="upHdr" type="number" min="1" value="${u.headerRow}"></div>
      <div class="field"><label>تاريخ اليومية اللي هتتزوّد</label><input id="upDate" type="date" value="${u.date}"></div>
    </div>
    <div style="font-size:12.5px; color:var(--fg-dim); margin:12px 0 6px; font-weight:700">ربط الأعمدة (اتظبط تلقائي — راجعه قبل ما ترفع)</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="field"><label>الاسم *</label><select data-upmap="__name">${upColOptions(u.nameCol)}</select></div>
      ${UP_FIELDS.map(f=>`<div class="field"><label>${f.label}</label><select data-upmap="${f.key}">${upColOptions(u.map[f.key])}</select></div>`).join('')}
    </div>`;
  const sh = $('#upSheet');
  if(sh) sh.onchange = e=>{ upUseSheet(e.target.value); upRenderConfig(); upRenderPreview(); };
  $('#upHdr').onchange = e=>{
    const h = Math.max(1, parseInt(e.target.value,10)||1);
    upUseSheet(u.sheetName, h); upRenderConfig(); upRenderPreview();
  };
  $('#upDate').onchange = e=>{
    if(!e.target.value) return;
    u.date = e.target.value; u.fresh = null; u.freshDate = null;
    upRenderPreview(); upEnsureDay();
  };
  $$('[data-upmap]').forEach(s=>s.onchange = e=>{
    const v = e.target.value===''?null:Number(e.target.value);
    if(e.target.dataset.upmap==='__name') u.nameCol = v; else u.map[e.target.dataset.upmap] = v;
    upRenderPreview();
  });
}

/* القيم الحالية لليوم المحدد: لو هو اليوم المفتوح بنستخدم الداتا الحية، غير كده نجيبها مرة واحدة */
function upDayNow(){
  const u = upState;
  if(u.date===state.day) return state.dayData || {};
  return u.freshDate===u.date ? u.fresh : null;
}
function upEnsureDay(){
  const u = upState;
  if(u.date===state.day || u.freshDate===u.date) return Promise.resolve();
  const d = u.date;
  return state.db.ref('days/'+d).once('value').then(s=>{
    if(u.date===d){ u.fresh = s.val()||{}; u.freshDate = d; upRenderPreview(); }
  }).catch(()=>{});
}

function upCompute(reuseIdx){
  const u = upState;
  const idx = (reuseIdx && u.idx) ? u.idx : (u.idx = upBuildIndex());
  const acc = new Map();
  if(u.nameCol!=null){
    u.rows.slice(u.headerRow).forEach(r=>{
      const raw = r[u.nameCol]; if(raw==null) return;
      const name = String(raw).trim();
      if(!name || name==='0' || UP_SKIP_NAMES.includes(norm(name))) return;
      const m = upMatch(name, idx);
      const key = m.id || ('n:'+norm(name));
      let it = acc.get(key);
      if(!it){ it = {key, id:m.id||null, dup:!!m.dup, name, rows:0, deltas:{}}; acc.set(key,it); }
      it.rows++;
      UP_FIELDS.forEach(f=>{
        const ci = u.map[f.key]; if(ci==null) return;
        const n = upToNum(r[ci]); if(n) it.deltas[f.key] = upRound((it.deltas[f.key]||0)+n);
      });
    });
  }
  u.items = [...acc.values()].map(it=>{
    it.empty = !Object.values(it.deltas).some(v=>v);
    it.canApply = !it.empty && !it.dup && (!!it.id || u.createNew);
    it.inScope = !u.repIds.length || !it.id || u.repIds.includes((state.clients[it.id]||{}).rep||'');
    it.include = it.canApply && (it.inScope ? !u.skip.has(it.key) : u.force.has(it.key));
    return it;
  });
}

function upRenderPreview(){
  const u = upState, box = $('#upPreview'); if(!box) return;
  if(!u.wb){ box.innerHTML=''; return; }
  upCompute();
  if(u.nameCol==null){ box.innerHTML = `<div class="preview-box warn">مش لاقي عمود الاسم — اختاره من «ربط الأعمدة» فوق.</div>`; $('#upApply').disabled = true; return; }
  const cols = UP_FIELDS.filter(f=>u.map[f.key]!=null);
  if(!cols.length){ box.innerHTML = `<div class="preview-box warn">اربط عمود مبلغ واحد على الأقل (أمان / فوري / قديم / تحصيل ...).</div>`; $('#upApply').disabled = true; return; }

  const dayNow = upDayNow();
  const statusOf = it=>{
    if(it.dup) return `<span class="pill warn">اسم مكرر في الداتا بيز</span>`;
    if(it.empty) return `<span class="pill neutral">أرقامه صفر</span>`;
    if(it.id){
      let s = `<span class="pill good">مطابق</span>`;
      const c = state.clients[it.id];
      if(!it.inScope) s += ` <span class="pill warn" title="العميل مش من المناديب المختارين — مش هيتزوّد إلا لو علّمت عليه">برا المختارين</span>`;
      return s;
    }
    return u.createNew ? `<span class="pill neutral">عميل جديد</span>` : `<span class="pill danger">مش موجود</span>`;
  };
  const rowsHtml = u.items.map(it=>{
    const cur = it.id && dayNow ? (dayNow[it.id]||{}) : null;
    const c = it.id ? state.clients[it.id] : null;
    const dbName = c ? c.name : '';
    const rn = c ? upRepName(c.rep) : upRepName(upNewRepId());
    return `<tr style="${it.include?'':'opacity:.55'}">
      <td><input type="checkbox" data-upk="${escapeHtml(it.key)}" ${it.include?'checked':''} ${it.canApply?'':'disabled'}></td>
      <td class="name-cell">${escapeHtml(it.name)}${dbName && dbName!==it.name ? `<div style="font-size:11.5px;color:var(--fg-dim);font-weight:400">في الداتا بيز: ${escapeHtml(dbName)}</div>`:''}${it.rows>1?`<div style="font-size:11.5px;color:var(--fg-dim);font-weight:400">${it.rows} صفوف اتجمعوا</div>`:''}</td>
      <td style="font-size:12.5px">${rn?escapeHtml(rn):'<span style="color:var(--fg-dim)">—</span>'}</td>
      ${cols.map(f=>{
        const d = it.deltas[f.key];
        if(u.replace) return `<td class="tnum"><div style="font-weight:700">${fmt(d||0)}</div>${cur?`<div style="font-size:11px;color:var(--fg-dim)">كان ${fmt(cur[f.key]||0)}</div>`:''}</td>`;
        return `<td class="tnum">${d ? `<div style="color:${d>0?'var(--good)':'var(--danger)'};font-weight:700">${d>0?'+':''}${fmt(d)}</div>${cur?`<div style="font-size:11px;color:var(--fg-dim)">كان ${fmt(cur[f.key]||0)}</div>`:''}` : '<span style="color:var(--fg-dim)">—</span>'}</td>`;
      }).join('')}
      <td>${statusOf(it)}</td>
    </tr>`;
  }).join('');

  box.innerHTML = `
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:14px 0 8px">
      <input type="checkbox" id="upCreateNew" ${u.createNew?'checked':''}> العملاء اللي مش موجودين في الداتا بيز يتضافوا كعملاء جدد ${upNewRepHtml()}
    </label>
    <div id="upSum" class="preview-box"></div>
    <div class="tablewrap" style="margin-top:12px; max-height:340px; overflow:auto">
      <table style="min-width:660px">
        <thead><tr><th></th><th>الاسم في الشيت</th><th>المندوب</th>${cols.map(f=>`<th>${f.label}</th>`).join('')}<th>الحالة</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  $('#upCreateNew').onchange = e=>{ u.createNew = e.target.checked; upRenderPreview(); };
  const _nr = $('#upNewRep'); if(_nr) _nr.onchange = e=>{ u.newRep = e.target.value; upRenderPreview(); };
  $$('[data-upk]').forEach(cb=>cb.onchange = e=>{
    const k = e.target.dataset.upk;
    const it0 = u.items.find(x=>x.key===k);
    if(it0 && !it0.inScope){ if(e.target.checked) u.force.add(k); else u.force.delete(k); }
    else { if(e.target.checked) u.skip.delete(k); else u.skip.add(k); }
    upCompute(true); upRenderSummary();
    e.target.closest('tr').style.opacity = e.target.checked ? '' : '.55';
  });
  upRenderSummary();
}

function upRenderSummary(){
  const u = upState, inc = u.items.filter(it=>it.include);
  const totals = {};
  inc.forEach(it=>Object.entries(it.deltas).forEach(([k,d])=>{ totals[k]=upRound((totals[k]||0)+d); }));
  const missing = u.items.filter(it=>!it.id && !it.dup && !it.empty && !u.createNew).length;
  const dups = u.items.filter(it=>it.dup).length;
  const sumTxt = UP_FIELDS.filter(f=>totals[f.key]).map(f=>`${f.label}: <b>${fmt(totals[f.key])}</b>`).join(' · ');
  const box = $('#upSum'); if(!box) return;
  const outc = u.items.filter(it=>it.canApply && !it.inScope && !it.include).length;
  const byRep = {};
  inc.forEach(it=>{
    const rid = it.id ? ((state.clients[it.id]||{}).rep||'') : (upNewRepId()||'');
    const b = byRep[rid] = byRep[rid] || {n:0, t:{}}; b.n++;
    Object.entries(it.deltas).forEach(([k,d])=>{ b.t[k] = upRound((b.t[k]||0)+d); });
  });
  const rk = Object.keys(byRep);
  const perRep = rk.length>1 ? '<div style="margin-top:8px">' + rk.map(rid=>`<div>• <b>${escapeHtml(upRepName(rid)||'بدون مندوب')}</b>: ${byRep[rid].n} عميل — ${UP_FIELDS.filter(f=>byRep[rid].t[f.key]).map(f=>`${f.label}: ${fmt(byRep[rid].t[f.key])}`).join(' · ')}</div>`).join('') + '</div>' : '';
  let replTxt = '';
  if(u.replace && u.repIds.length){
    const dn = upDayNow(), plan = upReplacePlan(dn||{});
    const flds = UP_FIELDS.filter(f=>u.map[f.key]!=null).map(f=>f.label).join('، ');
    replTxt = `<br>التصفير: الخانات (${flds}) لعملاء «${escapeHtml(u.repIds.map(upRepName).join(' + '))}»`
      + (dn ? ` — <b>${plan.wipedClients}</b> عميل مش في الشيت هيتصفّروا${plan.wipedClients ? ' ('+UP_FIELDS.filter(f=>plan.wiped[f.key]).map(f=>`${f.label}: ${fmt(plan.wiped[f.key])}`).join(' · ')+')' : ''}.` : ' هتتصفّر قبل الرفع.');
  }
  box.classList.toggle('warn', !!(missing||dups||outc||u.replace));
  box.innerHTML = `${u.replace?'هيتصفّر ويتملي':'هيتزوّد'} <b>${inc.length}</b> عميل على يوم <b>${u.date}</b>${sumTxt?`<br>${sumTxt}`:''}${replTxt}${perRep}`
    + (outc ? `<br>تنبيه: ${outc} عميل في الشيت مش من المناديب المختارين وهيتخطّوا (علّم عليهم في الجدول لو عايزهم).` : '')
    + (missing ? `<br>تنبيه: ${missing} اسم مش موجود في الداتا بيز وهيتخطّوا (فعّل الخيار اللي فوق لو عايز تضيفهم).` : '')
    + (dups ? `<br>تنبيه: ${dups} اسم مكرر في الداتا بيز ومش هيتزوّد — عدّل الأسماء الأول.` : '');
  const btn = $('#upApply');
  btn.disabled = u.busy || inc.length===0;
  const verb = u.replace ? 'صفّر وارفع' : 'زوّد على المسجل';
  btn.textContent = inc.length ? `${verb} (${inc.length} عميل)` : verb;
}

/* ---- وضع الاستبدال: تصفير خانات المندوب ثم الملء من الشيت ---- */
function upSyncReplaceUI(){
  const u = upState, cb = $('#upReplace'); if(!cb) return;
  if(!u.repIds.length) u.replace = false;
  cb.checked = u.replace; cb.disabled = !u.repIds.length;
  const h = $('#upReplHint'); if(h) h.textContent = u.repIds.length ? '' : '(اختار مندوب الأول)';
  const btn = $('#upApply'); if(btn && btn.disabled) btn.textContent = u.replace ? 'صفّر وارفع' : 'زوّد على المسجل';
}
function upReplaceScope(){
  const f = upState.repIds.join(',');
  return f ? Object.entries(state.clients).filter(([id,c])=>c && matchesRep(c,f)).map(([id])=>id) : [];
}
function upReplacePlan(day){
  const u = upState, fields = UP_FIELDS.filter(f=>u.map[f.key]!=null).map(f=>f.key);
  const itemById = {}; u.items.forEach(it=>{ if(it.id) itemById[it.id] = it; });
  const ids = new Set(upReplaceScope()); u.items.forEach(it=>{ if(it.include && it.id) ids.add(it.id); });
  const changes = {}, wiped = {}; let wipedClients = 0;
  ids.forEach(id=>{
    const it = itemById[id]; if(it && !it.include && !it.empty) return;   // اتشال علامته: متتلمسش
    const row = (day||{})[id] || {}; let any = false;
    fields.forEach(k=>{
      const to = it ? upRound(it.deltas[k]||0) : 0, prev = upRound(Number(row[k])||0);
      if(to===prev) return;
      (changes[id] = changes[id] || {})[k] = {prev, to};
      if(!it){ wiped[k] = upRound((wiped[k]||0)+prev); any = true; }
    });
    if(any) wipedClients++;
  });
  return {changes, wiped, wipedClients, fields};
}

const upNewRepId = () => upState.repIds.length>1 ? upState.newRep : upState.repId;
function upNewRepHtml(){
  const u = upState;
  if(u.repIds.length>1) return `للمندوب <select id="upNewRep" class="sel-sm">${u.repIds.map(id=>`<option value="${id}" ${u.newRep===id?'selected':''}>${escapeHtml(upRepName(id))}</option>`).join('')}</select>`;
  return u.repId ? `للمندوب «${escapeHtml(upRepName(u.repId))}»` : '(بدون مندوب)';
}
function upSig(inc){
  const u = upState;
  const s = u.date+'|'+inc.map(it=>(it.id||it.name)+':'+Object.entries(it.deltas).filter(([k,d])=>d).sort().map(([k,d])=>k+d).join(',')).sort().join(';');
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
  return String(h);
}

/* الحفظ: قراءة واحدة لليوم (فورية لو اليوم مفتوح) + كتابة واحدة بتشمل السجل — يعني رحلة سيرفر واحدة تقريبًا */
async function upApply(){
  const u = upState; if(u.busy) return;
  upCompute();
  const inc = u.items.filter(it=>it.include);
  if(!inc.length) return toast('مفيش حاجة تترفع');
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  const sig = upSig(inc);
  const same = u.replace ? null : (u.hist||[]).find(h=>!h.undone && h.sig===sig);
  if(same && !confirm(`الشيت ده بنفس الأرقام اترفع قبل كده على يوم ${same.date}. لو كملت الأرقام هتتضاعف. تكمل؟`)) return;
  if(u.replace){
    if(!u.repIds.length) return toast('اختار المندوب الأول عشان التصفير');
    const fl = UP_FIELDS.filter(f=>u.map[f.key]!=null).map(f=>f.label).join('، ');
    if(!confirm(`هتصفّر (${fl}) لكل عملاء «${u.repIds.map(upRepName).join(' + ')}» على يوم ${u.date}، وبعدها تتملي من الشيت. تكمل؟\n(فيه تراجع بعد كده)`)) return;
  }

  u.busy = true;
  const btn = $('#upApply'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try{
    // اقرا اليوم طازة قبل الجمع عشان نزوّد على آخر قيمة مسجلة
    const fresh = (await state.db.ref('days/'+u.date).once('value')).val() || {};
    const updates = {}, logItems = {}, totals = {}, created = [], repSet = new Set();
    let order = maxOrder();
    if(u.replace){
      const plan = upReplacePlan(fresh);
      Object.entries(plan.changes).forEach(([id,ks])=>{
        const li = {};
        Object.entries(ks).forEach(([k,ch])=>{ updates[`days/${u.date}/${id}/${k}`] = ch.to; li[k] = ch; });
        logItems[id] = li;
      });
      inc.forEach(it=>{
        Object.entries(it.deltas).forEach(([k,d])=>{ if(d) totals[k] = upRound((totals[k]||0)+d); });
        if(it.id) return;
        const id = uid(); order++;
        updates['clients/'+id] = {name:it.name, rep:upNewRepId()||null, active:true, order};
        created.push(id);
        const li = {};
        Object.entries(it.deltas).forEach(([k,d])=>{ if(!d) return; updates[`days/${u.date}/${id}/${k}`] = d; li[k] = {prev:0, to:d}; });
        if(Object.keys(li).length) logItems[id] = li;
      });
      u.repIds.forEach(r=>repSet.add(r));
    } else inc.forEach(it=>{
      repSet.add(it.id ? ((state.clients[it.id]||{}).rep||'') : (upNewRepId()||''));
      let id = it.id;
      if(!id){
        id = uid(); order++;
        updates['clients/'+id] = {name:it.name, rep:upNewRepId()||null, active:true, order};
        created.push(id);
      }
      const li = {};
      Object.entries(it.deltas).forEach(([k,d])=>{
        if(!d) return;
        const cur = Number((fresh[id]||{})[k])||0;
        updates[`days/${u.date}/${id}/${k}`] = upRound(cur+d);
        li[k] = d; totals[k] = upRound((totals[k]||0)+d);
      });
      if(Object.keys(li).length) logItems[id] = li;
    });
    const logId = uid();
    const rids = [...repSet].filter(Boolean);
    const log = {rep:(rids.length===1 && repSet.size===1)?rids[0]:'', repName:rids.length ? rids.map(upRepName).join(' + ') : (repSet.size?'بدون مندوب':'تلقائي'), date:u.date, fileName:u.fileName,
      createdAt:Date.now(), sig, count:Object.keys(logItems).length, totals, items:logItems, created, mode:u.replace?'replace':'add'};
    updates[UP_LOG_PATH+'/'+logId] = log;

    const ack = await Promise.race([
      state.db.ref().update(updates).then(()=>'ok'),
      new Promise(res=>setTimeout(()=>res('timeout'), 10000)),
    ]);
    if(ack==='timeout'){
      $('#upPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">السيرفر مردّش خلال 10 ثواني — الأرجح النت واقف أو الاتصال بالداتا بيز مقطوع، فالتحصيل ممكن ميكونش اتحفظ. افحص النقطة الخضرا على الجنب وجرّب تاني.</div>`);
      toast('مفيش تأكيد من السيرفر — التحصيل ممكن ميكونش اتحفظ');
      u.busy = false; upRenderSummary(); return;
    }
    if(state.day!==u.date){ state.day = u.date; bindDay(u.date); }
    u.hist = [{id:logId, ...log}, ...(u.hist||[])].slice(0,15);
    const sumTxt = UP_FIELDS.filter(f=>totals[f.key]).map(f=>`${f.label}: ${fmt(totals[f.key])}`).join(' · ');
    $('#upPreview').innerHTML = `<div class="pill good" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">${u.replace?'تم تصفير واستبدال':'تم تزويد'} ${log.count} عميل على يوم ${u.date} ${sumTxt?'— '+sumTxt:''} — اتحفظ على السيرفر ✓</div>`;
    $('#upConfig').innerHTML = ''; $('#upFile').value = ''; u.wb = null; u.items = [];
    btn.textContent = u.replace ? 'صفّر وارفع' : 'زوّد على المسجل'; btn.disabled = true;
    upRenderHistory();
    toast('تم رفع التحصيل');
  }catch(err){
    const denied = /permission|PERMISSION/.test((err.code||'')+' '+err.message);
    toast('فشل الحفظ: '+err.message);
    $('#upPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">فشل الحفظ: ${escapeHtml(err.message)}${denied?' — صلاحيات Firebase رافضة الكتابة (راجع Rules للمسار days/ و meta/)':''}</div>`);
    upRenderSummary();
  }
  u.busy = false;
}

function upLoadHistory(){
  return state.db.ref(UP_LOG_PATH).orderByKey().limitToLast(15).once('value').then(s=>{
    const v = s.val() || {};
    upState.hist = Object.entries(v).map(([id,h])=>({id, ...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return upState.hist;
  }).catch(()=>{ upState.hist = []; return []; });
}

function upRenderHistory(){
  const box = $('#upHistory'); if(!box) return;
  const hist = (upState.hist||[]).slice(0,6);
  if(!hist.length){ box.innerHTML=''; return; }
  box.innerHTML = `
    <div style="font-size:12.5px; color:var(--fg-dim); margin:16px 0 6px; font-weight:700">آخر الرفعات</div>
    <div class="tablewrap"><table style="min-width:560px">

        <td style="font-size:12.5px">${escapeHtml(h.fileName||'')}</td>

        <td>${h.undone ? '<span class="pill neutral">اتلغت</span>' : `<button class="btn sm danger" data-upundo="${h.id}">تراجع</button>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  $$('[data-upundo]').forEach(b=>b.onclick = ()=>upUndo(b.dataset.upundo));

async function upUndo(logId){
  try{
    const log = (await state.db.ref(UP_LOG_PATH+'/'+logId).once('value')).val();
    if(!log || log.undone) return;
    const isRepl = log.mode==='replace';
    if(!confirm(isRepl
      ? `تتراجع عن رفعة الاستبدال «${log.fileName||''}» (${log.count||0} عميل) على يوم ${log.date}؟ الأرقام القديمة قبل التصفير هترجع (الخانات اللي اتعدّلت بعدها مش هتتلمس).`
      : `تتراجع عن رفعة «${log.fileName||''}» (${log.count||0} عميل) على يوم ${log.date}؟ الأرقام هتتخصم من المسجل.`)) return;
    const day = (await state.db.ref('days/'+log.date).once('value')).val() || {};
    const updates = {}; let restored = 0, skipped = 0;
    Object.entries(log.items||{}).forEach(([cid,flds])=>Object.entries(flds).forEach(([k,d])=>{
      const cur = Number((day[cid]||{})[k])||0;
      if(isRepl){
        if(upRound(cur)===upRound(d.to)){ updates[`days/${log.date}/${cid}/${k}`] = d.prev; restored++; } else skipped++;
      } else updates[`days/${log.date}/${cid}/${k}`] = upRound(cur-d);
    }));
    updates[UP_LOG_PATH+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = (upState.hist||[]).find(x=>x.id===logId); if(h) h.undone = true;
    upRenderHistory();
    toast(isRepl ? `تم التراجع — رجعت ${restored} خانة${skipped?` وتخطّيت ${skipped} (اتعدّلت بعد الرفع)`:''}` : 'تم التراجع');
  }catch(err){ toast('خطأ: '+err.message); }
}

async function expGather(){
  const e = expState, date = e.date;
  const day = (await state.db.ref('days/'+date).once('value')).val() || {};
  const nums = clientNumbers(), byRep = {};
  sortedClients().forEach(([id,c])=>{
    const r = day[id] || {};
    const v = {fawry:Number(r.fawry)||0, aman:Number(r.aman)||0, masary:Number(r.masary)||0, mumkin:Number(r.mumkin)||0, basata:Number(r.basata)||0,
      cash:Number(r.cash)||0, collection:Number(r.collection)||0, debtYesterday:Number(r.debtYesterday)||0};
    v.drawn = upRound(v.fawry+v.aman+v.masary+v.mumkin+v.basata+v.cash);
    v.newDebt = upRound(v.debtYesterday+v.drawn-v.collection);
    const hasData = !!(v.drawn || v.collection || v.debtYesterday);
    if(!hasData && (e.hideEmpty || c.active===false)) return;
    const k = (c.rep && state.reps[c.rep]) ? c.rep : '__none__';
    (byRep[k] = byRep[k] || []).push({num:nums[id], name:c.name, ...v});
  });
  const order = e.repId
    ? e.repId.split(',')
    : [...Object.entries(state.reps).filter(([id,r])=>r).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar')).map(([id])=>id), '__none__'];
  const groups = order.filter(k=>byRep[k] && byRep[k].length).map(k=>{
    const rows = byRep[k], tot = {};
    EXP_COLS.forEach(([f])=>{ tot[f] = upRound(rows.reduce((s,r)=>s+r[f],0)); });
    return {id:k, name:k==='__none__' ? 'بدون مندوب' : state.reps[k].name, rows, tot};
  });
  const grand = {};
  EXP_COLS.forEach(([f])=>{ grand[f] = upRound(groups.reduce((s,g)=>s+g.tot[f],0)); });
  return {date, groups, grand, single: e.repId ? repSelLabel(e.repId) : ''};
}

function expFileBase(data){
  return ('تحصيل-' + (data.single || 'كل-المناديب') + '-' + data.date).replace(/[\\\/:*?"<>|\s]+/g,'-');
}

function expBuildXlsx(data){
  const wb = XLSX.utils.book_new();
  wb.Workbook = {Views:[{RTL:true}]};
  const used = new Set();
  const sheetName = n=>{
    const b = String(n).replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,27) || 'مندوب';
    let s = b, i = 2; while(used.has(s)) s = b.slice(0,24)+' '+(i++);
    used.add(s); return s;
  };
  const hdr = ['#','العميل',...EXP_COLS.map(c=>c[1])];
  const widths = [{wch:6},{wch:32},...EXP_COLS.map(()=>({wch:14}))];
  if(data.groups.length>1){
    const aoa = [[`ملخص التحصيل — يوم ${data.date}`],[],['المندوب','عدد العملاء','إجمالي المسحوبات','التحصيل','المديونية الجديدة']];
    data.groups.forEach(g=>aoa.push([g.name, g.rows.length, g.tot.drawn, g.tot.collection, g.tot.newDebt]));
    aoa.push(['الإجمالي', data.groups.reduce((s,g)=>s+g.rows.length,0), data.grand.drawn, data.grand.collection, data.grand.newDebt]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:28},{wch:12},{wch:18},{wch:14},{wch:18}];
    XLSX.utils.book_append_sheet(wb, ws, sheetName('الملخص'));
  }
  data.groups.forEach(g=>{
    const aoa = [[`المندوب: ${g.name} — يوم ${data.date}`],[],hdr];
    g.rows.forEach(r=>aoa.push([r.num, r.name, ...EXP_COLS.map(([f])=>r[f])]));
    aoa.push(['','الإجمالي',...EXP_COLS.map(([f])=>g.tot[f])]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = widths;
    XLSX.utils.book_append_sheet(wb, ws, sheetName(g.name));
  });
  return wb;
}

function expBuildHtml(data){
  const n = v => v ? fmt(v) : '<span class="z">—</span>';

    <table>
      <thead><tr><th class="num">#</th><th class="nm">العميل</th>${EXP_COLS.map(c=>`<th class="${c[0]==='collection'?'hl':''}">${c[1]}</th>`).join('')}</tr></thead>
      <tbody>${g.rows.map(r=>`<tr><td class="num">${r.num}</td><td class="nm">${escapeHtml(r.name)}</td>${EXP_COLS.map(([f])=>`<td class="${f==='collection'?'hl':''}">${f==='newDebt'?fmt(r[f]):n(r[f])}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td class="nm">الإجمالي</td>${EXP_COLS.map(([f])=>`<td class="${f==='collection'?'hl':''}">${fmt(g.tot[f])}</td>`).join('')}</tr></tfoot>
    </table>`;
  const summary = data.groups.length>1 ? `
    <section>
      <h1>ملخص التحصيل</h1><div class="meta">يوم ${escapeHtml(data.date)}</div>
      <table class="sum"><thead><tr><th class="nm">المندوب</th><th>عدد العملاء</th><th>إجمالي المسحوبات</th><th class="hl">التحصيل</th><th>المديونية الجديدة</th></tr></thead>
      <tbody>${data.groups.map(g=>`<tr><td class="nm">${escapeHtml(g.name)}</td><td>${g.rows.length}</td><td>${fmt(g.tot.drawn)}</td><td class="hl">${fmt(g.tot.collection)}</td><td>${fmt(g.tot.newDebt)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="nm">الإجمالي</td><td>${data.groups.reduce((s,g)=>s+g.rows.length,0)}</td><td>${fmt(data.grand.drawn)}</td><td class="hl">${fmt(data.grand.collection)}</td><td>${fmt(data.grand.newDebt)}</td></tr></tfoot></table>
    </section>` : '';
  const sections = data.groups.map(g=>`
    <section>
      <h1>${escapeHtml(g.name)}</h1><div class="meta">تحصيل يوم ${escapeHtml(data.date)} — ${g.rows.length} عميل</div>
      ${table(g)}
    </section>`).join('');
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${escapeHtml(expFileBase(data))}</title>
<style>
@page{size:A4 landscape; margin:10mm}
*{box-sizing:border-box}
body{margin:0; font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif; direction:rtl; color:#111; font-size:11.5px}
section{page-break-after:always}
section:last-child{page-break-after:auto}
h1{font-size:19px; margin:0 0 2px}
.meta{color:#555; margin-bottom:10px; font-size:12px}
table{width:100%; border-collapse:collapse}
th,td{border:1px solid #bbb; padding:4px 6px; text-align:center; font-variant-numeric:tabular-nums}
th{background:#eceff1; font-weight:700}
thead{display:table-header-group}
tr{page-break-inside:avoid}
.nm{text-align:right}
.num{width:34px}
.hl{background:#eef6f1; font-weight:700}
th.hl{background:#d9ecdf}
tfoot td{background:#f3f3f3; font-weight:700}
.z{color:#bbb}
.sum{max-width:760px}
</style></head><body>${summary}${sections}</body></html>`;
}

async function expDoXlsx(){
  const e = expState; if(e.busy) return;
  if(!e.date) return toast('اختار التاريخ');
  e.busy = true;
  try{
    const data = await expGather();
    if(!data.groups.length) return toast('مفيش بيانات في اليوم ده للمندوب المختار');
    XLSX.writeFile(expBuildXlsx(data), expFileBase(data)+'.xlsx');
    toast('تم تنزيل ملف Excel');
  }catch(err){ toast('خطأ: '+err.message); }
  e.busy = false;
}

async function expDoPdf(){
  const e = expState; if(e.busy) return;
  if(!e.date) return toast('اختار التاريخ');
  e.busy = true;
  // نفتح النافذة فورًا (جوه ضغطة الزرار) عشان المتصفح ميمنعهاش، وبعدين نملاها
  const win = window.open('', '_blank');
  try{
    const data = await expGather();
    if(!data.groups.length){ if(win) win.close(); return toast('مفيش بيانات في اليوم ده للمندوب المختار'); }
    const html = expBuildHtml(data);
    if(win){
      win.document.open(); win.document.write(html); win.document.close();
      setTimeout(()=>{ try{ win.focus(); win.print(); }catch(_){} }, 500);
    } else {
      const fr = document.createElement('iframe');
      fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
      document.body.appendChild(fr);
      fr.contentDocument.open(); fr.contentDocument.write(html); fr.contentDocument.close();
      setTimeout(()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(_){} }, 500);
      setTimeout(()=>fr.remove(), 120000);
    }
  }catch(err){ if(win) win.close(); toast('خطأ: '+err.message); }
  e.busy = false;
}

/* اللي هيتصفّر فعلًا: العملاء في النطاق اللي رقمهم في الخانات المختارة مش صفر */
function zCompute(){
  const items = {}, perField = {}; let clients = 0;
  Object.entries(zState.day||{}).forEach(([id,r])=>{
    const c = state.clients[id]; if(!c || !r || typeof r!=='object') return;
    if(!matchesRep(c, zState.repId)) return;
    const li = {};
    zState.fields.forEach(k=>{
      const v = Number(r[k])||0;
      if(v){ li[k] = v; perField[k] = Math.round(((perField[k]||0)+v)*100)/100; }
    });
    if(Object.keys(li).length){ items[id] = li; clients++; }
  });
  return {items, perField, clients};
}

function zRenderPreview(){
  const box = $('#zPreview'), btn = $('#zApply'); if(!box) return;
  if(!zState.fields.size){ box.classList.remove('warn'); box.textContent = 'اختار خانة واحدة على الأقل.'; btn.disabled = true; return; }
  const r = zCompute();
  if(!r.clients){ box.classList.remove('warn'); box.textContent = 'مفيش أرقام في الخانات دي للنطاق ده — مفيش حاجة تتصفّر.'; btn.disabled = true; return; }
  box.classList.add('warn');
  box.innerHTML = `هيتصفّر <b>${r.clients}</b> عميل على يوم <b>${zState.date}</b>:<br>` +
    ZERO_FIELDS.filter(([k])=>r.perField[k]).map(([k,l])=>`${l}: <b>${fmt(r.perField[k])}</b>`).join(' · ');
  btn.disabled = zState.busy; btn.textContent = `صفّر (${r.clients} عميل)`;
}

async function zApply(){
  if(zState.busy) return;
  // اقرا اليوم طازة قبل التصفير عشان نخزّن القيم الحقيقية للتراجع
  zState.busy = true; $('#zApply').disabled = true;
  try{
    const day = (await state.db.ref('days/'+zState.date).once('value')).val() || {};
    zState.day = day;
    const r = zCompute();
    if(!r.clients){ zState.busy = false; return zRenderPreview(); }
    const repName = zState.repId ? repSelLabel(zState.repId) : 'كل المناديب';
    const fl = ZERO_FIELDS.filter(([k])=>zState.fields.has(k)).map(([k,l])=>l).join('، ');
    if(!confirm(`هتصفّر (${fl}) لـ ${r.clients} عميل — ${repName} — يوم ${zState.date}. تكمل؟`)){ zState.busy = false; return zRenderPreview(); }
    const updates = {};
    Object.entries(r.items).forEach(([id,li])=>Object.keys(li).forEach(k=>{ updates[`days/${zState.date}/${id}/${k}`] = 0; }));
    const logId = uid();
    const summary = {date:zState.date, rep:zState.repId||'', repName, fields:[...zState.fields], count:r.clients, totals:r.perField, createdAt:Date.now()};
    updates[ZERO_LOG+'/'+logId] = summary;
    updates[ZERO_ITEMS+'/'+logId] = r.items;
    const ack = await Promise.race([state.db.ref().update(updates).then(()=>'ok'), new Promise(res=>setTimeout(()=>res('timeout'),10000))]);
    if(ack==='timeout'){
      $('#zPreview').classList.add('warn');
      $('#zPreview').textContent = 'السيرفر مردّش خلال 10 ثواني — راجع النت. التصفير ممكن ميكونش اتحفظ.';
      zState.busy = false; return;
    }
    zState.hist = [{id:logId, ...summary}, ...zState.hist].slice(0,6);
    zState.day = JSON.parse(JSON.stringify(zState.day)); Object.entries(r.items).forEach(([id,li])=>Object.keys(li).forEach(k=>{ zState.day[id][k] = 0; }));
    $('#zPreview').classList.remove('warn');
    $('#zPreview').innerHTML = `<span class="pill good" style="font-size:13px; padding:6px 12px; white-space:normal">تم تصفير ${fl} لـ ${r.clients} عميل ✓ — دلوقتي ارفع الشيت</span>`;
    $('#zApply').disabled = true; $('#zApply').textContent = 'صفّر';
    toast('تم التصفير'); zRenderHist();
  }catch(err){
    const denied = /permission/i.test((err.code||'')+' '+err.message);
    $('#zPreview').classList.add('warn');
    $('#zPreview').textContent = 'فشل التصفير: '+err.message+(denied?' — صلاحيات Firebase رافضة الكتابة':'');
  }
  zState.busy = false;
}

function zLoadHist(){
  return state.db.ref(ZERO_LOG).limitToLast(10).once('value').then(s=>{
    zState.hist = Object.entries(s.val()||{}).map(([id,h])=>({id,...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,6);
    zRenderHist();
  }).catch(()=>{});
}
function zRenderHist(){
  const box = $('#zHist'); if(!box) return;
  if(!zState.hist.length){ box.innerHTML=''; return; }
  const lbl = k => (ZERO_FIELDS.find(f=>f[0]===k)||[0,k])[1];
  box.innerHTML = `
    <div style="font-size:12.5px; color:var(--fg-dim); margin:16px 0 6px; font-weight:700">آخر عمليات التصفير</div>
    <div class="tablewrap"><table style="min-width:520px">

        <td style="font-size:12.5px">${escapeHtml(h.repName||'')}</td>
        <td style="font-size:12.5px">${(h.fields||[]).map(lbl).join('، ')}</td>
        <td class="tnum">${h.count||0}</td>
        <td>${h.undone ? '<span class="pill neutral">اتلغى</span>' : `<button class="btn sm danger" data-zundo="${h.id}">تراجع</button>`}</td>
      </tr>`).join('')}</tbody></table></div>`;
  $$('[data-zundo]').forEach(b=>b.onclick = ()=>zUndo(b.dataset.zundo));

/* التراجع بيرجّع القيمة القديمة بس لو الخانة لسه صفر — عشان ميمسحش شيت اترفع بعد التصفير */
async function zUndo(logId){
  try{
    const [lg, it] = await Promise.all([state.db.ref(ZERO_LOG+'/'+logId).once('value'), state.db.ref(ZERO_ITEMS+'/'+logId).once('value')]);
    const log = lg.val(), items = it.val() || {};
    if(!log || log.undone) return;
    if(!confirm(`تتراجع عن تصفير يوم ${log.date} (${log.count||0} عميل)؟ الخانات اللي اتملت من جديد بعد التصفير مش هتتلمس.`)) return;
    const day = (await state.db.ref('days/'+log.date).once('value')).val() || {};
    const updates = {}; let restored = 0, skipped = 0;
    Object.entries(items).forEach(([cid,flds])=>Object.entries(flds).forEach(([k,prev])=>{
      if((Number((day[cid]||{})[k])||0)===0){ updates[`days/${log.date}/${cid}/${k}`] = prev; restored++; } else skipped++;
    }));
    updates[ZERO_LOG+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = zState.hist.find(x=>x.id===logId); if(h) h.undone = true;
    if(log.date===zState.date){ zLoadDay(); }
    zRenderHist();
    toast(`تم التراجع — رجعت ${restored} خانة${skipped?` وتخطّيت ${skipped} (اتملت بعد التصفير)`:''}`);
  }catch(err){ toast('خطأ: '+err.message); }
}


/* ================= رفع يومية كاملة (شيت واحد فيه كل العملاء بكل الخانات) =================
   - كل اسم بيتطابق مع العميل في الداتا بيز (مطابقة ذكية)، والمجهول يتضاف كعميل جديد (اختياري)
   - عمود المندوب اختياري: العملاء الجدد بياخدوا مندوبهم من الشيت (والمندوب الجديد بيتعمل لوحده)
   - طريقة الحفظ: استبدال القيم أو الإضافة على الموجود — الخانات المربوطة بس هي اللي بتتلمس
   - ممكن تصفّر باقي عملاء اليوم اللي مش في الشيت (اختياري)
   - فيه سجل وتراجع */
const FD_FIELDS = [
  {key:'fawry', label:'فوري', re:/فوري/},
  {key:'aman', label:'امان', re:/امان/},
  {key:'masary', label:'مصاري', re:/مصاري/},
  {key:'mumkin', label:'ممكن', re:/ممكن/},
  {key:'basata', label:'بساطة', re:/بساط/},
  {key:'cash', label:'كاش', re:/^كاش|^نقد/},
  {key:'collection', label:'التحصيل', re:/تحصيل/},
  {key:'debtYesterday', label:'آجل أمس', re:/اجل|قديم|سابق/},
];
const FD_NAME_RE = /اسم|عميل|تاجر|محل/;
const FD_REP_RE = /مندوب/;
const FD_LOG = 'meta/fullDayUploads';
const fdState = {};
const fdEmptyCols = () => { const c = {name:null, rep:null}; FD_FIELDS.forEach(f=>{ c[f.key]=null; }); return c; };

function fdDetectRow(r){
  const nameIdx = r.findIndex(x=>typeof x==='string' && FD_NAME_RE.test(norm(x)) && !FD_REP_RE.test(norm(x)));
  if(nameIdx<0) return null;
  const c = fdEmptyCols(), used = new Set([nameIdx]);
  c.name = nameIdx;
  FD_FIELDS.forEach(f=>{
    const j = r.findIndex((x,k)=>!used.has(k) && typeof x==='string' && f.re.test(norm(x)));
    if(j>=0){ c[f.key]=j; used.add(j); }
  });
  const rj = r.findIndex((x,k)=>!used.has(k) && typeof x==='string' && FD_REP_RE.test(norm(x)));
  if(rj>=0) c.rep = rj;
  return c;
}
function fdDetect(rows){
  let header = 1, cols = null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const c = fdDetectRow(rows[i]||[]);
    if(!c) continue;
    header = i+1; cols = c;
    if(FD_FIELDS.some(f=>c[f.key]!=null)) break;
  }
  return {header, cols: cols || fdEmptyCols()};
}

function fdUseSheet(name, forced){
  const u = fdState; u.sheet = name;
  u.rows = XLSX.utils.sheet_to_json(u.wb.Sheets[name],{header:1,defval:null,raw:true});
  if(forced){ u.header = forced; u.cols = fdDetectRow(u.rows[forced-1]||[]) || fdEmptyCols(); }
  else { const d = fdDetect(u.rows); u.header = d.header; u.cols = d.cols; }
  u.skip = new Set();
}
function fdColOptions(sel){
  const u = fdState, header = u.rows[u.header-1] || [];
  const width = Math.max(header.length, 0, ...u.rows.slice(0,30).map(r=>(r||[]).length));
  let o = '<option value="">— تجاهل —</option>';
  for(let i=0;i<width;i++){
    const h = header[i];
    o += `<option value="${i}" ${sel===i?'selected':''}>${escapeHtml(h==null?'عمود '+colToLetter(i):String(h))} (${colToLetter(i)})</option>`;
  }
  return o;
}

      ${FD_FIELDS.map(f=>`<div class="field"><label>${f.label}</label><select data-fdmap="${f.key}">${fdColOptions(u.cols[f.key])}</select></div>`).join('')}
    </div>`;

  if(sh) sh.onchange = e=>{ fdUseSheet(e.target.value); fdRenderConfig(); fdRenderPreview(); };

    fdUseSheet(u.sheet, h); fdRenderConfig(); fdRenderPreview();

    u.cols[e.target.dataset.fdmap] = e.target.value==='' ? null : Number(e.target.value);
    fdRenderPreview();

function fdDayNow(){
  const u = fdState;
  if(u.date===state.day) return state.dayData || {};
  return u.dayCacheDate===u.date ? u.dayCache : null;
}
function fdEnsureDay(){
  const u = fdState;
  if(u.date===state.day || u.dayCacheDate===u.date) return Promise.resolve();
  const d = u.date;
  return state.db.ref('days/'+d).once('value').then(s=>{
    if(u.date===d){ u.dayCache = s.val()||{}; u.dayCacheDate = d; fdRenderPreview(); }
  }).catch(()=>{});
}

function fdCompute(){
  const u = fdState, c = u.cols;
  const idx = upBuildIndex(), acc = new Map();
  if(c.name!=null){
    u.rows.slice(u.header).forEach(r=>{
      if(!r) return;
      const raw = r[c.name]; if(raw==null) return;
      const name = String(raw).trim();
      if(!name || name==='0' || UP_SKIP_NAMES.includes(norm(name))) return;
      const m = upMatch(name, idx);
      const key = m.id || ('n:'+norm(name));
      let it = acc.get(key);
      if(!it){ it = {key, id:m.id||null, dup:!!m.dup, name, rows:0, vals:{}, repName:''}; acc.set(key, it); }
      it.rows++;
      if(c.rep!=null && !it.repName && r[c.rep]!=null) it.repName = String(r[c.rep]).trim();
      FD_FIELDS.forEach(f=>{
        const ci = c[f.key]; if(ci==null) return;
        it.vals[f.key] = upRound((it.vals[f.key]||0) + upToNum(r[ci]));
      });
    });
  }
  u.items = [...acc.values()].map(it=>{
    it.canApply = !it.dup && (!!it.id || u.createNew);
    it.include = it.canApply && !u.skip.has(it.key);
    return it;
  });
}

/* خطة التصفير: عملاء مش في الشيت ليهم أرقام في اليوم */
function fdWipePlan(day){
  const prot = new Set(fdState.items.filter(it=>it.id).map(it=>it.id));
  const totals = {}; let n = 0;
  Object.keys(state.clients).forEach(id=>{
    if(!state.clients[id] || prot.has(id)) return;
    const r = (day||{})[id] || {}; let any = false;
    FD_FIELDS.forEach(f=>{
      const v = upRound(Number(r[f.key])||0);
      if(v){ totals[f.key] = upRound((totals[f.key]||0)+v); any = true; }
    });
    if(any) n++;
  });
  return {n, totals};
}

function fdRenderPreview(){
  const u = fdState, box = $('#fdPreview'); if(!box) return;
  const btn = $('#fdApply');
  if(!u.wb){ box.innerHTML = ''; return; }
  fdCompute();
  const c = u.cols;
  if(c.name==null){ box.innerHTML = `<div class="preview-box warn">مش لاقي عمود الاسم — اختاره من «ربط الأعمدة» فوق.</div>`; btn.disabled = true; return; }
  const cols = FD_FIELDS.filter(f=>c[f.key]!=null);
  if(!cols.length){ box.innerHTML = `<div class="preview-box warn">اربط عمود مبلغ واحد على الأقل (فوري / امان / تحصيل / آجل أمس ...).</div>`; btn.disabled = true; return; }

  const day = fdDayNow();
  const statusOf = it=>{
    if(it.dup) return `<span class="pill warn">اسم مكرر في الداتا بيز</span>`;
    if(it.id) return `<span class="pill good">مطابق</span>`;
    return u.createNew ? `<span class="pill neutral">عميل جديد</span>` : `<span class="pill danger">مش موجود</span>`;
  };
  const rowsHtml = u.items.map(it=>{
    const cur = it.id && day ? (day[it.id]||{}) : null;
    const cl = it.id ? state.clients[it.id] : null;
    const dbName = cl ? cl.name : '';
    const repShown = cl ? upRepName(cl.rep) : it.repName;
    return `<tr style="${it.include?'':'opacity:.55'}">
      <td><input type="checkbox" data-fdk="${escapeHtml(it.key)}" ${it.include?'checked':''} ${it.canApply?'':'disabled'}></td>
