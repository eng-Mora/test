<style>
/* =====================================================================
   DESIGN TOKENS
===================================================================== */
:root{
  --navy-950:#0A1120;
  --navy-900:#0F1B31;
  --navy-800:#16264A;
  --navy-700:#1E3260;
  --blue-accent:#4C6FE0;
  --blue-accent-dark:#3B57B8;
  --blue-accent-soft:#EBF0FD;
  --gray-25:#FBFBFC;
  --gray-50:#F6F7F9;
  --gray-100:#EEF0F3;
  --gray-200:#E2E5EA;
  --gray-300:#CDD2DB;
  --gray-400:#9AA3B2;
  --gray-500:#707A8C;
  --gray-600:#5C6675;
  --gray-700:#414A59;
  --gray-800:#2B3342;
  --white:#FFFFFF;
  --success:#3E8E6B;
  --success-soft:#E7F4EE;
  --danger:#C0564B;
  --danger-soft:#FBEAE7;
  --warning:#C08A3B;
  --warning-soft:#FBF1E3;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,27,49,.06);
  --shadow-md:0 6px 20px rgba(15,27,49,.08);
  --shadow-lg:0 16px 40px rgba(15,27,49,.14);
  --font-head:'Space Grotesk',Inter,sans-serif;
  --font-body:'Inter',sans-serif;
  --sidebar-w:248px;
  --topbar-h:64px;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--gray-50);
  color:var(--gray-800);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;color:var(--navy-900);}
p{margin:0;}
button{font-family:var(--font-body);}
a{color:inherit;text-decoration:none;}
::selection{background:var(--blue-accent-soft);}
input,select,textarea{font-family:var(--font-body);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* =====================================================================
   LOGIN SCREEN
===================================================================== */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(76,111,224,.18), transparent 45%),
    linear-gradient(160deg, var(--navy-950), var(--navy-900) 60%, var(--navy-800));
  padding:24px;
}
.login-card{
  width:100%;
  max-width:400px;
  background:rgba(255,255,255,.98);
  border-radius:var(--radius-lg);
  padding:40px 34px 32px;
  box-shadow:var(--shadow-lg);
}
.login-brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
}
.login-brand .mark{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--navy-800),var(--navy-950));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-head);font-weight:700;font-size:18px;
  flex-shrink:0;
}
.login-brand .name{font-family:var(--font-head);font-weight:700;font-size:20px;color:var(--navy-900);}
.login-brand .sub{font-size:12px;color:var(--gray-500);letter-spacing:.02em;}
.login-title{font-size:22px;font-weight:600;margin-bottom:4px;}
.login-desc{color:var(--gray-500);font-size:14px;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;
}
.field label .req{color:var(--danger);margin-left:2px;}
.field input,.field select,.field textarea{
  width:100%;
  padding:11px 13px;
  border:1.5px solid var(--gray-200);
  border-radius:var(--radius-sm);
  font-size:14px;
  color:var(--navy-900);
  background:var(--white);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--blue-accent);box-shadow:0 0 0 3px var(--blue-accent-soft);
}
.field .err{color:var(--danger);font-size:12.5px;margin-top:5px;display:none;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}
.field.invalid .err{display:block;}
.field .hint{font-size:12px;color:var(--gray-400);margin-top:5px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;
  padding:11px 18px;
  cursor:pointer;
  transition:transform .1s ease, background .15s ease, box-shadow .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-accent{background:var(--blue-accent);color:#fff;}
.btn-accent:hover{background:var(--blue-accent-dark);}
.btn-outline{background:#fff;color:var(--navy-900);border:1.5px solid var(--gray-200);}
.btn-outline:hover{border-color:var(--gray-300);background:var(--gray-50);}
.btn-ghost{background:transparent;color:var(--gray-600);}
.btn-ghost:hover{background:var(--gray-100);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:#f5d9d3;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn .spinner{display:none;}
.btn.loading .spinner{display:inline-block;}
.btn.loading .btn-label{opacity:.7;}

.spinner{
  width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
.spinner.dark{border:2px solid var(--gray-200);border-top-color:var(--blue-accent);}
@keyframes spin{to{transform:rotate(360deg);}}

.login-error{
  background:var(--danger-soft);color:var(--danger);font-size:13px;
  padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:16px;display:none;
}
.login-demo{margin-top:22px;font-size:12px;color:var(--gray-400);text-align:center;line-height:1.6;}

/* =====================================================================
   APP SHELL
===================================================================== */
#app{display:none;min-height:100vh;}
#app.active{display:flex;}

.sidebar{
  width:var(--sidebar-w);
  background:var(--navy-950);
  color:#dfe4ee;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  z-index:40;
  transition:transform .25s ease;
}
.sidebar-brand{
  display:flex;align-items:center;gap:11px;
  padding:20px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-brand .mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--blue-accent),#7A93EC);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;color:#fff;font-size:15px;
  flex-shrink:0;
}
.sidebar-brand .txt .name{font-family:var(--font-head);font-weight:700;font-size:16px;color:#fff;}
.sidebar-brand .txt .sub{font-size:10.5px;color:#8f9bb3;letter-spacing:.08em;text-transform:uppercase;}

.sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:9px;
  font-size:14px;font-weight:500;color:#b9c2d6;
  cursor:pointer;margin-bottom:2px;
  transition:background .12s ease,color .12s ease;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue-accent);color:#fff;}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:20px;
}
.nav-section-label{
  font-size:10.5px;letter-spacing:.09em;color:#66708a;text-transform:uppercase;
  margin:16px 12px 6px;font-weight:700;
}

.sidebar-user{
  padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--blue-accent-soft);color:var(--blue-accent-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
}
.avatar.dark{background:rgba(255,255,255,.1);color:#fff;}
.sidebar-user .txt{flex:1;min-width:0;}
.sidebar-user .uname{color:#fff;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-user .urole{color:#8f9bb3;font-size:11.5px;text-transform:capitalize;}
.sidebar-user button{background:transparent;border:none;color:#8f9bb3;cursor:pointer;padding:6px;border-radius:7px;}
.sidebar-user button:hover{background:rgba(255,255,255,.08);color:#fff;}

.main-col{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;min-width:0;}

.topbar{
  height:var(--topbar-h);
  padding-top:env(safe-area-inset-top,0px);
  background:#fff;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;gap:14px;padding-left:22px;padding-right:22px;
  position:sticky;top:0;z-index:30;
}
.topbar .menu-toggle{display:none;background:transparent;border:none;cursor:pointer;color:var(--navy-900);padding:6px;}
.topbar-title{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--navy-900);}
.topbar-search{
  flex:1;max-width:420px;position:relative;margin-left:12px;
}
.topbar-search input{
  width:100%;padding:9px 14px 9px 36px;border-radius:10px;border:1.5px solid var(--gray-200);
  background:var(--gray-50);font-size:13.5px;
}
.topbar-search input:focus{outline:none;border-color:var(--blue-accent);background:#fff;box-shadow:0 0 0 3px var(--blue-accent-soft);}
.topbar-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gray-400);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.icon-btn{
  position:relative;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--gray-200);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy-900);
}
.icon-btn:hover{background:var(--gray-50);}
.icon-btn svg{width:17px;height:17px;}
.icon-btn .dot{
  position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  border:2px solid #fff;
}

.view{padding:26px 28px 60px;max-width:1400px;width:100%;margin:0 auto;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.view-head h1{font-size:23px;}
.view-head .desc{color:var(--gray-500);font-size:13.5px;margin-top:4px;}

/* =====================================================================
   CARDS / GRID / STATS
===================================================================== */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);
  padding:18px 20px;display:flex;flex-direction:column;gap:10px;
}
.stat-card .top{display:flex;align-items:center;justify-content:space-between;}
.stat-card .icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-accent-soft);color:var(--blue-accent-dark);}
.stat-card .icon svg{width:17px;height:17px;}
.stat-card .num{font-family:var(--font-head);font-size:27px;font-weight:700;color:var(--navy-900);}
.stat-card .lbl{font-size:12.5px;color:var(--gray-500);font-weight:500;}
.stat-card.success .icon{background:var(--success-soft);color:var(--success);}
.stat-card.danger .icon{background:var(--danger-soft);color:var(--danger);}
.stat-card.warning .icon{background:var(--warning-soft);color:var(--warning);}

.section-title{font-size:15.5px;font-weight:700;color:var(--navy-900);margin-bottom:14px;font-family:var(--font-head);}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media (max-width:980px){.two-col{grid-template-columns:1fr;}}

/* =====================================================================
   TABLE / DATA LIST
===================================================================== */
.table-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden;}
.table-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--gray-100);}
.table-toolbar .grow{flex:1;min-width:180px;}
.filter-select{
  padding:8px 11px;border-radius:8px;border:1.5px solid var(--gray-200);font-size:13px;background:#fff;color:var(--gray-700);
}
.filter-select:focus{outline:none;border-color:var(--blue-accent);}
table{width:100%;border-collapse:collapse;}
thead th{
  text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--gray-500);
  padding:12px 18px;border-bottom:1px solid var(--gray-100);font-weight:700;background:var(--gray-25);
}
tbody td{padding:14px 18px;border-bottom:1px solid var(--gray-100);font-size:13.5px;color:var(--gray-800);vertical-align:middle;}
tbody tr{cursor:pointer;transition:background .1s ease;}
tbody tr:hover{background:var(--gray-50);}
tbody tr:last-child td{border-bottom:none;}
.cell-name{font-weight:600;color:var(--navy-900);}
.cell-sub{color:var(--gray-500);font-size:12px;margin-top:2px;}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
  background:var(--gray-100);color:var(--gray-600);white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.status-new{background:var(--blue-accent-soft);color:var(--blue-accent-dark);}
.badge.status-contacted{background:#EEF3FB;color:#3E6BB8;}
.badge.status-noanswer{background:var(--gray-100);color:var(--gray-600);}
.badge.status-interested{background:var(--success-soft);color:var(--success);}
.badge.status-notinterested{background:var(--danger-soft);color:var(--danger);}
.badge.status-followup{background:var(--warning-soft);color:var(--warning);}
.badge.status-visitscheduled{background:#EFEBFB;color:#6C4EC2;}
.badge.status-visited{background:#EFEBFB;color:#6C4EC2;}
.badge.status-negotiation{background:var(--warning-soft);color:var(--warning);}
.badge.status-sold{background:var(--success);color:#fff;}
.badge.status-lost{background:var(--danger);color:#fff;}

.badge.priority-high{background:var(--danger-soft);color:var(--danger);}
.badge.priority-medium{background:var(--warning-soft);color:var(--warning);}
.badge.priority-low{background:var(--gray-100);color:var(--gray-600);}

.empty-state{padding:56px 20px;text-align:center;color:var(--gray-500);}
.empty-state svg{width:38px;height:38px;color:var(--gray-300);margin-bottom:12px;}
.empty-state .title{font-weight:700;color:var(--navy-800);font-size:14.5px;margin-bottom:4px;}
.empty-state .desc{font-size:13px;max-width:320px;margin:0 auto;}

.skeleton{background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 37%,var(--gray-100) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skeleton-row{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid var(--gray-100);align-items:center;}
.skeleton-row .skeleton{height:13px;}

/* =====================================================================
   FAB / ADD BUTTON
===================================================================== */
.add-cta{
  display:flex;align-items:center;gap:10px;background:var(--navy-900);color:#fff;border:none;
  border-radius:var(--radius-md);padding:14px 22px;font-size:14.5px;font-weight:700;cursor:pointer;
}
.add-cta:hover{background:var(--navy-800);}
.add-cta svg{width:18px;height:18px;}

/* =====================================================================
   MODALS
===================================================================== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .15s ease;
}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{
  background:#fff;border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  transform:translateY(10px) scale(.98);transition:transform .18s ease;
}
.modal-backdrop.open .modal{transform:translateY(0) scale(1);}
.modal.modal-lg{max-width:880px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--gray-100);gap:12px;}
.modal-head h3{font-size:17px;}
.modal-head .sub{color:var(--gray-500);font-size:12.5px;margin-top:3px;}
.modal-close{background:var(--gray-100);border:none;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--gray-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close:hover{background:var(--gray-200);}
.modal-body{padding:22px;overflow-y:auto;flex:1;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-grid .span2{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

/* confirm dialog */
.confirm-modal{max-width:400px;text-align:center;padding:28px 24px 24px;}
.confirm-modal .icon{width:48px;height:48px;border-radius:50%;background:var(--danger-soft);color:var(--danger);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.confirm-modal .icon svg{width:22px;height:22px;}
.confirm-modal h3{font-size:16.5px;margin-bottom:6px;}
.confirm-modal p{color:var(--gray-500);font-size:13.5px;line-height:1.5;margin-bottom:20px;}
.confirm-modal .row{display:flex;gap:10px;}
.confirm-modal .row .btn{flex:1;}

/* =====================================================================
   TOASTS
===================================================================== */
#toastHost{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.toast{
  background:var(--navy-900);color:#fff;padding:13px 16px;border-radius:11px;box-shadow:var(--shadow-lg);
  display:flex;align-items:flex-start;gap:10px;min-width:260px;max-width:340px;font-size:13.5px;
  animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;}
.toast.success{background:#215943;}
.toast.error{background:#6B2A22;}
.toast.info{background:var(--navy-900);}
.toast .msg{flex:1;line-height:1.4;}
.toast button{background:transparent;border:none;color:rgba(255,255,255,.6);cursor:pointer;padding:0;}

/* =====================================================================
   CUSTOMER PROFILE
===================================================================== */
.profile-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.profile-head .avatar{width:52px;height:52px;font-size:18px;background:var(--navy-900);color:#fff;}
.profile-head .name{font-size:18px;font-weight:700;color:var(--navy-900);font-family:var(--font-head);}
.profile-head .meta{font-size:12.5px;color:var(--gray-500);margin-top:2px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-100);padding:0 22px;overflow-x:auto;}
.tab-btn{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--gray-500);background:none;border:none;cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--blue-accent-dark);border-color:var(--blue-accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;}
@media (max-width:520px){.info-grid{grid-template-columns:1fr;}}
.info-item .k{font-size:11.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:3px;}
.info-item .v{font-size:14px;color:var(--navy-900);font-weight:500;}
.info-item .v.muted{color:var(--gray-400);font-weight:400;}
.divider{height:1px;background:var(--gray-100);margin:20px 0;}

.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:var(--gray-200);}
.tl-item{position:relative;padding-bottom:22px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid var(--blue-accent);
  display:flex;align-items:center;justify-content:center;}
.tl-dot.success{border-color:var(--success);}
.tl-dot.danger{border-color:var(--danger);}
.tl-dot.warning{border-color:var(--warning);}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tl-action{font-weight:700;font-size:13.5px;color:var(--navy-900);}
.tl-role{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--gray-500);background:var(--gray-100);padding:2px 7px;border-radius:6px;}
.tl-meta{font-size:12px;color:var(--gray-400);margin-top:2px;}
.tl-detail{font-size:13px;color:var(--gray-600);margin-top:5px;line-height:1.5;background:var(--gray-50);padding:9px 12px;border-radius:9px;}

.chat-list{display:flex;flex-direction:column;gap:12px;max-height:320px;overflow-y:auto;padding-right:4px;}
.chat-bubble{max-width:82%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;}
.chat-bubble.manager{background:var(--navy-900);color:#fff;align-self:flex-start;border-bottom-left-radius:3px;}
.chat-bubble.sales{background:var(--blue-accent-soft);color:var(--navy-900);align-self:flex-end;border-bottom-right-radius:3px;}
.chat-meta{font-size:10.5px;opacity:.75;margin-bottom:3px;font-weight:700;}
.chat-input-row{display:flex;gap:8px;margin-top:14px;}
.chat-input-row textarea{flex:1;resize:none;min-height:42px;max-height:110px;}

/* =====================================================================
   NEW FEATURE STYLES — alerts, quick actions, score, inventory/team lists
===================================================================== */
.alert-banner{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--warning-soft);color:#7A5A1E;border:1px solid #EED9AE;
  border-radius:var(--radius-md);padding:13px 16px;margin-bottom:18px;font-size:13.5px;font-weight:600;
}
.alert-banner svg{width:18px;height:18px;flex-shrink:0;}
.alert-banner .grow{flex:1;}
.alert-banner button{flex-shrink:0;}

.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.row-icon-btn{
  width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gray-200);background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:var(--gray-600);cursor:pointer;flex-shrink:0;
}
.row-icon-btn:hover{background:var(--gray-50);}
.row-icon-btn.wa:hover{color:#2E9E5B;border-color:#bfe6cf;}
.row-icon-btn.call:hover{color:var(--blue-accent-dark);border-color:var(--blue-accent-soft);}
@media (max-width:760px){ .row-actions{justify-content:flex-end;} }

.score-pill{
  display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px;padding:3px 9px;border-radius:20px;
  background:var(--gray-100);color:var(--gray-600);
}
.score-pill.hot{background:var(--success-soft);color:var(--success);}
.score-pill.warm{background:var(--warning-soft);color:var(--warning);}

.manage-list{border:1px solid var(--gray-200);border-radius:var(--radius-md);overflow:hidden;margin-top:10px;}
.manage-list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--gray-100);font-size:13.5px;}
.manage-list-row:last-child{border-bottom:none;}
.manage-list-row button{background:transparent;border:none;color:var(--gray-400);cursor:pointer;padding:4px;}
.manage-list-row button:hover{color:var(--danger);}
.manage-add-row{display:flex;gap:8px;margin-top:10px;}
.manage-add-row input{flex:1;}

html[dir="rtl"] thead th{text-align:right;}

html[dir="rtl"] .timeline::before{left:auto;right:8px;}

const AR_PATTERNS = [
  [/^(\d+) results?(?: for "(.*)")?$/, (n,q)=>`${n} ${+n===1?'نتيجة':'نتائج'}${q!==undefined?` عن "${q}"`:''}`],
  [/^(\d+) follow-up\(s\) due today(?:, (\d+) overdue)?\.$/, (a,b)=>`${a} متابعة مستحقة اليوم${b?`، ${b} متأخرة`:''}.`],
  [/^(\d+) follow-ups? due today( ·)?$/, (a,d)=>`${a} متابعة مستحقة اليوم${d||''}`],
  [/^(\d+) overdue$/, n=>`${n} متأخرة`],
  [/^Overdue \((\d+)\)$/, n=>`المتأخرة (${n})`],
  [/^Upcoming \((\d+)\)$/, n=>`القادمة (${n})`],
  [/^(\d+) unread$/, n=>`${n} غير مقروء`],
  [/^(\d+)m ago$/, n=>`منذ ${n} د`], [/^(\d+)h ago$/, n=>`منذ ${n} س`], [/^(\d+)d ago$/, n=>`منذ ${n} يوم`],
  [/^EGP (.+)$/, n=>`${n} ج.م`],
  [/^(.*) — assigned$/, n=>`${n} — معيّنون`],
  [/^(.+) · (admin|manager|sales|callcenter) · (.+)$/, (u,r,t)=>`${u} · ${AR[r]} · ${trStr(t)}`],
  [/^(.+) added a new lead for (.+)\.$/, (u,c)=>`${u} أضاف عميلاً محتملاً جديدًا لسيارة ${c}.`],
  [/^Assigned to (.+)\.$/, m=>`تم التعيين إلى ${m}.`],
  [/^(.+) assigned this lead to (.+)\.$/, (a,b)=>`${a} عيّن هذا العميل إلى ${b}.`],
  [/^Status set to "(.+)"\.(?: Note: (.*))?$/, (s,n)=>`تم تغيير الحالة إلى "${trStr(s)}".${n?` ملاحظة: ${n}`:''}`],
  [/^Next follow-up set for (.+)\.$/, d=>`تم تحديد المتابعة القادمة في ${d}.`],
  [/^Showroom visit set for (.+)\.$/, d=>`تم تحديد زيارة المعرض في ${d}.`],
  [/^(.+) was added by (.+)\.$/, (c,u)=>`${c} أضافه ${u}.`],
  [/^(.+) set status to "(.+)"\.$/, (u,s)=>`${u} غيّر الحالة إلى "${trStr(s)}".`],
  [/^Regarding (.+): "(.*)"$/, (c,m)=>`بخصوص ${c}: "${m}"`],
  [/^(.+) regarding (.+)$/, (u,c)=>`${u} بخصوص ${c}`],
  [/^(.+) has been "New" for over (\d+)h with no update\.$/, (c,h)=>`${c} ما زال "جديد" منذ أكثر من ${h} ساعة بدون أي تحديث.`],
  [/^"(.+)" already has this phone number in the system \(status: (.+)\)\. Do you still want to add a new lead\?$/, (n,s)=>`العميل "${n}" لديه نفس رقم الهاتف في النظام (الحالة: ${trStr(s)}). هل تريد إضافة عميل جديد رغم ذلك؟`],
  [/^Could not save customer: (.+)$/, e=>`تعذر حفظ العميل: ${e}`],
  [/^Could not schedule: (.+)$/, e=>`تعذر تحديد الموعد: ${e}`],
  [/^Save failed: (.+)$/, e=>`فشل الحفظ: ${e}`],
  [/^Account created for (.+)$/, e=>`تم إنشاء حساب لـ ${e}`],
  [/^Could not create user: (.+?) \(is the Cloud Function deployed.*\)$/, e=>`تعذر إنشاء المستخدم: ${e} (هل تم نشر الـ Cloud Function وضبط CREATE_USER_ENDPOINT؟)`]
];

function trStr(s){
  if(LANG!=='ar' || !s) return s;
  const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const core = m[2]; if(!core) return s;
  let out = Object.prototype.hasOwnProperty.call(AR, core) ? AR[core] : undefined;
  if(out===undefined){
    for(const [re,fn] of AR_PATTERNS){ const mm = core.match(re); if(mm){ out = fn(...mm.slice(1)); break; } }
  }
  return out===undefined ? s : m[1]+out+m[3];
}

const I18N_ATTRS = ['placeholder','title','aria-label','data-label'];
const I18N_SKIP = new Set(['SCRIPT','STYLE','TEXTAREA']);
function trTextNode(n){
  if(n.__tr!==undefined && n.nodeValue===n.__tr) return;
  const src = n.nodeValue, out = trStr(src);
  if(out!==src){ n.__orig = src; n.__tr = out; n.nodeValue = out; }
}
function trElAttrs(el){
  for(const a of I18N_ATTRS){
    if(!el.hasAttribute(a)) continue;
    const key='__a_'+a, v = el.getAttribute(a);
    if(el[key] && el[key].tr===v) continue;
    const out = trStr(v);
    if(out!==v){ el[key]={orig:v,tr:out}; el.setAttribute(a,out); }
  }
}
function trTree(root){
  if(LANG!=='ar') return;
  if(root.nodeType===3){ if(!I18N_SKIP.has(root.parentNode.nodeName)) trTextNode(root); return; }
  if(root.nodeType!==1 || I18N_SKIP.has(root.nodeName)) return;
  trElAttrs(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let n;
  while((n = w.nextNode())){
    if(n.nodeType===3){ if(!I18N_SKIP.has(n.parentNode.nodeName)) trTextNode(n); }
    else if(!I18N_SKIP.has(n.nodeName)) trElAttrs(n);
  }
}
function i18nRestoreAll(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let n;
  while((n = w.nextNode())){
    if(n.nodeType===3){
      if(n.__orig!==undefined && n.nodeValue===n.__tr) n.nodeValue = n.__orig;
      n.__orig = undefined; n.__tr = undefined;
    } else {
      for(const a of I18N_ATTRS){
        const k='__a_'+a;
        if(n[k]){ if(n.getAttribute(a)===n[k].tr) n.setAttribute(a,n[k].orig); n[k]=undefined; }
      }
    }
  }
}
new MutationObserver(muts=>{
  if(LANG!=='ar') return;
  muts.forEach(m=>m.addedNodes.forEach(trTree));
}).observe(document.body,{childList:true,subtree:true});

function updateLangButtons(){
  document.querySelectorAll('[data-lang-toggle] .lbl').forEach(l=>{ l.textContent = LANG==='ar' ? 'English' : 'العربية'; });
}
function setLang(l){
  LANG = l;
  try{ localStorage.setItem('az_lang', l); }catch(e){}

function openModal(innerHtml, opts={}){
  const host = document.getElementById('modalHost');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal ${opts.large?'modal-lg':''}">${innerHtml}</div>`;
  host.appendChild(backdrop);
  requestAnimationFrame(()=>backdrop.classList.add('open'));
  backdrop.addEventListener('mousedown', e=>{ if(e.target===backdrop) closeModal(backdrop); });
  backdrop.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click', ()=>closeModal(backdrop)));
  document.addEventListener('keydown', escHandler);
  function escHandler(e){ if(e.key==='Escape'){ closeModal(backdrop); document.removeEventListener('keydown', escHandler); } }
  return backdrop;
}
function closeModal(backdrop){
  backdrop.classList.remove('open');
  setTimeout(()=>backdrop.remove(), 180);
}
function confirmDialog({title,desc,confirmLabel='Confirm',danger=true,onConfirm}){
  const bd = openModal(`
    <div class="confirm-modal">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M12 9v4M12 17h.01M10.3 3.9L2.6 17a2 2 0 001.7 3h15.4a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

      <p>${escapeHtml(desc||'')}</p>

        <button class="btn btn-outline" data-close-modal>Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-accent'}" id="confirmYes">${escapeHtml(confirmLabel)}</button>

/* =====================================================================

===================================================================== */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString(LOC(),{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString(LOC(),{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'});
}
function fmtRelative(ts){
  if(!ts) return '—';
  const diff = Date.now()-ts;
  const day = 86400000;
  if(diff < 60000) return 'just now';
  if(diff < 3600000) return Math.round(diff/60000)+'m ago';
  if(diff < day) return Math.round(diff/3600000)+'h ago';
  if(diff < day*7) return Math.round(diff/day)+'d ago';
  return fmtDate(ts);
}
function isSameDay(ts, ref=new Date()){
  if(!ts) return false;
  const d = new Date(ts);
  return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth() && d.getDate()===ref.getDate();
}
function isThisWeek(ts){
  if(!ts) return false;
  const now=new Date(); const d=new Date(ts);
  const start = new Date(now); start.setDate(now.getDate()-now.getDay()); start.setHours(0,0,0,0);
  return d>=start;
}
function validatePhone(v){ return /^[+]?[\d\s-]{7,16}$/.test((v||'').trim()); }
function usersByRole(role){ return Object.entries(state.users).filter(([,u])=>u.role===role && u.active!==false).map(([uid,u])=>({uid,...u})); }

/* =====================================================================
   CSV EXPORT
===================================================================== */
function csvEscape(v){ v = v==null?'':String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }
function exportCustomersCSV(list){
  if(!list.length){ toast('Nothing to export for the current filters.','info'); return; }
  const headers = ['Name','Phone','WhatsApp','Location','Branch','Interested Car','Budget','Source','Priority','Status','Sales Rep','Manager','Created By','Created At','Next Follow-up','Lead Score'];
  const rows = list.map(c=>[c.name,c.phone,c.whatsapp,c.location,c.branch,c.interestedCar,c.budget,c.source,c.priority,c.status,c.salesName,c.managerName,c.createdByName,fmtDate(c.createdAt),fmtDate(c.nextFollowUp),computeLeadScore(c)]);
  const csv = [headers, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `abuzeid-customers-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('CSV exported.','success');
}

/* =====================================================================
   LEAD SCORING (0-100, heuristic: budget + priority + engagement + stage)
===================================================================== */
function computeLeadScore(c){
  let score = 0;
  const budget = Number(c.budget)||0;
  score += Math.min(30, Math.round(budget/50000));
  score += {High:25, Medium:15, Low:5}[c.priority] || 10;
  score += Math.min(20, (c.callsCount||0)*4);
  const statusPts = {New:5,Contacted:10,'No Answer':5,'Follow Up':15,Interested:25,'Visit Scheduled':30,'Visited Showroom':32,Negotiation:35,Sold:40,'Not Interested':0,Lost:0};
  score += statusPts[c.status] || 0;
  return Math.max(0, Math.min(100, score));
}
function scoreBadge(score){
  const tone = score>=65 ? 'hot' : score>=35 ? 'warm' : '';
  return `<span class="score-pill ${tone}">${score}</span>`;
}

/* =====================================================================
   SLA AUTO-ESCALATION
   Runs client-side whenever the customer list refreshes for a Manager/Admin
   session. A production setup should mirror this with a scheduled Cloud
   Function (Cloud Scheduler + Functions) so it fires even with nobody
   logged in — see the note in functions-create-user.js.
===================================================================== */
let slaCheckedOnce = false;
function checkSlaEscalations(){
  const role = currentRole();
  if(role!=='manager' && role!=='admin') return;
  const thresholdMs = SLA_NEW_LEAD_HOURS*3600*1000;
  Object.entries(state.customers).forEach(([id,c])=>{
    if(c.status==='New' && !c.slaEscalated && c.createdAt && (Date.now()-c.createdAt)>thresholdMs){
      db.ref('customers/'+id+'/slaEscalated').set(true);
      const targetManager = c.managerId || state.user.uid;
      notifyUser(targetManager, 'Lead needs attention', `${c.name} has been "New" for over ${SLA_NEW_LEAD_HOURS}h with no update.`, id);
    }
  });
}

/* Visible customers per role (client-side shaping; see security-rules comment above) */
function visibleCustomers(){
  const role = currentRole();
  const all = Object.entries(state.customers).map(([id,c])=>({id,...c}));
  if(role==='admin' || role==='manager') return all;
  if(role==='callcenter') return all.filter(c=>c.createdBy===state.user.uid);
  if(role==='sales') return all.filter(c=>c.salesId===state.user.uid);
  return [];
}
function applySearchFilter(list){
  let out = list;
  const q = state.search.trim().toLowerCase();
  if(q){
    out = out.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.interestedCar||'').toLowerCase().includes(q));
  }
  const f = state.filters;
  if(f.status) out = out.filter(c=>c.status===f.status);
  if(f.sales) out = out.filter(c=>c.salesId===f.sales);
  if(f.manager) out = out.filter(c=>c.managerId===f.manager);
  if(f.callcenter) out = out.filter(c=>c.createdBy===f.callcenter);
  if(f.priority) out = out.filter(c=>c.priority===f.priority);
  if(f.source) out = out.filter(c=>c.source===f.source);
  if(f.car) out = out.filter(c=>(c.interestedCar||'')===f.car);
  if(f.branch) out = out.filter(c=>(c.branch||'')===f.branch);
  return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

function addTimelineEvent(customerId, action, details, type='event', extraRole){
  const u = state.user;
  return db.ref('customerTimeline/'+customerId).push({
    type, action, details: details||'', userId:u.uid, userName:u.name, role: extraRole||u.role, createdAt: SERVER_TS
  });
}
function notifyUser(uid, title, body, customerId){
  if(!uid) return;
  return db.ref('notifications/'+uid).push({title, body, customerId: customerId||null, read:false, createdAt: SERVER_TS});
}

function createCustomer(payload){
  const ref = db.ref('customers').push();
  const u = state.user;
  const managerName = state.users[payload.managerId] ? state.users[payload.managerId].name : '';
  const data = {
    ...payload,
    managerName,
    salesId: null, salesName: null,
    status: 'New',
    createdBy: u.uid, createdByName: u.name,
    createdAt: SERVER_TS, updatedAt: SERVER_TS,
    lastContact: null, nextFollowUp: null, callsCount: 0,
    salesFeedback: '', customerInterest: '', expectedPurchaseDate: null
  };
  return ref.set(data).then(()=>{
    addTimelineEvent(ref.key, 'Lead created', `${u.name} added a new lead for ${payload.interestedCar||'a vehicle'}.`);
    if(payload.managerId){
      addTimelineEvent(ref.key, 'Assigned to Manager', `Assigned to ${managerName}.`);
      notifyUser(payload.managerId, 'New lead assigned', `${payload.name} was added by ${u.name}.`, ref.key);
    }
    return ref.key;
  });
}

function assignSales(customerId, salesId){
  const salesName = state.users[salesId] ? state.users[salesId].name : '';
  return db.ref('customers/'+customerId).update({salesId, salesName, updatedAt: SERVER_TS}).then(()=>{
    addTimelineEvent(customerId, 'Assigned to Sales', `${state.user.name} assigned this lead to ${salesName}.`);
    notifyUser(salesId, 'New customer assigned', `You were assigned a new customer.`, customerId);
  });
}

function updateStatus(customerId, status, note){
  return db.ref('customers/'+customerId).update({status, updatedAt: SERVER_TS}).then(()=>{
    addTimelineEvent(customerId, 'Status changed', `Status set to "${status}".${note? ' Note: '+note:''}`);
    const c = state.customers[customerId];
    if(c && c.managerId) notifyUser(c.managerId, 'Status updated', `${state.user.name} set status to "${status}".`, customerId);
  });
}

function logCall(customerId, note){
  const c = state.customers[customerId] || {};
  return db.ref('customers/'+customerId).update({
    lastContact: SERVER_TS, callsCount: (c.callsCount||0)+1, updatedAt: SERVER_TS
  }).then(()=>{
    addTimelineEvent(customerId, 'Call made', note || 'Sales representative contacted the customer.');
  });
}

function submitFeedback(customerId, {feedback, interest, expectedDate, followUp}){
  const upd = {salesFeedback: feedback, customerInterest: interest, updatedAt: SERVER_TS};
  if(expectedDate) upd.expectedPurchaseDate = expectedDate;
  if(followUp) upd.nextFollowUp = new Date(followUp).getTime();
  return db.ref('customers/'+customerId).update(upd).then(()=>{
    addTimelineEvent(customerId, 'Feedback added', feedback, 'feedback');
    const c = state.customers[customerId];
    if(c && c.managerId) notifyUser(c.managerId, 'New sales feedback', `${state.user.name}: "${feedback.slice(0,60)}"`, customerId);
  });
}

function addManagerNote(customerId, note){
  return addTimelineEvent(customerId, 'Manager note', note, 'note').then(()=>{
    const c = state.customers[customerId];
    if(c && c.salesId) notifyUser(c.salesId, 'New note from Manager', note.slice(0,60), customerId);
  });
}

function sendChatMessage(customerId, message){
  const role = currentRole();
  return db.ref('customerTimeline/'+customerId).push({
    type:'message', role, userId: state.user.uid, userName: state.user.name, message, createdAt: SERVER_TS
  }).then(()=>{
    const c = state.customers[customerId];
    if(role==='manager' || role==='admin'){
      if(c && c.salesId) notifyUser(c.salesId, 'New message from Manager', `Regarding ${c.name}: "${message.slice(0,50)}"`, customerId);
    } else {
      if(c && c.managerId) notifyUser(c.managerId, 'New message from Sales', `${state.user.name} regarding ${c.name}`, customerId);
    }
  });
}

function setFollowUp(customerId, dateStr){
  return db.ref('customers/'+customerId).update({nextFollowUp: new Date(dateStr).getTime(), updatedAt: SERVER_TS}).then(()=>{
    addTimelineEvent(customerId, 'Follow-up scheduled', `Next follow-up set for ${fmtDate(new Date(dateStr).getTime())}.`);
  });
}

function attachListeners(){
  if(state.listenersAttached) return;
  state.listenersAttached = true;

  db.ref('users').on('value', snap=>{
    state.users = snap.val() || {};
    renderSidebarUser();
    if(state.route) route(state.route, true);
  });

  db.ref('customers').on('value', snap=>{
    state.customers = snap.val() || {};
    checkSlaEscalations();
    route(state.route, true);
  });

  db.ref('settings/carModels').on('value', snap=>{
    state.carModels = snap.val() || DEFAULT_CAR_MODELS;
    if(state.route==='addcustomer' || state.route==='settings') route(state.route, true);
  });

  db.ref('settings/branches').on('value', snap=>{
    state.branches = snap.val() || DEFAULT_BRANCHES;
    if(state.route==='addcustomer' || state.route==='settings') route(state.route, true);
  });

  db.ref('customerTimeline').on('value', snap=>{
    state.timelines = snap.val() || {};
    if(state.activeCustomerId) refreshOpenProfile();
  });

  db.ref('notifications/'+state.user.uid).on('value', snap=>{
    state.notifications = snap.val() || {};

    if(state.route==='notifications') route('notifications', true);
  });

  db.ref('.info/connected').on('value', snap=>{

}

const loginForm = document.getElementById('loginForm');
loginForm.addEventListener('submit', e=>{
  e.preventDefault();
  const emailField = document.getElementById('loginEmailField');
  const passField = document.getElementById('loginPassField');
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  emailField.classList.toggle('invalid', !/^\S+@\S+\.\S+$/.test(email));
  passField.classList.toggle('invalid', pass.length===0);
  if(emailField.classList.contains('invalid') || passField.classList.contains('invalid')) return;

  const btn = document.getElementById('loginBtn');
  btn.classList.add('loading'); btn.disabled = true;
  document.getElementById('loginError').style.display='none';

  auth.signInWithEmailAndPassword(email, pass)
    .catch(err=>{
      const el = document.getElementById('loginError');
      el.textContent = friendlyAuthError(err);
      el.style.display='block';
    })
    .finally(()=>{ btn.classList.remove('loading'); btn.disabled=false; });
});
function friendlyAuthError(err){
  switch(err.code){
    case 'auth/invalid-email': return 'That email address looks invalid.';
    case 'auth/user-disabled': return 'This account has been disabled.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Incorrect email or password.';
    case 'auth/too-many-requests': return 'Too many attempts. Please wait and try again.';
    case 'auth/network-request-failed': return 'Network error — check your connection.';
    default: return 'Sign-in failed. Please try again.';
  }
}

auth.onAuthStateChanged(fbUser=>{
  if(fbUser){
    db.ref('users/'+fbUser.uid).once('value').then(snap=>{
      const profile = snap.val();
      if(!profile || profile.active===false){
        toast('Your account is inactive. Contact your administrator.','error');
        auth.signOut();
        return;
      }
      state.user = {uid: fbUser.uid, email: fbUser.email, name: profile.name || fbUser.email, role: profile.role, active: profile.active};
      showApp();
      attachListeners();
    }).catch(()=>{
      toast('Could not load your profile. Check database connectivity.','error');
      auth.signOut();

  } else {
    state.user = null;
    state.listenersAttached = false;
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').classList.remove('active');
  }
});

const TITLES = {dashboard:'Dashboard', customers:'Customers', salesteam:'Sales Team', callcenter:'Call Center',
  followups:'Follow-ups', notifications:'Notifications', reports:'Reports', settings:'Settings', addcustomer:'Add Customer'};

let searchDebounce;
document.getElementById('globalSearch').addEventListener('input', e=>{
  clearTimeout(searchDebounce);
  const v = e.target.value;
  searchDebounce = setTimeout(()=>{ state.search=v; if(state.route==='customers') route('customers', true); }, 200);
});

function route(routeId, silent){
  state.route = routeId;
  if(!silent){
    document.getElementById('globalSearch').value = state.search;
  }
  document.getElementById('topbarTitle').textContent = TITLES[routeId] || 'Dashboard';
  renderSidebarNav();
  const main = document.getElementById('mainView');
  const renderers = {
    dashboard: renderDashboard, customers: renderCustomers, salesteam: renderSalesTeam,
    callcenter: renderCallCenterOverview, followups: renderFollowups, notifications: renderNotifications,
    reports: renderReports, settings: renderSettings, addcustomer: renderAddCustomerPage
  };
  (renderers[routeId]||renderDashboard)(main);
}

/* =====================================================================
   TODAY'S FOLLOW-UP ALERT (banner + one-time toast per session)
===================================================================== */
let followupToastShown = false;
function followupBannerHtml(){
  const startToday = new Date(); startToday.setHours(0,0,0,0);
  const open = visibleCustomers().filter(c=>c.nextFollowUp && !['Sold','Lost'].includes(c.status));
  const today = open.filter(c=>isSameDay(c.nextFollowUp)).length;
  const overdue = open.filter(c=>c.nextFollowUp < startToday.getTime()).length;
  if(!today && !overdue) return '';
  if(!followupToastShown){
    followupToastShown = true;
    toast(`${today} follow-up(s) due today${overdue?`, ${overdue} overdue`:''}.`, 'info');
  }
  return `<div class="alert-banner">${iconSvg('clock',18)}
    <div class="grow">${today} follow-up${today!==1?'s':''} due today${overdue?` · <span style="color:var(--danger);">${overdue} overdue</span>`:''}</div>
    <button class="btn btn-outline btn-sm" onclick="route('followups')">View follow-ups</button></div>`;
}

function bindFilterBar(root, onChange){
  ['fStatus','fPriority','fSales','fManager','fCallcenter','fSource','fCar','fBranch'].forEach(id=>{
    const el = root.querySelector('#'+id); if(!el) return;
    const key = id.replace('f','').replace(/^./,c=>c.toLowerCase());
    el.addEventListener('change', ()=>{ state.filters[key] = el.value; onChange(); });
  });
  const clr = root.querySelector('#fClear');
  if(clr) clr.addEventListener('click', ()=>{ state.filters = {status:'',sales:'',manager:'',callcenter:'',priority:'',source:'',car:'',branch:''}; state.search=''; onChange(); });
}

  document.getElementById('addCustForm').addEventListener('submit', e=>{

    const phone = document.getElementById('in_phone').value.trim();
    const car = carSelect.value==='__other__' ? carOther.value.trim() : carSelect.value;

    let valid = true;
    toggleInvalid('f_name', !name); if(!name) valid=false;
    toggleInvalid('f_phone', !validatePhone(phone)); if(!validatePhone(phone)) valid=false;
    toggleInvalid('f_car', !car); if(!car) valid=false;
    toggleInvalid('f_manager', !managerId); if(!managerId) valid=false;
    if(!valid) return;

    const payload = {
      name, phone,
      whatsapp: document.getElementById('in_whatsapp').value.trim() || phone,
      interestedCar: car,
      budget: document.getElementById('in_budget').value || null,
      location: document.getElementById('in_location').value.trim(),
      branch: showBranch ? document.getElementById('in_branch').value : (state.branches[0]||DEFAULT_BRANCHES[0]),
      source: document.getElementById('in_source').value,
      priority: document.getElementById('in_priority').value,
      managerId,
      notes: document.getElementById('in_notes').value.trim()
    };

    const dup = Object.values(state.customers).find(c=>c.phone && c.phone.replace(/\D/g,'')===phone.replace(/\D/g,''));

      confirmDialog({
        title:'Possible duplicate customer',
        desc:`"${dup.name}" already has this phone number in the system (status: ${dup.status||'New'}). Do you still want to add a new lead?`,
        confirmLabel:'Add Anyway', danger:false,
        onConfirm: ()=>submitNewCustomer(payload)
      });
    } else {
      submitNewCustomer(payload);
    }
  });
}
function submitNewCustomer(payload){
  const btn = document.getElementById('addCustSubmit');
  btn.classList.add('loading'); btn.disabled = true;
  createCustomer(payload).then(()=>{
    toast('Customer added successfully.','success');
    route('customers');
  }).catch(err=>{
    toast('Could not save customer: '+err.message,'error');
  }).finally(()=>{ if(btn){ btn.classList.remove('loading'); btn.disabled=false; } });
}
function toggleInvalid(fieldId, isInvalid){
  const el = document.getElementById(fieldId);
  if(el) el.classList.toggle('invalid', !!isInvalid);
}

function generatePdfReport(){
  if(!(window.jspdf && window.jspdf.jsPDF)){ toast('PDF library failed to load. Check your connection.','error'); return; }
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
  const all = Object.values(state.customers);
  let y = 56;
  const line = (txt, size=11, bold=false, gap=18)=>{
    if(y>780){ doc.addPage(); y=56; }
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(size); doc.text(String(txt), 48, y); y+=gap;
  };
  line('Abu Zeid Showroom - CRM Report', 20, true, 26);
  line('Generated: '+new Date().toLocaleString(), 10, false, 26);
  line('Summary', 14, true, 22);
  const sold = all.filter(c=>c.status==='Sold').length, lost = all.filter(c=>c.status==='Lost').length;
  line('Total leads: '+all.length);
  line('Sold: '+sold+'   Lost: '+lost+'   Conversion: '+(all.length?Math.round(sold/all.length*100):0)+'%', 11, false, 26);
  line('Leads by status', 14, true, 22);
  STATUSES.forEach(st=>line(st.v+': '+all.filter(c=>c.status===st.v).length));
  y+=10; line('Sales performance', 14, true, 22);
  usersByRole('sales').forEach(r=>{
    const m = all.filter(c=>c.salesId===r.uid);
    line(r.name+' - assigned '+m.length+', interested '+m.filter(c=>c.status==='Interested').length+', sold '+m.filter(c=>c.status==='Sold').length+', lost '+m.filter(c=>c.status==='Lost').length);
  });
  y+=10; line('Leads by source', 14, true, 22);
  SOURCES.forEach(src=>{ const n = all.filter(c=>c.source===src).length; if(n) line(src+': '+n); });
  doc.save('abuzeid-report-'+new Date().toISOString().slice(0,10)+'.pdf');
  toast('PDF report downloaded.','success');
}

        <div class="info-item"><div class="k">Location</div><div class="v">${escapeHtml(c.location||'—')}</div></div>
        <div class="info-item"><div class="k">Source</div><div class="v">${escapeHtml(c.source||'—')}</div></div>
        <div class="info-item"><div class="k">Interested Car</div><div class="v">${escapeHtml(c.interestedCar||'—')}</div></div>
        <div class="info-item"><div class="k">Budget</div><div class="v">${c.budget?('EGP '+Number(c.budget).toLocaleString()):'—'}</div></div>
        <div class="info-item"><div class="k">Priority</div><div class="v"><span class="badge priority-${(c.priority||'Medium').toLowerCase()}">${escapeHtml(c.priority||'Medium')}</span></div></div>
        <div class="info-item"><div class="k">Lead Score</div><div class="v">${scoreBadge(computeLeadScore(c))}</div></div>
        <div class="info-item"><div class="k">Branch</div><div class="v">${escapeHtml(c.branch||'—')}</div></div>
      </div>
      <div class="divider"></div>
      <div class="info-grid">
        <div class="info-item"><div class="k">Created By</div><div class="v">${escapeHtml(c.createdByName||'—')}</div></div>
        <div class="info-item"><div class="k">Created Date</div><div class="v">${fmtDateTime(c.createdAt)}</div></div>
        <div class="info-item"><div class="k">Assigned Manager</div><div class="v">${escapeHtml(c.managerName||'—')}</div></div>
        <div class="info-item">
          <div class="k">Assigned Sales</div>
          <div class="v">${escapeHtml(c.salesName||'Unassigned')}
            ${(role==='manager'||role==='admin')?`<button class="btn btn-ghost btn-sm" id="btnAssignSales" style="margin-inline-start:6px;padding:3px 8px;">${c.salesName?'Reassign':'Assign'}</button>`:''}
          </div>
        </div>
        <div class="info-item span2" style="grid-column:1/-1;"><div class="k">Current Status</div>
          <div class="v"><span class="badge ${statusClass(c.status)}">${escapeHtml(c.status||'New')}</span>
          ${(role==='sales'||role==='manager'||role==='admin')?`<button class="btn btn-ghost btn-sm" id="btnChangeStatus" style="margin-inline-start:6px;padding:3px 8px;">Change</button>`:''}
          </div>
        </div>
      </div>
      ${c.notes ? `<div class="divider"></div><div class="info-item"><div class="k">Notes</div><div class="v" style="font-weight:400;">${escapeHtml(c.notes)}</div></div>`:''}
    `;
    const assignBtn = body.querySelector('#btnAssignSales');
    if(assignBtn) assignBtn.addEventListener('click', ()=>openAssignSalesModal(customerId));
    const statusBtn = body.querySelector('#btnChangeStatus');
    if(statusBtn) statusBtn.addEventListener('click', ()=>openChangeStatusModal(customerId));
  }

  else if(tab==='sales'){
    const canEdit = role==='sales' || role==='manager' || role==='admin';
    body.innerHTML = `
      <div class="info-grid">
        <div class="info-item"><div class="k">Last Contact</div><div class="v">${c.lastContact?fmtDateTime(c.lastContact):'—'}</div></div>
        <div class="info-item"><div class="k">Next Follow-up</div><div class="v">${c.nextFollowUp?fmtDate(c.nextFollowUp):'—'}</div></div>
        <div class="info-item"><div class="k">Number of Calls</div><div class="v">${c.callsCount||0}</div></div>
        <div class="info-item"><div class="k">Customer Interest</div><div class="v">${escapeHtml(c.customerInterest||'—')}</div></div>
        <div class="info-item span2" style="grid-column:1/-1;"><div class="k">Sales Feedback</div><div class="v" style="font-weight:400;">${escapeHtml(c.salesFeedback||'No feedback recorded yet.')}</div></div>
        <div class="info-item"><div class="k">Expected Purchase Date</div><div class="v">${c.expectedPurchaseDate?fmtDate(new Date(c.expectedPurchaseDate).getTime?new Date(c.expectedPurchaseDate).getTime():c.expectedPurchaseDate):'—'}</div></div>
      </div>
      ${role==='sales' ? `
      <div class="divider"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" id="btnLogCall">${iconSvg('headset',15)} Log Call</button>
        <button class="btn btn-outline btn-sm" id="btnFollowUp">${iconSvg('clock',15)} Set Follow-up</button>
        <button class="btn btn-outline btn-sm" id="btnVisit">${iconSvg('clock',15)} Schedule Visit</button>
        <button class="btn btn-outline btn-sm" id="btnWaReminder">${iconSvg('message',15)} WhatsApp Reminder</button>
        <button class="btn btn-accent btn-sm" id="btnFeedback">Add Feedback</button>
      </div>` : (role==='manager'||role==='admin') ? `
      <div class="divider"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" id="btnVisit">${iconSvg('clock',15)} Schedule Visit</button>
      </div>` : ''}
    `;
    const logBtn = body.querySelector('#btnLogCall');
    if(logBtn) logBtn.addEventListener('click', ()=>openLogCallModal(customerId));
    const fuBtn = body.querySelector('#btnFollowUp');
    if(fuBtn) fuBtn.addEventListener('click', ()=>openFollowUpModal(customerId));
    const fbBtn = body.querySelector('#btnFeedback');
    if(fbBtn) fbBtn.addEventListener('click', ()=>openFeedbackModal(customerId));
    const visitBtn = body.querySelector('#btnVisit');
    if(visitBtn) visitBtn.addEventListener('click', ()=>openScheduleVisitModal(customerId));
    const waBtn = body.querySelector('#btnWaReminder');
    if(waBtn) waBtn.addEventListener('click', ()=>sendWhatsAppReminder(customerId));
  }

  else if(tab==='timeline'){
    let events = getTimelineList(customerId);
    if(role==='callcenter') events = events.filter(e=>!['feedback','message','note'].includes(e.type));
    body.innerHTML = events.length ? `<div class="timeline">${events.slice().reverse().map(ev=>`
      <div class="tl-item">
        <div class="tl-dot ${tlDotTone(ev.action)}">${iconSvg(tlIcon(ev.action),9)}</div>
        <div class="tl-head"><span class="tl-action">${escapeHtml(ev.action||'Update')}</span><span class="tl-role">${escapeHtml(ev.role||'')}</span></div>
        <div class="tl-meta">${escapeHtml(ev.userName||'')} · ${fmtDateTime(ev.createdAt)}</div>
        ${ev.details?`<div class="tl-detail">${escapeHtml(ev.details)}</div>`:''}
      </div>`).join('')}</div>`
      : `<div class="empty-state">${iconSvg('clock',34)}<div class="title">No activity yet</div><div class="desc">Actions taken on this customer will appear here.</div></div>`;
  }

  else if(tab==='comms'){
    const events = getTimelineList(customerId).filter(e=>e.type==='message'||e.type==='note');
    if(role==='manager' && !c.salesId){
      body.innerHTML = `<div class="empty-state">${iconSvg('headset',34)}<div class="title">No sales rep assigned</div><div class="desc">Assign this lead to a sales representative to start the conversation.</div></div>`;
      return;
    }
    body.innerHTML = `
      <div class="chat-list" id="chatList">
        ${events.length ? events.map(ev=>`
          <div class="chat-bubble ${ev.role==='sales'?'sales':'manager'}">
            <div class="chat-meta">${escapeHtml(ev.userName)} · ${ev.role} · ${fmtRelative(ev.createdAt)}</div>
            ${escapeHtml(ev.message||ev.details||'')}
          </div>`).join('') : `<div class="empty-state">${iconSvg('bell',30)}<div class="title">No messages yet</div><div class="desc">Start the conversation between Manager and Sales.</div></div>`}
      </div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Write a message…"></textarea>
        <button class="btn btn-accent" id="chatSend">Send</button>
      </div>
    `;
    const list = body.querySelector('#chatList');
    if(list) list.scrollTop = list.scrollHeight;
    body.querySelector('#chatSend').addEventListener('click', ()=>{
      const ta = body.querySelector('#chatInput');
      const msg = ta.value.trim();
      if(!msg) return;
      sendChatMessage(customerId, msg).then(()=>{ ta.value=''; toast('Message sent.','success'); });
    });
  }
}
function tlIcon(action){
  if(!action) return 'clock';
  const a = action.toLowerCase();
  if(a.includes('assign')) return 'target';
  if(a.includes('status')) return 'chart';
  if(a.includes('call')) return 'headset';
  if(a.includes('feedback')) return 'bell';
  if(a.includes('follow')) return 'clock';
  if(a.includes('created')) return 'plus';
  return 'clock';
}
function tlDotTone(action){
  if(!action) return '';
  const a = action.toLowerCase();
  if(a.includes('sold')) return 'success';
  if(a.includes('lost')) return 'danger';
  if(a.includes('follow')) return 'warning';
  return '';
}

/* ---- Sub-modals launched from the profile ---- */
function openAssignSalesModal(customerId){
  const reps = usersByRole('sales');
  const c = state.customers[customerId];
  const bd = openModal(`
    <div class="modal-head"><div><h3>${c.salesId?'Reassign':'Assign'} Sales Representative</h3><div class="sub">${escapeHtml(c.name)}</div></div><button class="modal-close" data-close-modal>&times;</button></div>
    <div class="modal-body">
      <div class="field" id="f_salesSel">
        <label>Sales Representative <span class="req">*</span></label>
        <select id="salesSelect"><option value="">Select a sales rep</option>${reps.map(r=>`<option value="${r.uid}" ${c.salesId===r.uid?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}</select>
        <div class="err">Please choose a sales representative.</div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Cancel</button><button class="btn btn-accent" id="confirmAssign">Assign</button></div>
  `);
  bd.querySelector('#confirmAssign').addEventListener('click', ()=>{
    const val = bd.querySelector('#salesSelect').value;
    if(!val){ toggleInvalid('f_salesSel', true); return; }
    assignSales(customerId, val).then(()=>{ toast('Sales representative assigned.','success'); closeModal(bd); });
  });
}
function openChangeStatusModal(customerId){
  const c = state.customers[customerId];
  const bd = openModal(`
    <div class="modal-head"><div><h3>Change Status</h3><div class="sub">${escapeHtml(c.name)}</div></div><button class="modal-close" data-close-modal>&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Status</label>
        <select id="statusSelect">${STATUSES.map(s=>`<option value="${s.v}" ${c.status===s.v?'selected':''}>${s.v}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Note (optional)</label><textarea id="statusNote" rows="3" placeholder="Add context for this status change…"></textarea></div>
    </div>

  `);
  bd.querySelector('#confirmStatus').addEventListener('click', ()=>{

function openLogCallModal(customerId){

function openFollowUpModal(customerId){

function openFeedbackModal(customerId){
  const bd = openModal(`
    <div class="modal-head"><div><h3>Add Sales Feedback</h3></div><button class="modal-close" data-close-modal>&times;</button></div>
    <div class="modal-body">
      <div class="field" id="f_fb"><label>Feedback <span class="req">*</span></label><textarea id="fbText" rows="3" placeholder="e.g. Customer answered and is interested but wants to compare prices first."></textarea><div class="err">Feedback cannot be empty.</div></div>

  `);
  bd.querySelector('#confirmFb').addEventListener('click', ()=>{

function sendWhatsAppReminder(customerId){
  const c = state.customers[customerId];
  const msg = LANG==='ar'
    ? `أهلاً ${c.name}، معك ${state.user.name} من معرض أبو زيد. بتابع معاك بخصوص اهتمامك بسيارة ${c.interestedCar||''}. تحب تزور المعرض أو نحجز لك تجربة قيادة؟`
    : `Hello ${c.name}, this is ${state.user.name} from Abu Zeid Showroom. I'm following up on your interest in the ${c.interestedCar||'car'}. Would you like to visit the showroom or book a test drive?`;
  window.open(waLink(c.whatsapp||c.phone, msg), '_blank', 'noopener');
  addTimelineEvent(customerId, 'WhatsApp message', 'A WhatsApp follow-up message was opened for this customer.');
}
function openScheduleVisitModal(customerId){
  const c = state.customers[customerId];
  const today = new Date().toISOString().slice(0,10);
  const bd = openModal(`
    <div class="modal-head"><div><h3>Schedule Showroom Visit / Test Drive</h3><div class="sub">${escapeHtml(c.name)}</div></div><button class="modal-close" data-close-modal>&times;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field" id="f_vDate"><label>Date <span class="req">*</span></label><input type="date" id="visitDate" min="${today}"/><div class="err">Choose a date.</div></div>
        <div class="field"><label>Time</label><input type="time" id="visitTime" value="11:00"/></div>
      </div>
      <p style="font-size:12.5px;color:var(--gray-500);">A calendar invite (.ics) will download so you can add it to Google/Outlook/Apple Calendar.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Cancel</button><button class="btn btn-accent" id="confirmVisit">Schedule &amp; Download Invite</button></div>
  `);
  bd.querySelector('#confirmVisit').addEventListener('click', ()=>{
    const d = bd.querySelector('#visitDate').value;
    const t = bd.querySelector('#visitTime').value || '11:00';
    if(!d){ toggleInvalid('f_vDate', true); return; }
    const start = new Date(d+'T'+t+':00');
    const end = new Date(start.getTime()+60*60000);
    db.ref('customers/'+customerId).update({status:'Visit Scheduled', nextFollowUp:start.getTime(), updatedAt:SERVER_TS}).then(()=>{
      addTimelineEvent(customerId, 'Visit scheduled', `Showroom visit set for ${fmtDateTime(start.getTime())}.`);
      if(c.managerId && c.managerId!==state.user.uid) notifyUser(c.managerId, 'Visit scheduled', `${c.name}: ${fmtDateTime(start.getTime())}`, customerId);
      downloadICS('visit-'+c.name.replace(/\s+/g,'-')+'.ics', icsContent({
        title:'Showroom Visit — '+c.name,
        description:'Visit / test drive for '+(c.interestedCar||'a vehicle')+' at Abu Zeid Showroom. Phone: '+(c.phone||''),
        start, end}));
      toast('Visit scheduled.','success'); closeModal(bd);
    }).catch(err=>toast('Could not schedule: '+err.message,'error'));
  });
}
