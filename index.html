<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاعة المحكمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161d19;
    --bg-panel:#212b25;
    --panel-line:#3a4a3f;
    --wood:#3e2c1c;
    --wood-dark:#2a1d12;
    --brass:#c9a227;
    --brass-bright:#e8c34a;
    --parchment:#ece0c4;
    --parchment-dark:#ddcda3;
    --ink:#2b2216;
    --stamp-red:#8c2330;
    --stamp-green:#2f5c3f;
    --text-light:#ece6d8;
    --muted:#93a196;
    --danger:#c0463f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #223028 0%, var(--bg-deep) 55%, #0f1512 100%);
    color:var(--text-light);
    font-family:'Tajawal', sans-serif;
    padding:24px 16px 60px;
  }
  h1,h2,h3,.display{
    font-family:'Amiri', serif;
  }
  a{color:inherit;}
  .wrap{max-width:920px;margin:0 auto;}

  /* header */
  .top{
    text-align:center;
    margin-bottom:28px;
  }
  .top .eyebrow{
    color:var(--brass);
    letter-spacing:.35em;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
  }
  .top h1{
    font-size:38px;
    margin:0;
    color:var(--parchment);
    text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .top .sub{
    color:var(--muted);
    margin-top:6px;
    font-size:14px;
  }

  /* generic panel */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:26px;
    position:relative;
  }
  .panel::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(201,162,39,.18);
    border-radius:3px;
    pointer-events:none;
  }

  .parchment-card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:2px;
    padding:22px 24px;
    box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 40px rgba(120,90,40,.12);
    position:relative;
    line-height:1.9;
  }
  .parchment-card h3{
    margin:0 0 10px;
    font-size:20px;
    border-bottom:2px solid var(--wood);
    padding-bottom:8px;
  }
  .parchment-card p{margin:0 0 10px; font-size:15.5px;}
  .parchment-card .tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:#fff;
    background:var(--wood);
    padding:3px 10px;
    border-radius:2px;
    margin-bottom:12px;
  }

  /* buttons */
  .btn{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:4px;
    padding:13px 22px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
    color:var(--ink);
    background:linear-gradient(180deg, var(--brass-bright), var(--brass));
    box-shadow:0 4px 0 #8a6f19, 0 6px 14px rgba(0,0,0,.35);
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a6f19;}
  .btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
    filter:none;
  }
  .btn.secondary{
    background:transparent;
    color:var(--text-light);
    border:1px solid var(--panel-line);
    box-shadow:none;
  }
  .btn.secondary:hover{border-color:var(--brass); color:var(--brass-bright);}
  .btn.danger{
    background:linear-gradient(180deg,#c95b53,var(--danger));
    color:#fff;
    box-shadow:0 4px 0 #7c2b26, 0 6px 14px rgba(0,0,0,.35);
  }
  .btn.block{width:100%; text-align:center;}
  .btn.small{padding:8px 14px; font-size:13px;}

  input[type=text]{
    font-family:'Tajawal',sans-serif;
    width:100%;
    padding:13px 14px;
    border-radius:4px;
    border:1px solid var(--panel-line);
    background:#182019;
    color:var(--text-light);
    font-size:15px;
  }
  input[type=text]:focus{outline:2px solid var(--brass); border-color:var(--brass);}
  label.field-label{
    display:block; font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:.03em;
  }

  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .center{text-align:center;}
  .msg{
    text-align:center;
    background:rgba(140,35,48,.15);
    border:1px solid var(--danger);
    color:#ffc9c4;
    padding:10px 14px;
    border-radius:4px;
    font-size:14px;
    margin-bottom:16px;
  }

  /* welcome screen */
  .choice-cards{display:flex; gap:18px; margin-top:22px; flex-wrap:wrap;}
  .choice-card{
    flex:1; min-width:240px;
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:20px;
  }
  .choice-card h3{margin:0 0 4px; color:var(--brass-bright); font-size:19px;}
  .choice-card p{color:var(--muted); font-size:13px; margin:0 0 14px;}

  /* lobby */
  .room-code-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--wood-dark);
    border:1px dashed var(--brass);
    padding:8px 16px;
    border-radius:4px;
    font-size:22px;
    letter-spacing:.25em;
    font-weight:700;
    color:var(--brass-bright);
    font-family:'Amiri',serif;
  }
  .role-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:14px;
    margin-top:20px;
  }
  .role-card{
    background:var(--wood-dark);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .15s;
    position:relative;
  }
  .role-card:hover{border-color:var(--brass); transform:translateY(-2px);}
  .role-card.mine{border-color:var(--brass-bright); background:#2c2312; box-shadow:0 0 0 1px var(--brass-bright) inset;}
  .role-card.taken{cursor:not-allowed; opacity:.55;}
  .role-card .icon{font-size:30px; display:block; margin-bottom:8px;}
  .role-card .rname{font-weight:700; font-size:15px; margin-bottom:4px;}
  .role-card .occupant{font-size:12px; color:var(--brass-bright);}
  .role-card .empty{font-size:12px; color:var(--muted);}
  .role-card.required::after{
    content:"مطلوب";
    position:absolute; top:8px; left:8px;
    font-size:9px; color:var(--danger); font-weight:700;
  }

  /* case / papers */
  .case-header{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    margin-bottom:18px;
  }
  .role-pill{
    display:inline-block;
    background:var(--brass);
    color:var(--ink);
    font-weight:700;
    font-size:12px;
    padding:5px 12px;
    border-radius:20px;
  }
  .ready-status{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:16px;
  }
  .players-strip{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; justify-content:center;
  }
  .player-chip{
    font-size:12px;
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    padding:5px 10px;
    border-radius:20px;
    color:var(--muted);
  }
  .player-chip.ready{border-color:var(--brass); color:var(--brass-bright);}

  /* verdict / reveal */
  .verdict-btns{display:flex; gap:16px; justify-content:center; margin-top:24px; flex-wrap:wrap;}
  .verdict-btns .btn{padding:18px 32px; font-size:17px;}

  .stamp{
    display:inline-block;
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:26px;
    padding:10px 28px;
    border:4px solid currentColor;
    border-radius:6px;
    transform:rotate(-6deg) scale(0);
    letter-spacing:.05em;
    animation:stampIn .5s cubic-bezier(.2,1.4,.5,1) forwards;
    animation-delay:.15s;
  }
  .stamp.guilty{color:var(--stamp-red);}
  .stamp.innocent{color:var(--stamp-green);}
  @keyframes stampIn{
    0%{transform:rotate(-6deg) scale(2.2); opacity:0;}
    60%{opacity:1;}
    100%{transform:rotate(-6deg) scale(1); opacity:1;}
  }

  .score-table{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    font-size:14px;
  }
  .score-table th, .score-table td{
    padding:10px 12px;
    text-align:center;
    border-bottom:1px solid var(--panel-line);
  }
  .score-table th{color:var(--brass-bright); font-weight:700;}
  .score-table td.big{font-size:22px; font-weight:700; font-family:'Amiri',serif; color:var(--parchment);}

  .score-section-title{
    font-size:12px; color:var(--muted); letter-spacing:.04em;
    margin:20px 0 10px; text-align:center;
  }
  .score-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(110px,1fr));
    gap:10px;
  }
  .score-card{
    background:var(--wood-dark);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:12px 8px;
    text-align:center;
  }
  .score-card .score-role{font-size:12px; color:var(--brass-bright); font-weight:700;}
  .score-card .score-name{font-size:11px; color:var(--muted); margin:2px 0 6px;}
  .score-card .score-num{font-size:22px; font-weight:700; font-family:'Amiri',serif; color:var(--parchment);}

  .witness-rate-box{
    margin-top:18px;
    background:var(--wood-dark);
    border:1px dashed var(--panel-line);
    border-radius:6px;
    padding:14px 16px;
    text-align:right;
  }
  .witness-rate-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-top:8px; font-size:13px;
  }

  .loader{
    text-align:center;
    padding:50px 10px;
  }
  .gavel{
    font-size:44px;
    display:inline-block;
    animation:gavelSwing 1.1s ease-in-out infinite;
  }
  @keyframes gavelSwing{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-25deg);}
  }
  .loader p{color:var(--muted); margin-top:14px; font-size:14px;}

  .footer-actions{
    display:flex; justify-content:center; gap:10px; margin-top:26px; flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    .stamp, .gavel{animation:none !important;}
  }

  /* auth / profile / friends */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px; margin-bottom:18px;
  }
  .topbar-user{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    background:var(--bg-panel); border:1px solid var(--panel-line);
    padding:6px 14px 6px 6px; border-radius:30px;
  }
  .topbar-user span{font-size:14px; font-weight:700; color:var(--parchment);}
  .avatar-img{width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid var(--brass); display:block;}
  .avatar-fallback{
    width:32px; height:32px; border-radius:50%;
    background:var(--wood); color:var(--brass-bright);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; border:1px solid var(--brass);
  }
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .badge{
    display:inline-block; background:var(--danger); color:#fff;
    font-size:10px; font-weight:700; border-radius:10px;
    padding:1px 6px; margin-inline-start:4px; vertical-align:middle;
  }
  .toast{
    text-align:center;
    background:rgba(47,92,63,.18);
    border:1px solid var(--stamp-green);
    color:#bfe8cd;
    padding:10px 14px;
    border-radius:4px;
    font-size:14px;
    margin-bottom:16px;
  }
  input[type=password]{
    font-family:'Tajawal',sans-serif;
    width:100%;
    padding:13px 14px;
    border-radius:4px;
    border:1px solid var(--panel-line);
    background:#182019;
    color:var(--text-light);
    font-size:15px;
  }
  input[type=password]:focus{outline:2px solid var(--brass); border-color:var(--brass);}
  .google-btn{
    background:#fff !important; color:#3c4043 !important;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 4px 0 #b5b8bb, 0 6px 14px rgba(0,0,0,.35) !important;
  }
  .friend-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 2px; border-bottom:1px solid var(--panel-line);
    font-size:14px;
  }
  .friend-row:last-child{border-bottom:none;}

  /* المايسترو — مراحل الجلسة الحية والتايمر */
  .phase-card{
    background:var(--wood-dark);
    border:1px solid var(--brass);
    border-radius:6px;
    padding:24px 20px;
    text-align:center;
    margin-top:22px;
  }
  .phase-card .phase-icon{font-size:34px; display:block; margin-bottom:8px;}
  .phase-card .phase-label{
    font-family:'Amiri',serif; font-size:22px; color:var(--brass-bright);
    font-weight:700; margin-bottom:6px;
  }
  .phase-card .phase-desc{color:var(--muted); font-size:13px; margin:0 auto 6px; max-width:420px;}
  .my-turn-badge{
    display:inline-block;
    background:var(--stamp-green);
    color:#fff;
    font-size:12px; font-weight:700;
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .phase-timer{
    font-family:'Amiri',serif;
    font-size:42px;
    font-weight:700;
    color:var(--parchment);
    letter-spacing:.05em;
    margin:6px 0 4px;
  }
  .phase-timer.warn{color:var(--danger);}
  .phase-steps{
    display:flex; justify-content:center; gap:8px;
    margin:14px 0 4px;
  }
  .phase-step{
    width:10px; height:10px; border-radius:50%;
    background:var(--panel-line);
  }
  .phase-step.done{background:var(--brass);}
  .phase-step.active{
    background:var(--brass-bright);
    box-shadow:0 0 0 3px rgba(232,195,74,.25);
  }
  .phase-controls{
    display:flex; justify-content:center; gap:10px;
    margin-top:18px; flex-wrap:wrap;
  }

  /* شاشة طريقة اللعب */
  .howto-block{margin-bottom:22px;}
  .howto-block:last-child{margin-bottom:0;}
  .howto-block h3{
    font-size:15px; color:var(--brass-bright); margin:0 0 8px;
  }
  .howto-block p{color:var(--text-light); font-size:14px; line-height:1.9; margin:0;}
  .howto-block ul, .howto-block ol{
    margin:0; padding-inline-start:20px; color:var(--text-light);
    font-size:14px; line-height:2;
  }
  .howto-block li{margin-bottom:6px;}
  .howto-link{
    display:inline-block; color:var(--muted); font-size:12px;
    text-decoration:underline; cursor:pointer;
  }
  .howto-link:hover{color:var(--brass-bright);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">لعبة تمثيل أدوار جماعية</div>
    <h1>⚖ قاعة المحكمة</h1>
    <div class="sub">قاضٍ، متهم، شهود، ومحاميان — وقضية جديدة يولّدها الذكاء الاصطناعي في كل مرة</div>
  </div>
  <div id="app"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, set, get, update, remove, push, onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBHUWqxFsaIn442PSuieSlbhrpB7awwAw",
  authDomain: "exam-result-system-ca200.firebaseapp.com",
  databaseURL: "https://exam-result-system-ca200-default-rtdb.firebaseio.com",
  projectId: "exam-result-system-ca200",
  storageBucket: "exam-result-system-ca200.firebasestorage.app",
  messagingSenderId: "149705342999",
  appId: "1:149705342999:web:f62b7172af711a94531c52"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const auth = getAuth(fbApp);

/* ---------------- auth / profile / social state ---------------- */
let authReady = false;      // true بعد أول استجابة من onAuthStateChanged
let authUser = null;        // كائن المستخدم من Firebase Auth
let myId = null;            // = authUser.uid بعد تسجيل الدخول
let profile = null;         // { name, email, photoURL, friendCode, createdAt }
let authMode = 'login';     // 'login' | 'signup'
let authError = '';
let authBusy = false;

let view = 'app';           // 'app' | 'profile' | 'friends'  (شاشات فرعية فوق حالة الغرفة)
let profileMsg = '';        // رسالة نجاح مؤقتة (خضراء)
let toastTimer = null;

let friendsData = {};              // { uid: {name, since} }
let friendRequestsIncoming = {};   // { uid: {name, at} }
let roomInvitesIncoming = {};      // { pushId: {roomCode, fromName, fromUid, at} }

let unsubProfile=null, unsubFriends=null, unsubReqs=null, unsubInvites=null;

/* ---------------- game state ---------------- */
let roomCode = null;
let room = null;
let errorMsg = '';



const ROLES = [
  {id:'judge',       label:'القاضي',            icon:'⚖',  required:true},
  {id:'defendant',   label:'المتهم',            icon:'🧍', required:true},
  {id:'prosecution', label:'محامي الادعاء',      icon:'📜', required:true},
  {id:'defense',     label:'محامي الدفاع',       icon:'🛡', required:true},
  {id:'witness1',    label:'الشاهد الأول',       icon:'👁', required:false},
  {id:'witness2',    label:'الشاهد الثاني',      icon:'👁', required:false},
];

const roleLabel = id => (ROLES.find(r=>r.id===id)||{}).label || id;
function caseSourceLabel(src){
  if(src==='ai-anthropic') return ' · 🤖 قضية من تأليف الذكاء الاصطناعي (Claude)';
  if(src==='ai-gemini') return ' · 🤖 قضية من تأليف الذكاء الاصطناعي (Gemini)';
  if(src==='ai') return ' · 🤖 قضية من تأليف الذكاء الاصطناعي';
  return '';
}

/* ---------------- المايسترو: ترتيب مراحل الجلسة الحية وتايمر كل مرحلة ---------------- */
const PHASES = [
  {id:'prosecution', label:'مرافعة الادعاء', icon:'📜', seconds:180, desc:'محامي الادعاء يقدّم مرافعته الافتتاحية ويعرض أدلته على الحاضرين.', turnRoles:['prosecution']},
  {id:'defense',     label:'مرافعة الدفاع',   icon:'🛡', seconds:180, desc:'محامي الدفاع يرد على الاتهام ويقدّم مرافعته الافتتاحية.',       turnRoles:['defense']},
  {id:'witnesses',   label:'استجواب الشهود', icon:'👁', seconds:300, desc:'الطرفان يسألان المتهم والشهود لكشف تفاصيل القضية.',            turnRoles:['witness1','witness2','defendant','prosecution','defense']},
  {id:'deliberation',label:'المداولة الأخيرة', icon:'💬', seconds:90,  desc:'كل الأطراف تلخص موقفها في جملة أخيرة قبل ما القاضي يقرر.',      turnRoles:['prosecution','defense']},
];

function phaseRemainingSeconds(){
  if(!room || !room.session) return 0;
  const idx = room.session.phaseIndex;
  if(idx>=PHASES.length) return 0;
  const dur = PHASES[idx].seconds;
  const elapsed = Math.floor((Date.now() - (room.session.phaseStartedAt||Date.now()))/1000);
  return Math.max(0, dur - elapsed);
}
function formatPhaseTime(sec){
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ---------------- database helpers (Firebase Realtime Database) ---------------- */
const roomPath = code => `rooms/${code}`;

async function loadRoomOnce(code){
  try{
    const snap = await get(ref(db, roomPath(code)));
    return snap.exists() ? normalizeRoom(snap.val()) : null;
  }catch(e){
    return null;
  }
}
async function saveRoom(code, obj){
  try{
    await set(ref(db, roomPath(code)), obj);
    return true;
  }catch(e){
    errorMsg = 'حدث خطأ في حفظ بيانات الغرفة. تأكد من صلاحيات القراءة/الكتابة في قاعدة البيانات وحاول مرة أخرى.';
    return false;
  }
}
function normalizeRoom(r){
  if(!r) return r;
  r.players = r.players || {};
  r.readyPlayers = r.readyPlayers || [];

let unsubscribeFn = null;
function subscribeRoom(code){
  unsubscribeRoomListener();

function unsubscribeRoomListener(){
  if(unsubscribeFn){ unsubscribeFn(); unsubscribeFn=null; }

  const settings = ["شركة خاصة","محل تجاري صغير","جامعة","مبنى سكني","مكتب حكومي","مطعم","مصنع","بنك","مستشفى","حي سكني هادئ","معرض فني","مزرعة","مستشفى خاص","تطبيق توصيل طلبات"];
  const crime = crimes[Math.floor(Math.random()*crimes.length)];
  const setting = settings[Math.floor(Math.random()*settings.length)];
  const truthHint = Math.random()<0.5 ? 'مذنب' : 'بريء';

  return `أنت كاتب سيناريوهات لقضايا محاكم ضمن لعبة تمثيل أدوار جماعية (قاضٍ، متهم، شاهدان، محامي ادعاء، محامي دفاع).
اكتب قضية محكمة جديدة ومبتكرة، تهمتها متعلقة بـ"${crime}"، وقعت في سياق "${setting}".
اجعل الحقيقة النهائية أن المتهم "${truthHint}" فعلاً، لكن اجعل القضية غامضة بما يكفي بحيث لا يتضح الحكم من الملخص العام وحده، ويحتاج الحاضرون لسماع الشهود وحجج المحامين ليقرروا.
أعد الناتج بصيغة JSON صِرف فقط، بدون أي نص إضافي قبله أو بعده، وبدون علامات ماركداون، وبالمفاتيح التالية بالضبط:
{
"charge": "التهمة في جملة قصيرة",
"defendant_name": "اسم المتهم",
"truth": "guilty أو innocent (بالإنجليزية فقط بدون شرح)",
"public_brief": "ملخص القضية العام الذي يعرفه الجميع في قاعة المحكمة، فقرة واحدة تفصيلية",
"defendant_statement": "أقوال المتهم السرية عن نفسه وروايته لما حدث، فقرة قصيرة",
"witness1_name": "اسم الشاهد الأول",
"witness1_statement": "شهادة الشاهد الأول السرية، فقرة قصيرة",
"witness2_name": "اسم الشاهد الثاني",
"witness2_statement": "شهادة الشاهد الثاني السرية، بتفصيل مختلف عن الشاهد الأول",
"prosecution_notes": "أهم الأدلة والحجج السرية التي يستخدمها محامي الادعاء، فقرة قصيرة",
"defense_notes": "أهم الحجج السرية التي يستخدمها محامي الدفاع، فقرة قصيرة",
"judge_notes": "نقاط سرية يجب أن ينتبه لها القاضي عند إصدار الحكم، فقرة قصيرة"
}
استخدم اللغة العربية الفصحى المبسطة في كل النصوص، وكن مبدعًا وغير تقليدي في التفاصيل والأسماء.`;
}

function parseCaseJSON(text){
  const clean = (text||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const obj = JSON.parse(clean);
  if(!obj.truth || !obj.public_brief) throw new Error('استجابة ناقصة من الذكاء الاصطناعي');
  obj.truth = obj.truth.toLowerCase().includes('guilty') ? 'guilty' : 'innocent';
  return obj;
}

async function generateCaseWithAI(apiKey){
  const prompt = buildCasePrompt();

  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model:"claude-sonnet-5",
      max_tokens:1024,
      messages:[{role:"user", content:prompt}]
    })
  });
  if(!resp.ok){
    const errText = await resp.text().catch(()=> '');
    throw new Error('API error ' + resp.status + ' ' + errText);
  }
  const data = await resp.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return parseCaseJSON(text);
}

async function generateCaseWithGemini(apiKey){
  const prompt = buildCasePrompt();

  const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-goog-api-key": apiKey
    },
    body: JSON.stringify({
      contents:[{ role:"user", parts:[{ text: prompt }] }]
    })
  });
  if(!resp.ok){
    const errText = await resp.text().catch(()=> '');
    throw new Error('Gemini API error ' + resp.status + ' ' + errText);
  }
  const data = await resp.json();
  const parts = ((data.candidates||[])[0]||{}).content?.parts || [];
  const text = parts.map(p=>p.text||'').join('\n');
  return parseCaseJSON(text);
}

function pickFromLocalBank(){
  const used = (room.usedIndices && room.usedIndices.length < CASES.length) ? room.usedIndices : [];
  const available = CASES.map((_,i)=>i).filter(i=>!used.includes(i));
  const idx = available[Math.floor(Math.random()*available.length)];
  room.usedIndices = [...used, idx];
  return CASES[idx];
}

function beginCaseFlow(){
  if(!room) return;
  errorMsg = '';
  room.status = 'generating';
  saveRoom(roomCode, room);
  render();
  (async ()=>{
    let caseData = null;
    let usedSource = 'bank';
    let anthropicKey = '', geminiKey = '';
    try{
      const [snapA, snapG] = await Promise.all([
        get(ref(db, 'config/apiKey')),
        get(ref(db, 'config/geminiKey'))
      ]);
      anthropicKey = snapA.exists() ? snapA.val() : '';
      geminiKey = snapG.exists() ? snapG.val() : '';
    }catch(e){ /* هنكمل ببنك القضايا الجاهز لو تعذّر قراءة الإعدادات */ }

    if(anthropicKey){
      try{
        caseData = await generateCaseWithAI(anthropicKey);
        usedSource = 'ai-anthropic';
      }catch(e){
        console.error('تعذّر توليد القضية بـ Anthropic، هنجرّب مصدر تاني:', e);
      }
    }
    if(!caseData && geminiKey){
      try{
        caseData = await generateCaseWithGemini(geminiKey);
        usedSource = 'ai-gemini';
      }catch(e){
        console.error('تعذّر توليد القضية بـ Gemini، هنستخدم قضية جاهزة بدلاً منها:', e);
      }
    }
    if(!caseData){
      caseData = pickFromLocalBank();
      usedSource = 'bank';
    }
    room.case = caseData;
    room.caseSource = usedSource;
    room.status = 'in_progress';
    room.readyPlayers = [];
    room.verdict = null;
    room.session = null;
    room.witnessAwards = {};
    await saveRoom(roomCode, room);
    render();
  })();
}

function authErrMsg(e){
  const c = (e && e.code) || '';
  if(c.includes('email-already-in-use')) return 'البريد الإلكتروني ده مسجل بحساب بالفعل، جرّب تسجيل الدخول بدل الإنشاء.';
  if(c.includes('invalid-email')) return 'صيغة البريد الإلكتروني مش صحيحة.';
  if(c.includes('wrong-password') || c.includes('invalid-credential')) return 'البريد الإلكتروني أو كلمة السر غلط.';
  if(c.includes('user-not-found')) return 'مفيش حساب بالبريد ده.';
  if(c.includes('weak-password')) return 'كلمة السر دي ضعيفة، جرّب واحدة أقوى.';
  if(c.includes('popup-closed-by-user')) return 'اتقفلت نافذة الدخول قبل ما تكمل.';
  return 'حصل خطأ غير متوقع، جرّب تاني.';
}

/* إنشاء صف المستخدم في قاعدة البيانات أول مرة يسجّل فيها دخول */
async function ensureUserProfile(user, forcedName){
  const uid = user.uid;
  const snap = await get(ref(db, `users/${uid}`));
  if(snap.exists()) return;
  const name = (forcedName || user.displayName || (user.email ? user.email.split('@')[0] : 'لاعب')).trim();
  const code = await generateUniqueFriendCode();
  const newProfile = {
    name,
    email: user.email || '',
    photoURL: user.photoURL || '',
    friendCode: code,
    createdAt: Date.now()
  };
  await set(ref(db, `users/${uid}`), newProfile);
  await set(ref(db, `friendCodes/${code}`), uid);
}
async function generateUniqueFriendCode(){
  for(let i=0;i<8;i++){
    const code = genCode();
    const snap = await get(ref(db, `friendCodes/${code}`));
    if(!snap.exists()) return code;
  }
  return genCode() + Math.floor(Math.random()*9);
}

function subscribeUserListeners(uid){
  unsubscribeAllUserListeners();
  unsubProfile = onValue(ref(db, `users/${uid}`), snap=>{
    if(snap.exists()) profile = snap.val();
    render();
  });
  unsubFriends = onValue(ref(db, `friends/${uid}`), snap=>{
    friendsData = snap.exists() ? snap.val() : {};
    render();
  });
  unsubReqs = onValue(ref(db, `friendRequests/${uid}`), snap=>{
    friendRequestsIncoming = snap.exists() ? snap.val() : {};
    render();
  });
  unsubInvites = onValue(ref(db, `roomInvites/${uid}`), snap=>{
    roomInvitesIncoming = snap.exists() ? snap.val() : {};
    render();
  });
}
function unsubscribeAllUserListeners(){
  if(unsubProfile) unsubProfile();
  if(unsubFriends) unsubFriends();
  if(unsubReqs) unsubReqs();
  if(unsubInvites) unsubInvites();
  unsubProfile = unsubFriends = unsubReqs = unsubInvites = null;
  friendsData = {}; friendRequestsIncoming = {}; roomInvitesIncoming = {};
}

/* ---------------- session recovery (survive refresh / reopen) ---------------- */
const LOCAL_ROOM_KEY = 'courtroom_last_room_code';
function persistRoomCode(code){
  try{ localStorage.setItem(LOCAL_ROOM_KEY, code); }catch(e){}
}
function clearPersistedRoomCode(){
  try{ localStorage.removeItem(LOCAL_ROOM_KEY); }catch(e){}
}
function getPersistedRoomCode(){
  try{ return localStorage.getItem(LOCAL_ROOM_KEY); }catch(e){ return null; }
}

/* بمجرد ما نعرف مين المستخدم، نحاول نرجّعه لنفس الغرفة اللي كان فيها قبل الريفريش/الإغلاق */
let restoringRoom = false;
async function restoreRoomSession(){
  const savedCode = getPersistedRoomCode();
  if(!savedCode) return;
  restoringRoom = true;
  render();
  const found = await loadRoomOnce(savedCode);
  if(!found){
    // الغرفة اتقفلت أو الكود بقى قديم — امسح الحفظ وابدأ من الشاشة الرئيسية
    clearPersistedRoomCode();
    restoringRoom = false;
    return;
  }
  roomCode = savedCode;
  room = found;
  subscribeRoom(savedCode);
  restoringRoom = false;
}

onAuthStateChanged(auth, async (user)=>{
  authReady = true;
  if(!user){
    authUser = null; myId = null; profile = null;
    unsubscribeAllUserListeners();
    unsubscribeRoomListener();
    room = null; roomCode = null; view = 'app';
    render();
    return;
  }
  authUser = user;
  myId = user.uid;
  try{ await ensureUserProfile(user); }catch(e){}
  try{
    const snap = await get(ref(db, `users/${user.uid}`));
    if(snap.exists()) profile = snap.val();
  }catch(e){}
  subscribeUserListeners(user.uid);
  try{ await restoreRoomSession(); }catch(e){}
  render();
});

/* ---------------- actions (game) ---------------- */
async function createRoom(){
  if(!profile) return;
  errorMsg='';
  const code = genCode();
  const newRoom = {
    code, status:'lobby',
    players:{}, readyPlayers:[],
    case:null, verdict:null,
    score:{prosecution:0, defense:0},
    playerScores:{},
    witnessAwards:{},
    createdAt: Date.now()
  };
  const ok = await saveRoom(code, newRoom);
  if(!ok) { render(); return; }
  roomCode = code;
  room = newRoom;
  persistRoomCode(code);
  subscribeRoom(code);
  render();
}

async function joinRoomFlow(){
  const codeEl = document.getElementById('codeInput');
  const code = (codeEl.value||'').trim().toUpperCase();
  if(!code){ errorMsg='اكتب كود الغرفة'; render(); return; }
  await joinRoomByCode(code);
}
async function joinRoomByCode(code){
  const found = await loadRoomOnce(code);
  if(!found){ errorMsg='لا توجد غرفة بهذا الكود'; render(); return; }
  errorMsg='';
  roomCode = code;
  room = found;
  persistRoomCode(code);
  subscribeRoom(code);
  render();
}

async function pickRole(roleId){
  if(!room || !profile) return;
  const takenBy = Object.entries(room.players).find(([pid,p])=>p.role===roleId && pid!==myId);
  if(takenBy) return;
  room.players[myId] = {name: profile.name, role: roleId};
  await saveRoom(roomCode, room);
  render();
}

function requiredRolesFilled(){
  if(!room) return false;
  const filledRoles = Object.values(room.players).map(p=>p.role);
  return ROLES.filter(r=>r.required).every(r=>filledRoles.includes(r.id));
}

async function startSession(){
  if(!room || !roomCode || myRole()!=='judge') return;
  room.session = { phaseIndex:0, phaseStartedAt: Date.now() };
  await saveRoom(roomCode, room);
}

let autoAdvancing = false;
async function advancePhase(dir){
  if(!room || !roomCode || myRole()!=='judge') return;
  if(autoAdvancing) return;
  autoAdvancing = true;
  try{
    const current = room.session ? room.session.phaseIndex : 0;
    let idx = current + dir;
    idx = Math.max(0, Math.min(PHASES.length, idx));
    room.session = { phaseIndex: idx, phaseStartedAt: Date.now() };
    await saveRoom(roomCode, room);
  } finally {
    autoAdvancing = false;
  }
}

/* تيكر كل ثانية: يحدّث العدّاد التنازلي لكل الحاضرين، وينقل القاضي تلقائيًا للمرحلة الجاية لما الوقت يخلص */
setInterval(()=>{
  if(!room || room.status!=='in_progress' || !room.session) return;
  const idx = room.session.phaseIndex;
  if(idx>=PHASES.length) return;
  render();
  if(phaseRemainingSeconds()<=0 && myRole()==='judge' && !autoAdvancing){
    advancePhase(1);
  }
}, 1000);


async function toggleReady(){
  const idx = room.readyPlayers.indexOf(myId);
  if(idx===-1) room.readyPlayers.push(myId);
  else room.readyPlayers.splice(idx,1);
  await saveRoom(roomCode, room);
  render();
}

function myRole(){
  const p = room && room.players[myId];
  return p ? p.role : null;
}

async function submitVerdict(choice){
  room.verdict = choice;
  room.status = 'revealed';
  const truth = room.case.truth;
  if(truth === 'guilty') room.score.prosecution += 1;
  else room.score.defense += 1;
  room.playerScores = room.playerScores || {};
  if(choice === truth){
    room.playerScores[myId] = (room.playerScores[myId]||0) + 1;
  }
  await saveRoom(roomCode, room);
  render();
}

/* نقطة فردية اختيارية: القاضي يقدر يمنح شاهد نقطة "شهادة مقنعة" مرة واحدة لكل قضية — ميزة تنافسية إضافية، مش شرط لسير اللعبة */
async function awardWitnessPoint(pid){
  if(!room || myRole()!=='judge') return;
  room.witnessAwards = room.witnessAwards || {};
  if(room.witnessAwards[pid]) return;
  room.witnessAwards[pid] = true;
  room.playerScores = room.playerScores || {};
  room.playerScores[pid] = (room.playerScores[pid]||0) + 1;
  await saveRoom(roomCode, room);
  render();
}

async function newCase(){
  errorMsg='';
  await beginCaseFlow();
}

async function leaveRoom(){
  if(room && room.players[myId]){
    delete room.players[myId];
    room.readyPlayers = (room.readyPlayers||[]).filter(id=>id!==myId);
    await saveRoom(roomCode, room);
  }
  unsubscribeRoomListener();
  clearPersistedRoomCode();
  roomCode=null; room=null; errorMsg='';
  render();
}

function el(html){
  const bar = (authUser && profile) ? renderTopBarHtml() : '';
  const toastHtml = profileMsg ? `<div class="toast">${profileMsg}</div>` : '';
  document.getElementById('app').innerHTML = bar + toastHtml + html;
}

function render(){
  if(!authReady){ renderBootLoading(); return; }
  if(!authUser){ renderLogin(); return; }
  if(!profile){ renderBootLoading(); return; }
  if(restoringRoom){ renderBootLoading('جارٍ استرجاع مكانك في الغرفة...'); return; }
  if(view==='profile'){ renderProfile(); return; }
  if(view==='friends'){ renderFriends(); return; }
  if(view==='howto'){ renderHowTo(); return; }
  if(!room){ renderWelcome(); return; }
  if(room.status==='lobby') { renderLobby(); return; }
  if(room.status==='generating'){ renderGenerating(); return; }
  if(room.status==='in_progress'){ renderCase(); return; }
  if(room.status==='revealed'){ renderReveal(); return; }
  renderWelcome();
}

function paperForRole(role, c){
  const map = {
    judge: {title:'ملف القاضي', tag:'عام', body:[c.public_brief, '— دورك: مفيش عندك أي معلومة سرية زيادة عن اللي في الملخص ده. استمع كويس لأقوال المتهم والشهود وحجج المحامين وقت الجلسة، واحكم بناءً على اللي هتسمعه فعلاً.']},
    defendant: {title:'ملف المتهم', tag:'سري - المتهم فقط', body:[c.public_brief, '— أقوالك: ' + c.defendant_statement]},
    witness1: {title:'ملف الشاهد الأول', tag:'سري - '+ (c.witness1_name||'الشاهد الأول'), body:[c.public_brief, `— شهادتك (${c.witness1_name}): ` + c.witness1_statement]},
    witness2: {title:'ملف الشاهد الثاني', tag:'سري - '+ (c.witness2_name||'الشاهد الثاني'), body:[c.public_brief, `— شهادتك (${c.witness2_name}): ` + c.witness2_statement]},
    prosecution: {title:'ملف محامي الادعاء', tag:'سري - محامي الادعاء', body:[c.public_brief, '— حجتك: ' + c.prosecution_notes]},
    defense: {title:'ملف محامي الدفاع', tag:'سري - محامي الدفاع', body:[c.public_brief, '— حجتك: ' + c.defense_notes]},
  };
  return map[role] || {title:'الملف العام', tag:'عام', body:[c.public_brief]};
}

function renderCase(){
  const c = room.case;
  const role = myRole();
  if(!role){
    el(`${errBlock()}<div class="panel center"><p>أنت لست جزءًا من هذه الجلسة. عد للغرفة السابقة أو انضم من جديد.</p><button class="btn secondary" onclick="leaveRoom()">رجوع</button></div>`);
    return;
  }
  const paper = paperForRole(role, c);
  const ready = room.readyPlayers.includes(myId);
  const nonJudgeIds = Object.entries(room.players).filter(([pid,p])=>p.role!=='judge').map(([pid])=>pid);
  const readySet = new Set(room.readyPlayers);
  const readyCount = nonJudgeIds.filter(id=>readySet.has(id)).length;
  const totalNonJudge = nonJudgeIds.length;
  const allReady = totalNonJudge>0 && readyCount>=totalNonJudge;

  const chips = Object.entries(room.players).map(([pid,p])=>{
    const r = room.readyPlayers.includes(pid);
    return `<span class="player-chip ${r?'ready':''}">${p.name} · ${roleLabel(p.role)}${r?' ✓':''}</span>`;
  }).join('');

  const session = room.session || null;
  const sessionStarted = !!session;
  const phaseIdx = session ? session.phaseIndex : -1;
  const sessionDone = sessionStarted && phaseIdx >= PHASES.length;

  let actionBlock = '';

  if(!sessionStarted){
    /* -------- المرحلة الأولى: مراجعة الأوراق قبل ما تبدأ الجلسة الحية -------- */
    if(role==='judge' && allReady){
      actionBlock = `
        <div class="center" style="margin-top:22px;">
          <div style="color:var(--brass-bright); font-weight:700; margin-bottom:10px;">كل الأطراف انتهت من مراجعة أوراقها</div>
          <button class="btn" onclick="startSession()">⚖ ابدأ الجلسة الحية</button>
        </div>`;
    } else if(role==='judge' && !allReady){
      actionBlock = `<div class="ready-status">بانتظار انتهاء باقي الأطراف من مراجعة أوراقهم (${readyCount}/${totalNonJudge})...</div>`;
    } else if(!ready){
      actionBlock = `<div class="center" style="margin-top:22px;"><button class="btn" onclick="toggleReady()">✔ انتهيت من مراجعة أوراقي</button></div>`;
    } else {
      actionBlock = `<div class="ready-status">تم — بانتظار باقي الأطراف ثم بدء القاضي للجلسة (${readyCount}/${totalNonJudge} جاهزون)...<br>
        <button class="btn secondary small" style="margin-top:10px;" onclick="toggleReady()">لسه عايز أراجع ورقتي — تراجع</button></div>`;
    }
  } else if(!sessionDone){
    /* -------- المايسترو: مرحلة حية بتايمر -------- */
    const phase = PHASES[phaseIdx];
    const remaining = phaseRemainingSeconds();
    const warn = remaining <= 15;
    const isMyTurn = phase.turnRoles.includes(role);
    const steps = PHASES.map((p,i)=>`<span class="phase-step ${i<phaseIdx?'done':''} ${i===phaseIdx?'active':''}"></span>`).join('');

    actionBlock = `
      <div class="phase-card">
        <span class="phase-icon">${phase.icon}</span>
        <div class="phase-label">${phase.label}</div>
        <p class="phase-desc">${phase.desc}</p>
        ${isMyTurn ? `<div class="my-turn-badge">🎤 دورك دلوقتي</div>` : ''}
        <div class="phase-timer ${warn?'warn':''}">${formatPhaseTime(remaining)}</div>
        <div class="phase-steps">${steps}</div>
        ${role==='judge' ? `
          <div class="phase-controls">
            <button class="btn secondary small" ${phaseIdx<=0?'disabled':''} onclick="advancePhase(-1)">◀ السابقة</button>
            <button class="btn small" onclick="advancePhase(1)">${phaseIdx===PHASES.length-1?'إنهاء الجلسة والانتقال للحكم ▶':'المرحلة التالية ▶'}</button>
          </div>
        ` : `<div class="ready-status" style="margin-top:14px;">القاضي هو اللي بيتحكم في الانتقال بين المراحل</div>`}
      </div>`;
  } else {
    /* -------- كل المراحل خلصت — وقت الحكم -------- */
    if(role==='judge'){
      actionBlock = `
        <div class="center" style="margin-top:22px;">
          <div style="color:var(--brass-bright); font-weight:700; margin-bottom:6px;">كل مراحل الجلسة انتهت — اصدر حكمك</div>
          <div class="verdict-btns">
            <button class="btn danger" onclick="submitVerdict('guilty')">مذنب</button>
            <button class="btn" onclick="submitVerdict('innocent')">غير مذنب</button>
          </div>
        </div>`;
    } else {
      actionBlock = `<div class="ready-status">كل مراحل الجلسة انتهت — القاضي بيصدر الحكم الآن...</div>`;
    }
  }

  el(`
    ${errBlock()}
    <div class="panel">
      <div class="case-header">
        <div class="role-pill">دورك: ${roleLabel(role)}</div>
        <div style="color:var(--muted); font-size:12px;">التهمة: ${c.charge} — المتهم: ${c.defendant_name} ${caseSourceLabel(room.caseSource)}</div>
        <button class="btn secondary small" onclick="confirmLeaveMidSession()">مغادرة الجلسة</button>
      </div>
      <div style="text-align:center; color:var(--muted); font-size:12px; margin:-6px 0 14px;">
        📖 ورقتك هتفضل ظاهرة قدامك طول الوقت لحد ما القاضي يصدر الحكم النهائي
      </div>
      <div class="parchment-card">
        <span class="tag">${paper.tag}</span>
        <h3>${paper.title}</h3>
        ${paper.body.map(p=>`<p>${p}</p>`).join('')}
      </div>
      ${actionBlock}
      <div class="players-strip">${chips}</div>
    </div>
  `);
}

function renderReveal(){
  const c = room.case;
  const role = myRole();
  const truthGuilty = c.truth === 'guilty';
  const verdictGuilty = room.verdict === 'guilty';
  const judgeCorrect = truthGuilty === verdictGuilty;
  const iAmJudge = role==='judge';

  const prosecutorName = (Object.values(room.players).find(p=>p.role==='prosecution')||{}).name || 'محامي الادعاء';
  const defenderName = (Object.values(room.players).find(p=>p.role==='defense')||{}).name || 'محامي الدفاع';

  const playerScores = room.playerScores || {};
  const witnessAwards = room.witnessAwards || {};
  const judgeEntry = Object.entries(room.players).find(([pid,p])=>p.role==='judge');
  const witnessEntries = Object.entries(room.players).filter(([pid,p])=>p.role==='witness1'||p.role==='witness2');

  const witnessScoreCards = witnessEntries.map(([pid,p])=>`
    <div class="score-card">
      <div class="score-role">👁 ${roleLabel(p.role)}</div>
      <div class="score-name">${p.name}</div>
      <div class="score-num">${playerScores[pid]||0}</div>
    </div>`).join('');

  const witnessRateBox = (iAmJudge && witnessEntries.length>0) ? `
    <div class="witness-rate-box">
      <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">تقييم اختياري: امنح نقطة لأي شاهد قدّم شهادة مقنعة في القضية دي</div>
      ${witnessEntries.map(([pid,p])=>`
        <div class="witness-rate-row">
          <span>${p.name} (${roleLabel(p.role)})</span>
          <button class="btn small" ${witnessAwards[pid]?'disabled':''} onclick="awardWitnessPoint('${pid}')">${witnessAwards[pid]?'✔ اتقيّم':'+ نقطة شهادة مقنعة'}</button>
        </div>`).join('')}
    </div>` : '';

  el(`
    ${errBlock()}
    <div class="panel center">
      <div style="color:var(--muted); font-size:13px; margin-bottom:4px;">حكم القاضي كان:</div>
      <div style="font-size:18px; font-weight:700; margin-bottom:18px;">${verdictGuilty? 'مذنب' : 'غير مذنب'}</div>

      <div class="stamp ${truthGuilty?'guilty':'innocent'}">${truthGuilty? 'الحقيقة: مذنب' : 'الحقيقة: بريء'}</div>

      <p style="margin-top:18px; color:${judgeCorrect? 'var(--brass-bright)':'var(--danger)'}; font-weight:700;">
        ${judgeCorrect? '✔ القاضي أصاب في حكمه!' : '✘ القاضي أخطأ في حكمه.'}
      </p>

      <div class="parchment-card" style="text-align:right; margin-top:20px;">
        <span class="tag">القصة الكاملة</span>
        <h3>${c.charge}</h3>
        <p>${c.public_brief}</p>
        <p><b>أقوال المتهم:</b> ${c.defendant_statement}</p>
        ${c.witness1_name?`<p><b>شهادة ${c.witness1_name}:</b> ${c.witness1_statement}</p>`:''}
        ${c.witness2_name?`<p><b>شهادة ${c.witness2_name}:</b> ${c.witness2_statement}</p>`:''}
        <p><b>حجة الادعاء:</b> ${c.prosecution_notes}</p>
        <p><b>حجة الدفاع:</b> ${c.defense_notes}</p>
      </div>

      <div class="score-section-title">لوحة النقاط الفردية</div>
      <div class="score-grid">
        <div class="score-card">
          <div class="score-role">📜 الادعاء</div>
          <div class="score-name">${prosecutorName}</div>
          <div class="score-num">${room.score.prosecution}</div>
        </div>
        <div class="score-card">
          <div class="score-role">🛡 الدفاع</div>
          <div class="score-name">${defenderName}</div>
          <div class="score-num">${room.score.defense}</div>
        </div>
        ${judgeEntry ? `
        <div class="score-card">
          <div class="score-role">⚖ القاضي</div>
          <div class="score-name">${judgeEntry[1].name}</div>
          <div class="score-num">${playerScores[judgeEntry[0]]||0}</div>
        </div>` : ''}
        ${witnessScoreCards}
      </div>
      ${witnessRateBox}

      <div class="footer-actions">
        ${iAmJudge ? `<button class="btn" onclick="newCase()">⚖ قضية جديدة</button>` : `<div class="ready-status">بانتظار أن يبدأ القاضي قضية جديدة...</div>`}
        <button class="btn secondary" onclick="leaveRoom()">مغادرة الغرفة</button>
      </div>
    </div>
  `);
}

render();

window.doEmailSignIn = doEmailSignIn;

window.sendFriendRequestByCode = sendFriendRequestByCode;

window.declineFriendRequest = declineFriendRequest;

window.acceptRoomInvite = acceptRoomInvite;
window.dismissRoomInvite = dismissRoomInvite;

</script>
