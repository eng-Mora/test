<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاعة المحكمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161d19;
    --bg-panel:#212b25;
    --panel-line:#3a4a3f;
    --wood:#3e2c1c;
    --wood-dark:#2a1d12;
    --brass:#c9a227;
    --brass-bright:#e8c34a;
    --parchment:#ece0c4;
    --parchment-dark:#ddcda3;
    --ink:#2b2216;
    --stamp-red:#8c2330;
    --stamp-green:#2f5c3f;
    --text-light:#ece6d8;
    --muted:#93a196;
    --danger:#c0463f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #223028 0%, var(--bg-deep) 55%, #0f1512 100%);
    color:var(--text-light);
    font-family:'Tajawal', sans-serif;
    padding:24px 16px 60px;
  }
  h1,h2,h3,.display{
    font-family:'Amiri', serif;
  }
  a{color:inherit;}
  .wrap{max-width:920px;margin:0 auto;}

  /* header */
  .top{
    text-align:center;
    margin-bottom:28px;
  }
  .top .eyebrow{
    color:var(--brass);
    letter-spacing:.35em;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
  }
  .top h1{
    font-size:38px;
    margin:0;
    color:var(--parchment);
    text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .top .sub{
    color:var(--muted);
    margin-top:6px;
    font-size:14px;
  }

  /* generic panel */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:26px;
    position:relative;
  }
  .panel::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(201,162,39,.18);
    border-radius:3px;
    pointer-events:none;
  }

  .parchment-card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:2px;
    padding:22px 24px;
    box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 40px rgba(120,90,40,.12);
    position:relative;
    line-height:1.9;
  }
  .parchment-card h3{
    margin:0 0 10px;
    font-size:20px;
    border-bottom:2px solid var(--wood);
    padding-bottom:8px;
  }
  .parchment-card p{margin:0 0 10px; font-size:15.5px;}
  .parchment-card .tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:#fff;
    background:var(--wood);
    padding:3px 10px;
    border-radius:2px;
    margin-bottom:12px;
  }

  /* buttons */
  .btn{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:4px;
    padding:13px 22px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
    color:var(--ink);
    background:linear-gradient(180deg, var(--brass-bright), var(--brass));
    box-shadow:0 4px 0 #8a6f19, 0 6px 14px rgba(0,0,0,.35);
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a6f19;}
  .btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
    filter:none;
  }
  .btn.secondary{
    background:transparent;
    color:var(--text-light);
    border:1px solid var(--panel-line);
    box-shadow:none;
  }
  .btn.secondary:hover{border-color:var(--brass); color:var(--brass-bright);}
  .btn.danger{
    background:linear-gradient(180deg,#c95b53,var(--danger));
    color:#fff;
    box-shadow:0 4px 0 #7c2b26, 0 6px 14px rgba(0,0,0,.35);
  }
  .btn.block{width:100%; text-align:center;}
  .btn.small{padding:8px 14px; font-size:13px;}

  input[type=text]{
    font-family:'Tajawal',sans-serif;
    width:100%;
    padding:13px 14px;
    border-radius:4px;
    border:1px solid var(--panel-line);
    background:#182019;
    color:var(--text-light);
    font-size:15px;
  }
  input[type=text]:focus{outline:2px solid var(--brass); border-color:var(--brass);}
  label.field-label{
    display:block; font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:.03em;
  }

  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .center{text-align:center;}
  .msg{
    text-align:center;
    background:rgba(140,35,48,.15);
    border:1px solid var(--danger);
    color:#ffc9c4;
    padding:10px 14px;
    border-radius:4px;
    font-size:14px;
    margin-bottom:16px;
  }

  /* welcome screen */
  .choice-cards{display:flex; gap:18px; margin-top:22px; flex-wrap:wrap;}
  .choice-card{
    flex:1; min-width:240px;
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:20px;
  }
  .choice-card h3{margin:0 0 4px; color:var(--brass-bright); font-size:19px;}
  .choice-card p{color:var(--muted); font-size:13px; margin:0 0 14px;}

  /* lobby */
  .room-code-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--wood-dark);
    border:1px dashed var(--brass);
    padding:8px 16px;
    border-radius:4px;
    font-size:22px;
    letter-spacing:.25em;
    font-weight:700;
    color:var(--brass-bright);
    font-family:'Amiri',serif;
  }
  .role-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:14px;
    margin-top:20px;
  }
  .role-card{
    background:var(--wood-dark);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .15s;
    position:relative;
  }
  .role-card:hover{border-color:var(--brass); transform:translateY(-2px);}
  .role-card.mine{border-color:var(--brass-bright); background:#2c2312; box-shadow:0 0 0 1px var(--brass-bright) inset;}
  .role-card.taken{cursor:not-allowed; opacity:.55;}
  .role-card .icon{font-size:30px; display:block; margin-bottom:8px;}
  .role-card .rname{font-weight:700; font-size:15px; margin-bottom:4px;}
  .role-card .occupant{font-size:12px; color:var(--brass-bright);}
  .role-card .empty{font-size:12px; color:var(--muted);}
  .role-card.required::after{
    content:"مطلوب";
    position:absolute; top:8px; left:8px;
    font-size:9px; color:var(--danger); font-weight:700;
  }

  /* case / papers */
  .case-header{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    margin-bottom:18px;
  }
  .role-pill{
    display:inline-block;
    background:var(--brass);
    color:var(--ink);
    font-weight:700;
    font-size:12px;
    padding:5px 12px;
    border-radius:20px;
  }
  .ready-status{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:16px;
  }
  .players-strip{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; justify-content:center;
  }
  .player-chip{
    font-size:12px;
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    padding:5px 10px;
    border-radius:20px;
    color:var(--muted);
  }
  .player-chip.ready{border-color:var(--brass); color:var(--brass-bright);}

  /* verdict / reveal */
  .verdict-btns{display:flex; gap:16px; justify-content:center; margin-top:24px; flex-wrap:wrap;}
  .verdict-btns .btn{padding:18px 32px; font-size:17px;}

  .stamp{
    display:inline-block;
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:26px;
    padding:10px 28px;
    border:4px solid currentColor;
    border-radius:6px;
    transform:rotate(-6deg) scale(0);
    letter-spacing:.05em;
    animation:stampIn .5s cubic-bezier(.2,1.4,.5,1) forwards;
    animation-delay:.15s;
  }
  .stamp.guilty{color:var(--stamp-red);}
  .stamp.innocent{color:var(--stamp-green);}
  @keyframes stampIn{
    0%{transform:rotate(-6deg) scale(2.2); opacity:0;}
    60%{opacity:1;}
    100%{transform:rotate(-6deg) scale(1); opacity:1;}
  }

  .score-table{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    font-size:14px;
  }
  .score-table th, .score-table td{
    padding:10px 12px;
    text-align:center;
    border-bottom:1px solid var(--panel-line);
  }
  .score-table th{color:var(--brass-bright); font-weight:700;}
  .score-table td.big{font-size:22px; font-weight:700; font-family:'Amiri',serif; color:var(--parchment);}

  .loader{
    text-align:center;
    padding:50px 10px;
  }
  .gavel{
    font-size:44px;
    display:inline-block;
    animation:gavelSwing 1.1s ease-in-out infinite;
  }
  @keyframes gavelSwing{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-25deg);}
  }
  .loader p{color:var(--muted); margin-top:14px; font-size:14px;}

  .footer-actions{
    display:flex; justify-content:center; gap:10px; margin-top:26px; flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    .stamp, .gavel{animation:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">لعبة تمثيل أدوار جماعية</div>
    <h1>⚖ قاعة المحكمة</h1>
    <div class="sub">قاضٍ، متهم، شهود، ومحاميان — وقضية جديدة يولّدها الذكاء الاصطناعي في كل مرة</div>
  </div>
  <div id="app"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBHUWqxFsaIn442PSuieSlbhrpB7awwAw",
  authDomain: "exam-result-system-ca200.firebaseapp.com",
  databaseURL: "https://exam-result-system-ca200-default-rtdb.firebaseio.com",
  projectId: "exam-result-system-ca200",
  storageBucket: "exam-result-system-ca200.firebasestorage.app",
  messagingSenderId: "149705342999",
  appId: "1:149705342999:web:f62b7172af711a94531c52"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

/* ---------------- state ---------------- */
const myId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()));
let myName = '';
let roomCode = null;
let room = null;
let errorMsg = '';
let generating = false;

const ROLES = [
  {id:'judge',       label:'القاضي',            icon:'⚖',  required:true},
  {id:'defendant',   label:'المتهم',            icon:'🧍', required:true},
  {id:'prosecution', label:'محامي الادعاء',      icon:'📜', required:true},
  {id:'defense',     label:'محامي الدفاع',       icon:'🛡', required:true},
  {id:'witness1',    label:'الشاهد الأول',       icon:'👁', required:false},
  {id:'witness2',    label:'الشاهد الثاني',      icon:'👁', required:false},
];
const roleLabel = id => (ROLES.find(r=>r.id===id)||{}).label || id;

/* ---------------- database helpers (Firebase Realtime Database) ---------------- */
const roomPath = code => `rooms/${code}`;

async function loadRoomOnce(code){
  try{
    const snap = await get(ref(db, roomPath(code)));
    return snap.exists() ? normalizeRoom(snap.val()) : null;
  }catch(e){
    return null;
  }
}
async function saveRoom(code, obj){
  try{
    await set(ref(db, roomPath(code)), obj);
    return true;
  }catch(e){
    errorMsg = 'حدث خطأ في حفظ بيانات الغرفة. تأكد من صلاحيات القراءة/الكتابة في قاعدة البيانات وحاول مرة أخرى.';
    return false;
  }
}
function normalizeRoom(r){
  if(!r) return r;
  r.players = r.players || {};
  r.readyPlayers = r.readyPlayers || [];
  r.score = r.score || {prosecution:0, defense:0};
  return r;
}
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* ---------------- realtime subscription ---------------- */
let unsubscribeFn = null;
function subscribeRoom(code){
  unsubscribeRoomListener();
  unsubscribeFn = onValue(ref(db, roomPath(code)), (snapshot)=>{
    room = snapshot.exists() ? normalizeRoom(snapshot.val()) : null;
    render();
  });
}
function unsubscribeRoomListener(){
  if(unsubscribeFn){ unsubscribeFn(); unsubscribeFn=null; }
}

/* ---------------- case bank (pre-written, chosen at random each round) ---------------- */
const CASES = [
  {
    charge:"سرقة مجوهرات من محل", defendant_name:"كريم عادل", truth:"innocent",
    public_brief:"في مساء يوم الجمعة اختفت قطعة ألماس ثمينة من محل مجوهرات وسط البلد أثناء ازدحام العملاء. كريم عادل، الموظف المسؤول عن الخزانة في تلك الليلة، هو المتهم الوحيد لأنه آخر من فتح الخزانة قبل اكتشاف الفقدان، ولأن كاميرات المراقبة كانت معطلة تلك الليلة بالتحديد.",
    defendant_statement:"أقسم إني فتحت الخزانة مرة واحدة بس عشان أطلب لعميلة، وقفلتها فورًا. الكاميرات كانت عاطلة من الصبح والمحل بلّغ الصيانة قبل الحادثة بيوم، ده مش مسؤوليتي.",
    witness1_name:"سارة يوسف", witness1_statement:"أنا زميلته في الشيفت، شفت راجل غريب واقف جنب الخزانة وقت الزحمة وكان لابس شنطة كبيرة، مكنش من الموظفين، بس محدش لاحظه غير أنا.",
    witness2_name:"مدير المحل هشام", witness2_statement:"كريم موظف ملتزم من سنتين ومعندوش أي مشكلة مالية سابقة، لكن الإدارة ضغطت عليّا أوجه الاتهام له عشان نقفل الملف بسرعة قبل التحقيق الرسمي.",
    prosecution_notes:"كريم هو الوحيد اللي كان له صلاحية فتح الخزانة في وقت الحادثة، وغياب كاميرات المراقبة يثير الشك في أنه دبّر توقيت السرقة.",
    defense_notes:"عطل الكاميرات مسجل رسميًا قبل الحادثة بيوم كامل، وشهادة سارة عن الرجل الغريب لم يتم التحقيق فيها إطلاقًا رغم أهميتها.",
    judge_notes:"ركّز على توقيت عطل الكاميرات مقابل توقيت السرقة، وعلى مصداقية شهادة الموظفة الثانية التي لم تُستكشف."
  },
  {
    charge:"احتيال مالي عبر مشروع استثماري وهمي", defendant_name:"أحمد الشريف", truth:"guilty",
    public_brief:"جمع أحمد الشريف مبالغ من عشرات المستثمرين تحت اسم صندوق استثمار عقاري موعود بعائد شهري ثابت 15%. بعد ستة أشهر توقفت المدفوعات فجأة واختفى أحمد لفترة قبل أن يُقبض عليه في مطار القاهرة وهو يحاول السفر.",
    defendant_statement:"المشروع كان حقيقي بس فشل بسبب الأزمة الاقتصادية، أنا مش نصاب، أنا كمان خسرت فلوسي فيه، وكنت مسافر لشغل تاني مش هروب.",
    witness1_name:"المحاسب وليد", witness1_statement:"شغلت مع أحمد كمحاسب، ومن الشهر التاني اكتشفت إنه بيحول جزء كبير من فلوس المستثمرين لحسابه الشخصي مش للمشروع، حذرته وهدد يفصلني لو اتكلمت.",
    witness2_name:"مستثمرة منى", witness2_statement:"دفعت مدخرات حياتي كلها ووعدني بعقد ملكية رسمي لشقق مش موجودة أصلاً، لما سألت عن الأرض اللي المفروض البناء عليها لقيتها مش مسجلة باسم أي شركة تابعة له.",
    prosecution_notes:"لا يوجد أي سجل رسمي لأرض أو مشروع عقاري باسم الشركة، وتحويلات بنكية توثق انتقال أموال المستثمرين لحساب أحمد الشخصي مباشرة.",
    defense_notes:"وجود عقد استثمار موقع من المستثمرين يثبت نية تجارية حقيقية، والأزمة الاقتصادية أثرت فعلاً على مشاريع مشابهة في نفس الفترة.",
    judge_notes:"التركيز الأهم هنا هو مصدر التحويلات البنكية: هل ذهبت لتنفيذ المشروع فعلاً أم لحساب شخصي؟ شهادة المحاسب حاسمة."
  },
  {
    charge:"اختلاس أموال من شركة", defendant_name:"ليلى حسن", truth:"innocent",
    public_brief:"اكتُشف عجز مالي قدره 200 ألف جنيه في حسابات قسم المشتريات بشركة أدوية. ليلى حسن، أمينة الصندوق، كانت صاحبة كلمة السر الوحيدة على النظام المحاسبي وقت حدوث التحويلات المشبوهة، فوُجّه لها الاتهام مباشرة.",
    defendant_statement:"كلمة السر بتاعتي مكنتش سرية زي ما المفروض، كنت مضطرة أشاركها مع مديري المباشر عشان يوقّع تحويلات وأنا في إجازة الوضع، وده حصل قبل اكتشاف العجز بأسبوعين بالظبط.",
    witness1_name:"مسؤول الحسابات سامي", witness1_statement:"لاحظت إن التحويلات المشبوهة كلها تمت في أوقات كانت ليلى فيها في إجازتها الرسمية المسجلة في نظام الموارد البشرية، ده غريب لو هي اللي عملاها.",
    witness2_name:"مدير المشتريات فادي", witness2_statement:"أنا اللي طلبت من ليلى كلمة السر مؤقتًا وقت إجازتها لأسباب عمل ضرورية، ونسيت أغيرها بعدها، ده تقصير مني للأسف.",
    prosecution_notes:"العجز ظهر في حساب مرتبط رسميًا باسم ليلى حسن وكلمة سرها فقط، وهي المسؤولة القانونية عن أمانة الصندوق بحكم منصبها.",
    defense_notes:"سجلات الموارد البشرية تثبت أن ليلى كانت في إجازة أثناء كل التحويلات المشبوهة، وشهادة فادي تؤكد أنه استخدم كلمة سرها بنفسه في تلك الفترة.",
    judge_notes:"طابق بين تواريخ التحويلات المشبوهة وتواريخ إجازة ليلى الرسمية، فهذا التقاطع هو جوهر القضية."
  },
  {
    charge:"تزوير شهادة جامعية", defendant_name:"يوسف رمزي", truth:"guilty",
    public_brief:"تقدّم يوسف رمزي لوظيفة مهندس في شركة مقاولات كبرى بشهادة بكالوريوس هندسة من جامعة مرموقة. أثناء المراجعة الروتينية اكتشف قسم الموارد البشرية أن رقم الشهادة غير مسجل في قاعدة بيانات الجامعة الرسمية.",
    defendant_statement:"الشهادة أصلية ومصدق عليها من الجامعة، ممكن يكون في خطأ في قاعدة بياناتهم، أنا اتخرجت فعلاً وعندي كل الأوراق.",
    witness1_name:"موظف شؤون الطلاب بالجامعة عمرو", witness1_statement:"راجعت الأرشيف بنفسي، مفيش أي طالب بالاسم ده اتسجل في الكلية خلال السنوات المذكورة على الشهادة، والختم المستخدم قديم ومش الشكل الرسمي الحالي من ٣ سنين.",

function beginCaseFlow(){
  if(!room) return;
  errorMsg = '';
  room.status = 'generating';
  saveRoom(roomCode, room);
  render();
  setTimeout(async ()=>{
    const used = (room.usedIndices && room.usedIndices.length < CASES.length) ? room.usedIndices : [];
    const available = CASES.map((_,i)=>i).filter(i=>!used.includes(i));
    const idx = available[Math.floor(Math.random()*available.length)];
    room.case = CASES[idx];
    room.usedIndices = [...used, idx];
    room.status = 'in_progress';
    room.readyPlayers = [];
    room.verdict = null;
    await saveRoom(roomCode, room);
    render();
  }, 650);
}

/* ---------------- actions ---------------- */
async function createRoom(){
  const nameEl = document.getElementById('nameInput');
  myName = (nameEl.value||'').trim();
  if(!myName){ errorMsg='اكتب اسمك أولاً'; render(); return; }
  errorMsg='';
  const code = genCode();
  const newRoom = {
    code, status:'lobby',
    players:{}, readyPlayers:[],
    case:null, verdict:null,
    score:{prosecution:0, defense:0},
    createdAt: Date.now()
  };
  const ok = await saveRoom(code, newRoom);
  if(!ok) { render(); return; }
  roomCode = code;
  room = newRoom;
  subscribeRoom(code);
  render();
}

async function joinRoomFlow(){
  const nameEl = document.getElementById('nameInput');
  const codeEl = document.getElementById('codeInput');
  myName = (nameEl.value||'').trim();
  const code = (codeEl.value||'').trim().toUpperCase();
  if(!myName){ errorMsg='اكتب اسمك أولاً'; render(); return; }
  if(!code){ errorMsg='اكتب كود الغرفة'; render(); return; }
  const found = await loadRoomOnce(code);
  if(!found){ errorMsg='لا توجد غرفة بهذا الكود'; render(); return; }
  errorMsg='';
  roomCode = code;
  room = found;
  subscribeRoom(code);
  render();
}

async function pickRole(roleId){
  if(!room) return;
  const takenBy = Object.entries(room.players).find(([pid,p])=>p.role===roleId && pid!==myId);
  if(takenBy) return;
  room.players[myId] = {name: myName, role: roleId};
  await saveRoom(roomCode, room);
  render();
}

function requiredRolesFilled(){
  if(!room) return false;
  const filledRoles = Object.values(room.players).map(p=>p.role);
  return ROLES.filter(r=>r.required).every(r=>filledRoles.includes(r.id));
}

async function toggleReady(){
  const idx = room.readyPlayers.indexOf(myId);
  if(idx===-1) room.readyPlayers.push(myId);
  else room.readyPlayers.splice(idx,1);
  await saveRoom(roomCode, room);
  render();
}

function myRole(){
  const p = room && room.players[myId];
  return p ? p.role : null;
}

async function submitVerdict(choice){
  room.verdict = choice;
  room.status = 'revealed';
  const truth = room.case.truth;
  if(truth === 'guilty') room.score.prosecution += 1;
  else room.score.defense += 1;
  await saveRoom(roomCode, room);
  render();
}

async function newCase(){
  errorMsg='';
  await beginCaseFlow();
}

async function leaveRoom(){
  if(room && room.players[myId]){
    delete room.players[myId];
    room.readyPlayers = (room.readyPlayers||[]).filter(id=>id!==myId);
    await saveRoom(roomCode, room);
  }
  unsubscribeRoomListener();
  roomCode=null; room=null; errorMsg='';
  render();
}

async function copyCode(){
  try{ await navigator.clipboard.writeText(roomCode); }catch(e){}
}

/* ---------------- render ---------------- */
function el(html){ document.getElementById('app').innerHTML = html; }

function render(){
  if(errorMsg) window._pendingErr = errorMsg;
  if(!room){ renderWelcome(); return; }
  if(room.status==='lobby') { renderLobby(); return; }
  if(room.status==='generating'){ renderGenerating(); return; }
  if(room.status==='in_progress'){ renderCase(); return; }
  if(room.status==='revealed'){ renderReveal(); return; }
  renderWelcome();
}

function errBlock(){
  return errorMsg ? `<div class="msg">${errorMsg}</div>` : '';
}

function renderWelcome(){
  el(`
    ${errBlock()}
    <div class="panel">
      <label class="field-label">اسمك</label>
      <input type="text" id="nameInput" placeholder="اكتب اسمك هنا" value="${myName.replace(/"/g,'')}">
      <div class="choice-cards">
        <div class="choice-card">
          <h3>🏛 أنشئ غرفة جديدة</h3>
          <p>ابدأ محاكمة جديدة واحصل على كود تشاركه مع أصدقائك.</p>
          <button class="btn block" onclick="createRoom()">إنشاء غرفة</button>
        </div>
        <div class="choice-card">
          <h3>🔑 انضم لغرفة</h3>
          <p>عندك كود من صديقك؟ ادخل الغرفة وحدد دورك.</p>
          <label class="field-label">كود الغرفة</label>
          <input type="text" id="codeInput" placeholder="مثال: X7K2P" style="text-transform:uppercase; margin-bottom:12px;">
          <button class="btn secondary block" onclick="joinRoomFlow()">انضمام</button>
        </div>
      </div>
    </div>
  `);
}

function renderLobby(){
  const players = room.players;
  const rolesHtml = ROLES.map(r=>{
    const occ = Object.entries(players).find(([pid,p])=>p.role===r.id);
    const mine = occ && occ[0]===myId;
    const taken = occ && !mine;
    return `
      <div class="role-card ${mine?'mine':''} ${taken?'taken':''} ${r.required?'required':''}" ${taken?'':`onclick="pickRole('${r.id}')"`}>
        <span class="icon">${r.icon}</span>
        <div class="rname">${r.label}</div>
        ${occ ? `<div class="occupant">${occ[1].name}${mine?' (أنت)':''}</div>` : `<div class="empty">اضغط للاختيار</div>`}
      </div>`;
  }).join('');

  const iAmJudge = myRole()==='judge';
  const filled = requiredRolesFilled();
  const playerCount = Object.keys(players).length;

  el(`
    ${errBlock()}
    <div class="panel">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>
          <div style="color:var(--muted); font-size:12px; margin-bottom:6px;">كود الغرفة — شارك هذا الرابط + الكود مع باقي اللاعبين</div>
          <div class="room-code-badge">${roomCode}
            <button class="btn small secondary" onclick="copyCode()">نسخ</button>
          </div>
        </div>
        <button class="btn secondary small" onclick="leaveRoom()">مغادرة</button>
      </div>

      <h2 style="margin:26px 0 4px; font-size:22px;">اختر دورك في القضية</h2>
      <p style="color:var(--muted); font-size:13px; margin:0 0 4px;">القاضي، المتهم، ومحامي الادعاء والدفاع أدوار أساسية. الشهود اختياريون.</p>
      <div class="role-grid">${rolesHtml}</div>

      <div class="footer-actions">
        ${iAmJudge
          ? `<button class="btn" ${filled?'':'disabled'} onclick="beginCaseFlow()">🔨 بدء القضية (${playerCount} لاعب)</button>`
          : `<div style="color:var(--muted); font-size:13px;">بانتظار أن يبدأ القاضي القضية...</div>`
        }
      </div>
      ${!filled ? `<div class="ready-status">لازم يكون فيه: القاضي، المتهم، محامي الادعاء، ومحامي الدفاع قبل البدء.</div>` : ''}
    </div>
  `);
}

function renderGenerating(){
  el(`
    <div class="panel loader">
      <span class="gavel">🔨</span>
      <h2 style="margin:14px 0 0;">جارٍ إعداد ملف القضية...</h2>
      <p>الذكاء الاصطناعي يكتب تفاصيل قضية جديدة لهذه الجلسة</p>
    </div>
  `);
}

function paperForRole(role, c){
  const map = {
    judge: {title:'ملف القاضي', tag:'سري - القاضي فقط', body:[c.public_brief, '— ملاحظات: ' + c.judge_notes]},
    defendant: {title:'ملف المتهم', tag:'سري - المتهم فقط', body:[c.public_brief, '— أقوالك: ' + c.defendant_statement]},
    witness1: {title:'ملف الشاهد الأول', tag:'سري - '+ (c.witness1_name||'الشاهد الأول'), body:[c.public_brief, `— شهادتك (${c.witness1_name}): ` + c.witness1_statement]},
    witness2: {title:'ملف الشاهد الثاني', tag:'سري - '+ (c.witness2_name||'الشاهد الثاني'), body:[c.public_brief, `— شهادتك (${c.witness2_name}): ` + c.witness2_statement]},
    prosecution: {title:'ملف محامي الادعاء', tag:'سري - محامي الادعاء', body:[c.public_brief, '— حجتك: ' + c.prosecution_notes]},
    defense: {title:'ملف محامي الدفاع', tag:'سري - محامي الدفاع', body:[c.public_brief, '— حجتك: ' + c.defense_notes]},
  };
  return map[role] || {title:'الملف العام', tag:'عام', body:[c.public_brief]};
}

function renderCase(){
  const c = room.case;
  const role = myRole();
  if(!role){
    el(`${errBlock()}<div class="panel center"><p>أنت لست جزءًا من هذه الجلسة. عد للغرفة السابقة أو انضم من جديد.</p><button class="btn secondary" onclick="leaveRoom()">رجوع</button></div>`);
    return;
  }
  const paper = paperForRole(role, c);
  const ready = room.readyPlayers.includes(myId);
  const nonJudgeIds = Object.entries(room.players).filter(([pid,p])=>p.role!=='judge').map(([pid])=>pid);
  const readySet = new Set(room.readyPlayers);
  const readyCount = nonJudgeIds.filter(id=>readySet.has(id)).length;
  const totalNonJudge = nonJudgeIds.length;
  const allReady = totalNonJudge>0 && readyCount>=totalNonJudge;

  const chips = Object.entries(room.players).map(([pid,p])=>{
    const r = room.readyPlayers.includes(pid);
    return `<span class="player-chip ${r?'ready':''}">${p.name} · ${roleLabel(p.role)}${r?' ✓':''}</span>`;
  }).join('');

  let actionBlock = '';
  if(role==='judge' && allReady){
    actionBlock = `
      <div class="center" style="margin-top:22px;">
        <div style="color:var(--brass-bright); font-weight:700; margin-bottom:6px;">كل الأطراف انتهت — اصدر حكمك</div>
        <div class="verdict-btns">
          <button class="btn danger" onclick="submitVerdict('guilty')">مذنب</button>
          <button class="btn" onclick="submitVerdict('innocent')">غير مذنب</button>
        </div>
      </div>`;
  } else if(role==='judge' && !allReady){
    actionBlock = `<div class="ready-status">بانتظار انتهاء باقي الأطراف من مراجعة أوراقهم (${readyCount}/${totalNonJudge})...</div>`;
  } else if(!ready){
    actionBlock = `<div class="center" style="margin-top:22px;"><button class="btn" onclick="toggleReady()">✔ انتهيت من مراجعة أوراقي</button></div>`;
  } else {
    actionBlock = `<div class="ready-status">تم — بانتظار القاضي (${readyCount}/${totalNonJudge} جاهزون)...<br>
      <button class="btn secondary small" style="margin-top:10px;" onclick="toggleReady()">لسه عايز أراجع ورقتي — تراجع</button></div>`;
  }

  el(`
    ${errBlock()}
    <div class="panel">
      <div class="case-header">
        <div class="role-pill">دورك: ${roleLabel(role)}</div>
        <div style="color:var(--muted); font-size:12px;">التهمة: ${c.charge} — المتهم: ${c.defendant_name}</div>
      </div>
      <div style="text-align:center; color:var(--muted); font-size:12px; margin:-6px 0 14px;">
        📖 ورقتك هتفضل ظاهرة قدامك طول الوقت لحد ما القاضي يصدر الحكم النهائي
      </div>
      <div class="parchment-card">
        <span class="tag">${paper.tag}</span>
        <h3>${paper.title}</h3>
        ${paper.body.map(p=>`<p>${p}</p>`).join('')}
      </div>
      ${actionBlock}
      <div class="players-strip">${chips}</div>
    </div>
  `);
}

function renderReveal(){
  const c = room.case;
  const role = myRole();
  const truthGuilty = c.truth === 'guilty';
  const verdictGuilty = room.verdict === 'guilty';
  const judgeCorrect = truthGuilty === verdictGuilty;
  const iAmJudge = role==='judge';

  const prosecutorName = (Object.values(room.players).find(p=>p.role==='prosecution')||{}).name || 'محامي الادعاء';
  const defenderName = (Object.values(room.players).find(p=>p.role==='defense')||{}).name || 'محامي الدفاع';

  el(`
    ${errBlock()}
    <div class="panel center">
      <div style="color:var(--muted); font-size:13px; margin-bottom:4px;">حكم القاضي كان:</div>
      <div style="font-size:18px; font-weight:700; margin-bottom:18px;">${verdictGuilty? 'مذنب' : 'غير مذنب'}</div>

      <div class="stamp ${truthGuilty?'guilty':'innocent'}">${truthGuilty? 'الحقيقة: مذنب' : 'الحقيقة: بريء'}</div>

      <p style="margin-top:18px; color:${judgeCorrect? 'var(--brass-bright)':'var(--danger)'}; font-weight:700;">
        ${judgeCorrect? '✔ القاضي أصاب في حكمه!' : '✘ القاضي أخطأ في حكمه.'}
      </p>

      <div class="parchment-card" style="text-align:right; margin-top:20px;">
        <span class="tag">القصة الكاملة</span>
        <h3>${c.charge}</h3>
        <p>${c.public_brief}</p>
        <p><b>أقوال المتهم:</b> ${c.defendant_statement}</p>
        ${c.witness1_name?`<p><b>شهادة ${c.witness1_name}:</b> ${c.witness1_statement}</p>`:''}
        ${c.witness2_name?`<p><b>شهادة ${c.witness2_name}:</b> ${c.witness2_statement}</p>`:''}
        <p><b>حجة الادعاء:</b> ${c.prosecution_notes}</p>
        <p><b>حجة الدفاع:</b> ${c.defense_notes}</p>
      </div>

      <table class="score-table">
        <tr><th>محامي الادعاء<br><span style="font-weight:400; font-size:12px;">${prosecutorName}</span></th><th>محامي الدفاع<br><span style="font-weight:400; font-size:12px;">${defenderName}</span></th></tr>
        <tr><td class="big">${room.score.prosecution}</td><td class="big">${room.score.defense}</td></tr>
      </table>

      <div class="footer-actions">
        ${iAmJudge ? `<button class="btn" onclick="newCase()">⚖ قضية جديدة</button>` : `<div class="ready-status">بانتظار أن يبدأ القاضي قضية جديدة...</div>`}
        <button class="btn secondary" onclick="leaveRoom()">مغادرة الغرفة</button>
      </div>
    </div>
  `);
}

render();

/* expose functions used by inline onclick handlers — ES modules don't auto-attach to window */
window.createRoom = createRoom;
window.joinRoomFlow = joinRoomFlow;
window.pickRole = pickRole;
window.beginCaseFlow = beginCaseFlow;
window.toggleReady = toggleReady;
window.submitVerdict = submitVerdict;
window.newCase = newCase;
window.leaveRoom = leaveRoom;
window.copyCode = copyCode;
</script>
</body>
</html>
