<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الأدمن — قاعة المحكمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161d19;
    --bg-panel:#212b25;
    --panel-line:#3a4a3f;
    --wood-dark:#2a1d12;
    --brass:#c9a227;
    --brass-bright:#e8c34a;
    --parchment:#ece0c4;
    --text-light:#ece6d8;
    --muted:#93a196;
    --danger:#c0463f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at top, #223028 0%, var(--bg-deep) 55%, #0f1512 100%);
    color:var(--text-light);
    font-family:'Tajawal', sans-serif;
    padding:24px 16px 60px;
  }
  h1,h2,h3{font-family:'Amiri', serif;}
  .wrap{max-width:560px;margin:0 auto;}
  .top{text-align:center;margin-bottom:24px;}
  .top .eyebrow{color:var(--brass);letter-spacing:.3em;font-size:11px;font-weight:700;margin-bottom:8px;}
  .top h1{font-size:28px;margin:0;color:var(--parchment);}
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:26px;
  }
  .btn{
    font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:14px;
    border:none; border-radius:4px;
    padding:11px 18px; cursor:pointer;
    color:var(--bg-deep);
    background:linear-gradient(180deg, var(--brass-bright), var(--brass));
    box-shadow:0 4px 0 #8a6f19;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #8a6f19;}
  .btn.secondary{background:transparent;color:var(--text-light);border:1px solid var(--panel-line);box-shadow:none;}
  .btn.danger{background:linear-gradient(180deg,#c95b53,var(--danger));color:#fff;box-shadow:0 4px 0 #7c2b26;}
  .btn.small{padding:8px 14px; font-size:13px;}
  input[type=text]{
    font-family:'Tajawal',sans-serif; width:100%;
    padding:12px 14px; border-radius:4px;
    border:1px solid var(--panel-line);
    background:#182019; color:var(--text-light); font-size:14px;
  }
  input[type=text]:focus{outline:2px solid var(--brass); border-color:var(--brass);}
  .field-label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .msg{
    text-align:center;
    background:rgba(140,35,48,.15);
    border:1px solid var(--danger);
    color:#ffc9c4;
    padding:10px 14px; border-radius:4px;
    font-size:13px; margin-bottom:16px;
  }
  .toast{
    text-align:center;
    background:rgba(47,92,63,.2);
    border:1px solid var(--brass);
    color:var(--brass-bright);
    padding:10px 14px; border-radius:4px;
    font-size:13px; margin-bottom:16px;
  }
  .section-title{font-size:15px; margin:22px 0 4px; color:var(--parchment);}
  .hint{color:var(--muted); font-size:12px; margin:0 0 10px; line-height:1.7;}
  .keyval{color:var(--muted); font-size:13px; margin-bottom:8px;}
  .keyval b{color:var(--brass-bright);}
  .warn{
    color:var(--danger); font-size:12px; margin-top:20px; line-height:1.8;
    border-top:1px dashed var(--panel-line); padding-top:14px;
  }
  hr{border:none; border-top:1px solid var(--panel-line); margin:22px 0;}

  /* toggle switch لتفعيل/تعطيل بانر التحديث */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px;
  }
  .toggle-row .toggle-label{font-size:14px; color:var(--text-light);}
  .toggle-row .toggle-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .switch{
    position:relative; display:inline-block;
    width:46px; height:26px; flex-shrink:0; cursor:pointer;
  }
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{
    position:absolute; inset:0; cursor:pointer;
    background:#182019; border:1px solid var(--panel-line);
    border-radius:26px; transition:.15s;
  }
  .switch .slider::before{
    content:""; position:absolute;
    height:18px; width:18px; left:3px; bottom:3px;
    background:var(--muted); border-radius:50%; transition:.15s;
  }
  .switch input:checked + .slider{background:rgba(47,92,63,.5); border-color:var(--brass);}
  .switch input:checked + .slider::before{
    transform:translateX(-20px); background:var(--brass-bright);
  }
  .status-badge{
    display:inline-block; font-size:11px; font-weight:700;
    padding:3px 10px; border-radius:20px; margin-bottom:10px;
  }
  .status-badge.on{background:rgba(47,92,63,.25); color:var(--brass-bright); border:1px solid var(--brass);}
  .status-badge.off{background:rgba(147,161,150,.12); color:var(--muted); border:1px solid var(--panel-line);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">إدارة اللعبة</div>
    <h1>⚙ لوحة تحكم الأدمن</h1>
  </div>
  <div id="app"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, get, set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* نفس بيانات مشروع Firebase المستخدمة في ملف اللعبة — لازم تفضل مطابقة له بالظبط */
const firebaseConfig = {
  apiKey: "AIzaSyD0d5_Xhq6RulHn1QtYsV6RDmeSe1wg100",
  authDomain: "courtroom-game-18f21.firebaseapp.com",
  databaseURL: "https://courtroom-game-18f21-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "courtroom-game-18f21",
  storageBucket: "courtroom-game-18f21.firebasestorage.app",
  messagingSenderId: "995762969667",
  appId: "1:995762969667:web:d6275b12a6eecab1cd08f6",
  measurementId: "G-H7FHRSDTNW"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const auth = getAuth(fbApp);
const googleProvider = new GoogleAuthProvider();

/* الإيميل الوحيد المسموح له بدخول لوحة التحكم */
const ALLOWED_ADMIN_EMAIL = 'mamro8529@gmail.com';

let authReady = false;
let authUser = null;

let unlocked = false;
let currentKey = '';
let currentGeminiKey = '';
let updateEnabled = false;
let updateMessage = '';
let updateLink = '';
let errorMsg = '';
let toastMsg = '';
let toastTimer = null;

function toast(msg){
  toastMsg = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=''; render(); }, 2500);
}

function el(html){ document.getElementById('app').innerHTML = html; }
function msgBlock(){
  if(errorMsg) return `<div class="msg">${errorMsg}</div>`;
  if(toastMsg) return `<div class="toast">${toastMsg}</div>`;
  return '';
}

async function loadConfigKeys(){
  try{
    const [snapA, snapG, snapU] = await Promise.all([
      get(ref(db, 'config/apiKey')),
      get(ref(db, 'config/geminiKey')),
      get(ref(db, 'config/update'))
    ]);
    currentKey = snapA.exists() ? snapA.val() : '';
    currentGeminiKey = snapG.exists() ? snapG.val() : '';
    const u = snapU.exists() ? (snapU.val()||{}) : {};
    updateEnabled = !!u.enabled;
    updateMessage = u.message || '';
    updateLink = u.link || '';
  }catch(e){ currentKey=''; currentGeminiKey=''; updateEnabled=false; updateMessage=''; updateLink=''; }
}

async function doGoogleLogin(){
  errorMsg = '';
  try{
    await signInWithPopup(auth, googleProvider);
    /* onAuthStateChanged هيتكفل بتحديث الحالة وعمل render */
  }catch(e){
    console.error('Google sign-in error:', e);
    errorMsg = googleLoginErrorMessage(e);
    render();
  }
}

function googleLoginErrorMessage(e){
  const code = (e && e.code) || '';
  if(code.includes('unauthorized-domain')) return 'الدومين اللي فاتح منه الصفحة دي مش مضاف في Authorized domains على Firebase (Authentication → Settings).';
  if(code.includes('operation-not-allowed')) return 'خاصية الدخول بجوجل مش مفعّلة على المشروع (Authentication → Sign-in method → فعّل Google).';
  if(code.includes('popup-blocked')) return 'المتصفح قفل نافذة الدخول (Popup). فعّل الـ popups لموقع الصفحة دي وجرّب تاني.';
  if(code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'اتقفلت نافذة الدخول قبل ما تكمل، جرّب تاني.';
  if(code.includes('network-request-failed')) return 'فيه مشكلة في الاتصال بالإنترنت، جرّب تاني.';
  return `تعذّر تسجيل الدخول بجوجل (${code || 'خطأ غير معروف'}). افتح Console في أدوات المطوّر عشان تشوف التفاصيل.`;
}

async function logout(){
  try{ await signOut(auth); }catch(e){}
}

onAuthStateChanged(auth, async (user)=>{
  authReady = true;
  authUser = user;
  if(user && user.email === ALLOWED_ADMIN_EMAIL){
    unlocked = true;
    errorMsg = '';
    await loadConfigKeys();
  } else {
    unlocked = false;
    currentKey = ''; currentGeminiKey = '';
    if(user && user.email !== ALLOWED_ADMIN_EMAIL){
      errorMsg = 'الحساب ده مش مصرّح له بدخول لوحة التحكم.';
      try{ await signOut(auth); }catch(e){}
      authUser = null;
    }
  }
  render();
});

async function saveApiKey(){
  const val = ((document.getElementById('apiKeyInput')||{}).value || '').trim();
  if(!val){ errorMsg = 'اكتب المفتاح الأول'; render(); return; }
  try{
    await set(ref(db, 'config/apiKey'), val);
    currentKey = val;
    errorMsg = '';
    toast('تم حفظ مفتاح Anthropic ✔');
  }catch(e){
    errorMsg = 'حصل خطأ في حفظ المفتاح، جرّب تاني';
    render();
  }
}
async function clearApiKey(){
  try{
    await set(ref(db, 'config/apiKey'), '');
    currentKey = '';
    toast('تم مسح مفتاح Anthropic');
  }catch(e){ render(); }
}
async function saveGeminiKey(){
  const val = ((document.getElementById('geminiKeyInput')||{}).value || '').trim();
  if(!val){ errorMsg = 'اكتب مفتاح Gemini'; render(); return; }
  try{
    await set(ref(db, 'config/geminiKey'), val);
    currentGeminiKey = val;
    errorMsg = '';
    toast('تم حفظ مفتاح Gemini ✔');
  }catch(e){
    errorMsg = 'حصل خطأ في حفظ المفتاح، جرّب تاني';
    render();
  }
}
async function clearGeminiKey(){
  try{
    await set(ref(db, 'config/geminiKey'), '');
    currentGeminiKey = '';
    toast('تم مسح مفتاح Gemini');
  }catch(e){ render(); }
}

/* بانر تحديث اختياري: بيظهر للاعبين رسالة + رابط تحميل النسخة الجديدة (فلاتر)،
   واللاعب حر يتجاهله ويكمل يلعب بالنسخة الحالية */
async function toggleUpdateBanner(checked){
  updateEnabled = checked;
  if(checked && !updateLink){
    errorMsg = 'محتاج تكتب رابط التحميل الأول قبل ما تفعّل البانر';
    updateEnabled = false;
    render();
    return;
  }
  try{
    await set(ref(db, 'config/update'), {
      enabled: updateEnabled,
      message: updateMessage,
      link: updateLink
    });
    errorMsg = '';
    toast(updateEnabled ? 'تم تفعيل بانر التحديث ✔' : 'تم تعطيل بانر التحديث');
    render();
  }catch(e){
    errorMsg = 'حصل خطأ، جرّب تاني';
    updateEnabled = !checked;
    render();
  }
}

async function saveUpdateBanner(){
  const link = ((document.getElementById('updateLinkInput')||{}).value || '').trim();
  const message = ((document.getElementById('updateMsgInput')||{}).value || '').trim();
  if(!link){ errorMsg = 'اكتب رابط التحميل'; render(); return; }
  updateLink = link;
  updateMessage = message;
  try{
    await set(ref(db, 'config/update'), {
      enabled: updateEnabled,
      message: updateMessage,
      link: updateLink
    });
    errorMsg = '';
    toast('تم حفظ بيانات التحديث ✔');
  }catch(e){
    errorMsg = 'حصل خطأ في الحفظ، جرّب تاني';
    render();
  }
}

function render(){
  if(!authReady){
    el(`<div class="panel" style="text-align:center; color:var(--muted);">جارٍ التحقق من الحساب...</div>`);
    return;
  }
  if(!unlocked){
    el(`
      ${msgBlock()}
      <div class="panel" style="text-align:center;">
        <h2 style="margin-top:0; font-size:19px;">دخول الأدمن</h2>
        <p class="hint">لوحة التحكم دي متاحة بس لحساب جوجل المصرّح له.</p>
        <div class="row" style="justify-content:center;">
          <button class="btn" onclick="doGoogleLogin()">تسجيل الدخول بجوجل</button>
        </div>
      </div>
    `);
    return;
  }
  const masked = currentKey
    ? (currentKey.slice(0,8) + '••••••••' + currentKey.slice(-4))
    : 'لا يوجد مفتاح محفوظ حاليًا';
  const maskedGemini = currentGeminiKey
    ? (currentGeminiKey.slice(0,8) + '••••••••' + currentGeminiKey.slice(-4))
    : 'لا يوجد مفتاح محفوظ حاليًا';
  el(`
    ${msgBlock()}
    <div class="panel">
      <p class="keyval" style="margin-bottom:18px;">مسجّل دخول باسم: <b>${authUser.email}</b></p>
      <p class="hint">
        اللعبة بتجرّب Anthropic أولًا، ولو مفيش مفتاح أو حصل خطأ (زي انتهاء الليميت) بتجرّب Gemini، ولو الاتنين مش متاحين بترجع تلقائيًا لبنك القضايا الجاهز من غير ما تتعطل.
      </p>

      <div class="section-title">مفتاح Anthropic (Claude)</div>
      <p class="keyval">المفتاح الحالي: <b>${masked}</b></p>
      <input type="text" id="apiKeyInput" placeholder="sk-ant-...">
      <div class="row">
        <button class="btn small" onclick="saveApiKey()">حفظ مفتاح Anthropic</button>
        ${currentKey ? `<button class="btn danger small" onclick="clearApiKey()">مسح مفتاح Anthropic</button>` : ''}
      </div>

      <hr>

      <div class="section-title">مفتاح Gemini</div>
      <p class="keyval">المفتاح الحالي: <b>${maskedGemini}</b></p>
      <input type="text" id="geminiKeyInput" placeholder="AIza...">
      <div class="row">
        <button class="btn small" onclick="saveGeminiKey()">حفظ مفتاح Gemini</button>
        ${currentGeminiKey ? `<button class="btn danger small" onclick="clearGeminiKey()">مسح مفتاح Gemini</button>` : ''}
      </div>

      <hr>

      <div class="section-title">تحديث اللعبة (النسخة الجديدة / فلاتر)</div>
      <p class="hint">
        لما تفعّل البانر، هيظهر للاعبين إشعار فيه الرسالة اللي هتكتبها + رابط تحميل النسخة الجديدة — في نسخة الويب وفي تطبيق الفلاتر مع بعض في نفس اللحظة (نفس المصدر config/update). البانر مجرّد تحذير اختياري — اللاعب يقدر يتجاهله ويكمل يلعب بالنسخة الحالية عادي.
      </p>
      <span class="status-badge ${updateEnabled?'on':'off'}">${updateEnabled?'● البانر مفعّل دلوقتي':'○ البانر متعطّل'}</span>

      <div class="toggle-row" style="margin-top:8px;">
        <div>
          <div class="toggle-label">إظهار بانر التحديث للاعبين</div>
          <div class="toggle-sub">لازم تحفظ رابط التحميل الأول قبل ما تقدر تفعّله</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="updateEnabledToggle" ${updateEnabled?'checked':''} onchange="toggleUpdateBanner(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <label class="field-label">رابط تحميل النسخة الجديدة</label>
      <input type="text" id="updateLinkInput" placeholder="https://..." value="${updateLink.replace(/"/g,'&quot;')}">

      <label class="field-label" style="margin-top:12px;">رسالة تظهر للاعبين (اختياري)</label>
      <input type="text" id="updateMsgInput" placeholder="مثال: فيه نسخة جديدة للعبة، حمّلها من هنا" value="${updateMessage.replace(/"/g,'&quot;')}">

      <div class="row">
        <button class="btn small" onclick="saveUpdateBanner()">حفظ بيانات التحديث</button>
      </div>

      <hr>

      <div class="row" style="margin-top:22px;">
        <button class="btn secondary" onclick="logout()">تسجيل خروج</button>
      </div>

      <p class="warn">
        ⚠ تنبيه أمان: أي مفتاح تحفظه هنا هيتشغل مباشرة من متصفح اللاعبين وقت توليد قضية، يعني أي حد يفتح أدوات المطور (Developer Tools/Network) وقتها ممكن يشوفه.
        استخدم مفاتيح بحد إنفاق (spending limit) محدود، ومتحطش مفتاح حسابك الأساسي.
        الصفحة دي منفصلة تمامًا عن ملف اللعبة، فشيّلها في مكان تاني ومتشاركهاش مع اللاعبين.
        <br><br>
        تسجيل الدخول بجوجل بيمنع أي حد تاني من الدخول للوحة دي من الواجهة، لكن ده وحده مش كافي — لازم كمان تظبط Rules في Firebase Realtime Database بحيث القراءة/الكتابة على المسار <b>config/</b> تبقى مقصورة على حساب الأدمن (مثلاً auth.token.email === '${'mamro8529@gmail.com'}')، وإلا أي حد يعرف بنية القاعدة يقدر يوصل للمفاتيح مباشرة من غير ما يعدي على الصفحة دي أصلاً.
      </p>
    </div>
  `);
}

window.doGoogleLogin = doGoogleLogin;
window.logout = logout;
window.saveApiKey = saveApiKey;
window.clearApiKey = clearApiKey;
window.saveGeminiKey = saveGeminiKey;
window.clearGeminiKey = clearGeminiKey;
window.toggleUpdateBanner = toggleUpdateBanner;
window.saveUpdateBanner = saveUpdateBanner;

render();
</script>
</body>
</html>
